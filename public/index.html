<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI PRO</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* APP */
.app{
width:95%;
max-width:420px;
background:#0c1224;
border-radius:20px;
padding:20px;
}

/* SCREEN */
.screen{
display:none;
animation:fade 0.3s ease;
}

.screen.active{
display:block;
}

@keyframes fade{
from{opacity:0;transform:scale(0.98);}
to{opacity:1;transform:scale(1);}
}

/* BUTTON */
button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
background:#00ff9d;
font-weight:bold;
cursor:pointer;
}

/* ITEM */
.item{
padding:12px;
margin:8px 0;
background:#111a33;
border-radius:10px;
cursor:pointer;
}

.item.active{
border:1px solid #00ff9d;
}

/* SIGNAL */
.signal{
font-size:55px;
text-align:center;
margin-top:20px;
}

.bar{
height:8px;
background:#1a1f35;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
animation:load 5s linear forwards;
}

@keyframes load{
from{width:100%;}
to{width:0%;}
}

</style>

</head>

<body>

<div class="app">

<!-- SCREEN 1 -->
<div class="screen active" id="screen1">
<h3>🔄 ACTUALISER MARCHÉS</h3>
<button onclick="loadMarkets()">SCAN</button>
<div id="markets"></div>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="screen2">
<h3>📊 CHOIX MARCHÉ</h3>
<div id="marketList"></div>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="screen3">
<h3>⏱ TIMEFRAME</h3>
<button onclick="setTime('1m')">1 MIN</button>
<button onclick="setTime('5m')">5 MIN</button>
<button onclick="setTime('15m')">15 MIN</button>
</div>

<!-- SCREEN 4 -->
<div class="screen" id="screen4">
<h3>🧠 ANALYSE</h3>
<div class="bar"><div class="fill"></div></div>
<button onclick="analyze()">START ANALYSE</button>
</div>

<!-- SCREEN 5 -->
<div class="screen" id="screen5">
<div class="signal" id="signal">---</div>
<button onclick="restart()">🔁 NOUVELLE ANALYSE</button>
</div>

</div>

<script>

let markets = [];
let selected = "";
let time = "";

/* ================= SCREEN ================= */
function go(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* ================= LOAD MARKETS ================= */
function loadMarkets(){

markets = [
"BTCUSD","ETHUSD","EURUSD","GBPUSD","USDJPY",
"GOLD","NAS100","SPX500","GER40","AUDUSD",
"NZDUSD","USDCAD","XAUUSD","XAGUSD","BTCUSDT"
];

let div = document.getElementById("marketList");
div.innerHTML = "";

markets.forEach(m=>{
let el=document.createElement("div");
el.className="item";
el.innerText=m;

el.onclick=()=>{
selected=m;
go("screen3");
};

div.appendChild(el);
});

go("screen2");
}

/* ================= TIME ================= */
function setTime(t){
time=t;
go("screen4");
}

/* ================= ANALYSE ================= */
async function analyze(){

let res = await fetch(`/api/${selected}/${time}`);
let data = await res.json();

document.getElementById("signal").innerText =
data.signal + " " + (data.strength || 0) + "%";

setTimeout(()=>{
go("screen5");
},3000);

}

/* ================= RESTART ================= */
function restart(){
go("screen1");
}

</script>

</body>
</html>
