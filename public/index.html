<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>SNIPER AI PRO</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bgGlow"></div>

<div class="app">

  <div class="topBar">
    <div class="live">🟢 LIVE MARKET</div>
    <div class="clock" id="clock">00:00:00</div>
  </div>

  <div class="logoBox">
    <h1>SNIPER AI PRO</h1>
    <div class="sub">SMART MONEY CONCEPT ENGINE</div>
  </div>

  <div class="panel">

    <label>MARKET</label>

    <select id="market">
      <option value="EURUSD">EURUSD</option>
      <option value="GBPUSD">GBPUSD</option>
      <option value="USDJPY">USDJPY</option>
      <option value="USDCAD">USDCAD</option>
      <option value="USDCHF">USDCHF</option>
      <option value="BTCUSD">BTCUSD</option>
      <option value="ETHUSD">ETHUSD</option>
      <option value="XAUUSD">XAUUSD</option>
      <option value="XAGUSD">XAGUSD</option>
    </select>

    <label>TIMEFRAME</label>

    <select id="tf">
      <option value="1min">1 MINUTE</option>
      <option value="5min">5 MINUTES</option>
      <option value="15min">15 MINUTES</option>
    </select>

  </div>

  <div class="radarWrap">
    <div class="radar"></div>

    <div class="signalArea">
      <div class="signal wait" id="signal">WAIT</div>
      <div class="entry" id="entry">ENTRY : WAIT</div>
      <div class="price" id="price">PRICE : --</div>
    </div>
  </div>

  <button class="analyzeBtn" onclick="analyze()">
    ANALYZE SIGNAL
  </button>

  <div class="grid">

    <div class="card">
      <div class="title">CONFIDENCE</div>
      <div class="value" id="confidence">0%</div>
    </div>

    <div class="card">
      <div class="title">RSI</div>
      <div class="value" id="rsi">50</div>
    </div>

    <div class="card">
      <div class="title">MACD</div>
      <div class="value" id="macd">BEARISH</div>
    </div>

    <div class="card">
      <div class="title">QUALITY</div>
      <div class="value" id="quality">LOW</div>
    </div>

  </div>

</div>

<a class="telegramBtn" href="https://t.me/Mr_dflam">
  @Mr_dflam
</a>

<script src="app.js"></script>

</body>
</html>
