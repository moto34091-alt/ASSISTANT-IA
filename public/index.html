<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI PRO</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.app{
width:420px;
background:#0c1224;
padding:20px;
border-radius:20px;
border:1px solid #1f2b4d;
}

h2{
text-align:center;
color:#00ff9d;
}

select, button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:none;
font-weight:bold;
}

select{
background:#121d38;
color:white;
}

button{
background:#00ff9d;
color:black;
cursor:pointer;
}

.card{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:10px;
}

.title{
font-size:12px;
opacity:0.7;
}

.value{
font-size:18px;
font-weight:bold;
margin-top:5px;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b3b;}
.wait{color:#facc15;}

</style>
</head>

<body>

<div class="app">

<h2>SNIPER AI PRO</h2>

<!-- MARKET -->
<select id="market">

<option value="EURUSD">EURUSD</option>
<option value="GBPUSD">GBPUSD</option>
<option value="USDJPY">USDJPY</option>
<option value="USDCAD">USDCAD</option>
<option value="USDCHF">USDCHF</option>
<option value="AUDUSD">AUDUSD</option>
<option value="NZDUSD">NZDUSD</option>
<option value="EURJPY">EURJPY</option>
<option value="GBPJPY">GBPJPY</option>
<option value="EURGBP">EURGBP</option>

<option value="BTCUSD">BTCUSD</option>
<option value="ETHUSD">ETHUSD</option>

<option value="XAUUSD">XAUUSD</option>
<option value="XAGUSD">XAGUSD</option>

</select>

<button onclick="analyze()">ANALYZE</button>

<div class="card">
<div class="title">SIGNAL</div>
<div class="value" id="signal">WAIT</div>
</div>

<div class="card">
<div class="title">PRICE</div>
<div class="value" id="price">--</div>
</div>

<div class="card">
<div class="title">CONFIDENCE</div>
<div class="value" id="confidence">0%</div>
</div>

<div class="card">
<div class="title">RSI</div>
<div class="value" id="rsi">0</div>
</div>

<div class="card">
<div class="title">MACD</div>
<div class="value" id="macd">--</div>
</div>

<div class="card">
<div class="title">QUALITY</div>
<div class="value" id="quality">LOW</div>
</div>

</div>

<script>

async function analyze(){

const symbol = document.getElementById("market").value;

const res = await fetch("/signal?symbol="+symbol+"&tf=1min");
const data = await res.json();

// SIGNAL
document.getElementById("signal").innerText = data.signal;

// PRICE
document.getElementById("price").innerText =
data.price ? data.price : "--";

// CONFIDENCE
document.getElementById("confidence").innerText =
(data.confidence || 0) + "%";

// RSI
document.getElementById("rsi").innerText =
data.rsi || 0;

// MACD
document.getElementById("macd").innerText =
data.macd ? "BULLISH" : "BEARISH";

// QUALITY
document.getElementById("quality").innerText =
data.quality || "LOW";

// COLOR SIGNAL
let s = data.signal;

document.getElementById("signal").className =
s === "BUY" ? "value buy" :
s === "SELL" ? "value sell" :
"value wait";

}

</script>

</body>
</html>
