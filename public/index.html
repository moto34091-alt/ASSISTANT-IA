<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI V18 ULTRA PRO</title>

<style>
body{
background:#050816;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.app{
width:100%;
max-width:420px;
background:#0c1224;
padding:16px;
border-radius:25px;
border:1px solid #1f2b4d;
}

h2{color:#00ff9d;text-align:center}

select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:12px;
border:none;
font-weight:bold;
}

button{cursor:pointer}

.analyze{background:#00ff9d}
.auto{background:#1c2d52;color:white}

.signalBox{
margin-top:15px;
background:#111827;
padding:18px;
border-radius:20px;
text-align:center;
}

.icon{font-size:60px}
.signal{font-size:40px;font-weight:bold}

.buy{color:#00ff9d}
.sell{color:#ff3b5c}
.wait{color:#facc15}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.card{
background:#141f3a;
padding:10px;
border-radius:12px;
text-align:center;
}

.bar{
height:10px;
background:#1d2746;
border-radius:20px;
margin-top:10px;
overflow:hidden;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
}

.timer{text-align:center;margin-top:10px;display:none}

</style>
</head>

<body>

<div class="app">

<h2>SNIPER AI V18 PRO</h2>

<select id="market">
<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>USD/CHF</option>
<option>AUD/USD</option>
<option>USD/CAD</option>
<option>EUR/JPY</option>
<option>GBP/JPY</option>
<option>XAU/USD</option>
<option>BTC/USD</option>
<option>ETH/USD</option>
<option>NAS100</option>
<option>US30</option>
</select>

<button class="analyze" onclick="analyzeMarket()">ANALYZE</button>

<div class="signalBox">

<div class="icon" id="icon">🟡</div>
<div class="signal wait" id="signal">WAIT</div>

<div id="entry">ENTRY: -</div>

<div class="grid">
<div class="card">
RSI<br><span id="rsi">0</span>
</div>

<div class="card">
WINRATE<br><span id="winrate">0%</span>
</div>

<div class="card">
PROB<br><span id="prob">0%</span>
</div>

<div class="card">
TREND<br><span id="trend">NEUTRAL</span>
</div>
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="timer" id="timer">15 SEC</div>

</div>

</div>

<script>

/* =========================
   API KEY
========================= */
const API_KEY = "TON_TWELVE_DATA_API_KEY";

/* =========================
   GET MARKET DATA
========================= */
async function getCandles(symbol){

  const url =
  `https://api.twelvedata.com/time_series?symbol=${symbol}&interval=1min&outputsize=50&apikey=${API_KEY}`;

  const res = await fetch(url);
  const data = await res.json();

  if(!data.values) return null;

  return data.values.map(c=>({
    open:+c.open,
    high:+c.high,
    low:+c.low,
    close:+c.close
  })).reverse();
}

/* REMOVE REPAINT CANDLE */
function clean(c){ return c.slice(0,-1); }

/* =========================
   SMC ENGINE
========================= */
function analyzeSMC(c){

  c = clean(c);

  let last = c[c.length-1];
  let prev = c[c.length-2];

  let closes = c.map(x=>x.close);
  let highs = c.map(x=>x.high);
  let lows = c.map(x=>x.low);

  /* STRUCTURE */
  let HH = last.high > prev.high;
  let HL = last.low > prev.low;
  let LH = last.high < prev.high;
  let LL = last.low < prev.low;

  /* BOS */
  let BOS_UP = last.close > prev.high;
  let BOS_DOWN = last.close < prev.low;

  /* LIQUIDITY */
  let liqBuy = last.low < Math.min(...lows.slice(-7));
  let liqSell = last.high > Math.max(...highs.slice(-7));

  /* RSI */
  let g=0,l=0;
  for(let i=1;i<closes.length;i++){
    let d=closes[i]-closes[i-1];
    d>0?g+=d:l-=d;
  }

  let rsi = 100 - (100/(1+g/(l||1)));

  /* SCORE */
  let buy=0,sell=0;

  if(HH) buy++;
  if(HL) buy++;
  if(BOS_UP) buy++;
  if(liqBuy) buy++;
  if(rsi<40) buy++;

  if(LH) sell++;
  if(LL) sell++;
  if(BOS_DOWN) sell++;
  if(liqSell) sell++;
  if(rsi>60) sell++;

  let signal="WAIT";

  if(buy>=3 && buy>sell) signal="BUY";
  else if(sell>=3 && sell>buy) signal="SELL";

  let prob = Math.min(95,50+Math.max(buy,sell)*7);
  let win = Math.min(92,55+Math.max(buy,sell)*5);

  return{
    signal,
    rsi:rsi.toFixed(2),
    prob:prob.toFixed(1),
    winrate:win.toFixed(1),
    trend: signal==="BUY"?"BULLISH":signal==="SELL"?"BEARISH":"NEUTRAL"
  };
}

/* =========================
   MAIN ANALYZE
========================= */
async function analyzeMarket(){

  let m=document.getElementById("market").value;

  document.getElementById("signal").innerText="LOADING...";
  document.getElementById("icon").innerText="🧠";

  let candles=await getCandles(m);
  if(!candles) return;

  let d=analyzeSMC(candles);

  applyUI(d);
  startTimer();
}

/* =========================
   UI
========================= */
function applyUI(d){

  let icon=document.getElementById("icon");
  let sig=document.getElementById("signal");

  if(d.signal==="BUY"){
    icon.innerText="🟢";
    sig.innerText="BUY";
    sig.className="signal buy";
  }
  else if(d.signal==="SELL"){
    icon.innerText="🔴";
    sig.innerText="SELL";
    sig.className="signal sell";
  }
  else{
    icon.innerText="🟡";
    sig.innerText="WAIT";
    sig.className="signal wait";
  }

  document.getElementById("rsi").innerText=d.rsi;
  document.getElementById("prob").innerText=d.prob+"%";
  document.getElementById("winrate").innerText=d.winrate+"%";
  document.getElementById("trend").innerText=d.trend;
  document.getElementById("entry").innerText="ENTRY: "+d.signal;
}

/* =========================
   TIMER
========================= */
function startTimer(){

  let t=15;
  let timer=document.getElementById("timer");
  timer.style.display="block";

  let i=setInterval(()=>{

    document.getElementById("fill").style.width=(t/15*100)+"%";
    timer.innerText=t+" SEC";

    t--;

    if(t<0){
      clearInterval(i);
      timer.style.display="none";
    }

  },1000);
}

</script>

</body>
</html>
