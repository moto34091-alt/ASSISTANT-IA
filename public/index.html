<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>D-FLAM SNIPER AI PRO</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:10px;
}

.app{
width:100%;
max-width:420px;
background:#0c1224;
border-radius:25px;
padding:16px;
border:1px solid #1f2b4d;
}

.top{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.live{color:#00ff9d;font-weight:bold}
.timeNow{color:#ccc;font-size:13px}

h2{text-align:center;color:#00ff9d}

select{
width:100%;
padding:12px;
margin-top:10px;
border-radius:12px;
background:#121d38;
color:white;
}

.buttons{
display:flex;
gap:10px;
margin-top:10px;
}

button{
flex:1;
padding:12px;
border-radius:12px;
border:none;
font-weight:bold;
cursor:pointer;
}

.analyze{background:#00ff9d;color:black}
.auto{background:#1c2d52;color:white}

.signalBox{
margin-top:15px;
background:#111827;
padding:18px;
border-radius:20px;
text-align:center;
}

.icon{font-size:60px}
.signal{font-size:40px;font-weight:bold}

.buy{color:#00ff9d}
.sell{color:#ff3b5c}
.wait{color:#facc15}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.card{
background:#141f3a;
padding:10px;
border-radius:12px;
}

.bar{
height:10px;
background:#1d2746;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:width 1s linear;
}

.timer{
margin-top:10px;
font-size:13px;
color:#ccc;
display:none;
}
</style>
</head>

<body>

<div class="app">

<div class="top">
<div class="live">🟢 LIVE</div>
<div id="clock"></div>
</div>

<h2>SNIPER AI PRO</h2>

<select id="market">
<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>XAU/USD</option>
<option>BTC/USD</option>
</select>

<select disabled>
<option>15 SEC ENGINE</option>
</select>

<div class="buttons">
<button class="analyze" onclick="analyze()">ANALYZE</button>
<button class="auto" onclick="autoMode()" id="autoBtn">AUTO</button>
</div>

<div class="signalBox">

<div class="icon" id="icon">🟡</div>
<div class="signal wait" id="signal">WAIT</div>

<div id="entry">ENTRY: -</div>
<div id="price">PRICE: --</div>

<div class="grid">
<div class="card">PROB<br><b id="prob">0%</b></div>
<div class="card">WIN<br><b id="winrate">0%</b></div>
<div class="card">TREND<br><b id="trend">NEUTRAL</b></div>
<div class="card">TF<br><b>1m/5m/15m</b></div>
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="timer" id="timer">READY</div>

</div>

</div>

<script>

/* CLOCK */
setInterval(()=>{
document.getElementById("clock").innerText=new Date().toLocaleTimeString();
},1000);

/* STATE */
let auto=null;
let timer=null;
let isRunning=false;

/* TIMEFRAMES */
const tf={
"1m":[],
"5m":[],
"15m":[]
};

/* PRICE */
function getPrice(m){
let p=100+Math.random()*10;
if(m.includes("BTC"))p=60000+Math.random()*1000;
if(m.includes("XAU"))p=2300+Math.random()*20;
return p;
}

/* CANDLE */
function candle(price){
return{
open:price,
close:price+(Math.random()-0.5),
high:price+Math.random(),
low:price-Math.random()
};
}

/* UPDATE TF */
function updateTF(price){
tf["1m"].push(candle(price));
tf["5m"].push(candle(price));
tf["15m"].push(candle(price));

if(tf["1m"].length>30)tf["1m"].shift();
if(tf["5m"].length>30)tf["5m"].shift();
if(tf["15m"].length>30)tf["15m"].shift();
}

/* ANALYZE TF */
function analyzeTF(data){
if(data.length<5)return{trend:"NEUTRAL"};

let buy=0,sell=0;

for(let i=1;i<data.length;i++){
data[i].close>data[i-1].close?buy++:sell++;
}

return{
trend:buy>sell?"BUY":sell>buy?"SELL":"NEUTRAL"
};
}

/* ENGINE */
function engine(price){

updateTF(price);

let t1=analyzeTF(tf["1m"]);
let t5=analyzeTF(tf["5m"]);
let t15=analyzeTF(tf["15m"]);

let buy=0,sell=0;

if(t15.trend=="BUY")buy+=3;
if(t15.trend=="SELL")sell+=3;

if(t5.trend=="BUY")buy+=2;
if(t5.trend=="SELL")sell+=2;

if(t1.trend=="BUY")buy++;
if(t1.trend=="SELL")sell++;

let signal="WAIT";

if(buy>=5 && buy>sell)signal="BUY";
else if(sell>=5 && sell>buy)signal="SELL";

let prob=50+Math.max(buy,sell)*6;
if(prob>95)prob=95;

return{
signal,
prob,
trend:t15.trend
};
}

/* APPLY */
function apply(d,price){

document.getElementById("icon").innerText=
d.signal=="BUY"?"🟢":d.signal=="SELL"?"🔴":"🟡";

document.getElementById("signal").innerText=d.signal;
document.getElementById("signal").className=
"signal "+(d.signal.toLowerCase());

document.getElementById("prob").innerText=d.prob+"%";
document.getElementById("winrate").innerText=(d.prob-5).toFixed(1)+"%";
document.getElementById("trend").innerText=d.trend;

document.getElementById("price").innerText="PRICE: "+price.toFixed(2);
document.getElementById("entry").innerText=
d.signal=="BUY"?"ENTRY BUY 🔼":
d.signal=="SELL"?"ENTRY SELL 🔽":"WAIT";

}

/* ANALYZE */
function analyze(){
if(isRunning)return;
isRunning=true;

let market=document.getElementById("market").value;
let price=getPrice(market);

document.getElementById("signal").innerText="ANALYZING...";

setTimeout(()=>{
let data=engine(price);
apply(data,price);
startTimer(data.signal);
isRunning=false;
},600);
}

/* TIMER */
function startTimer(signal){

clearInterval(timer);
if(signal=="WAIT")return;

let sec=15;
document.getElementById("timer").style.display="block";

timer=setInterval(()=>{
sec--;

document.getElementById("fill").style.width=(sec/15*100)+"%";

document.getElementById("timer").innerText=
"TRADE: "+sec+"s";

if(sec<=0){
clearInterval(timer);
document.getElementById("timer").style.display="none";
}

},1000);
}

/* AUTO */
function autoMode(){

let btn=document.getElementById("autoBtn");

if(auto){
clearInterval(auto);
auto=null;
btn.innerText="AUTO";
return;
}

btn.innerText="AUTO ON";

auto=setInterval(()=>{
analyze();
},3000);
}

</script>

</body>
</html>
