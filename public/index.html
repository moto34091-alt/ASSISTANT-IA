<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GOD MODE AI TRADER</title>

<style>

body{
margin:0;
background:#070b14;
color:white;
font-family:Arial;
}

/* HEADER */
header{
padding:15px;
text-align:center;
background:#111827;
color:#00ff99;
font-weight:bold;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
padding:10px;
}

.card{
background:#111827;
padding:15px;
border-radius:10px;
text-align:center;
box-shadow:0 0 10px rgba(0,255,150,0.1);
}

.buy{color:#00ff99;}
.sell{color:#ff4d6d;}
.wait{color:#facc15;}

/* CHART */
canvas{
width:100%;
height:260px;
background:#0f172a;
}

/* FLOAT BUTTON */
.float{
position:fixed;
bottom:20px;
right:20px;
background:#00ff99;
color:black;
padding:15px;
border-radius:50%;
text-decoration:none;
font-weight:bold;
}

/* LOGIN */
#login{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

input,button{
padding:10px;
margin:5px;
border-radius:8px;
border:none;
}

button{background:#2563eb;color:white;cursor:pointer;}

</style>
</head>

<body>

<div id="login">
<h2>ADMIN LOGIN</h2>
<input id="u" placeholder="user">
<input id="p" type="password" placeholder="pass">
<button onclick="login()">LOGIN</button>
<p id="err"></p>
</div>

<header>🚀 GOD MODE AI TRADER</header>

<canvas id="chart"></canvas>

<div class="grid">

<div class="card">SIGNAL <div id="signal">WAIT</div></div>
<div class="card">PRICE <div id="price">0</div></div>
<div class="card">RSI <div id="rsi">0</div></div>
<div class="card">MACD <div id="macd">0</div></div>
<div class="card">WIN RATE <div id="win">0%</div></div>

</div>

<a class="float" href="https://t.me/signalstradings_bot">📡 BOT</a>

<script>

/* LOGIN */
async function login(){

let res = await fetch("/api/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
user:document.getElementById("u").value,
pass:document.getElementById("p").value
})
});

let d = await res.json();

if(d.ok){
localStorage.setItem("token", d.token);
document.getElementById("login").style.display="none";
}else{
document.getElementById("err").innerText="ERROR";
}
}

/* WS */
const ws = new WebSocket("ws://" + location.host);

ws.onmessage=(msg)=>{
let d = JSON.parse(msg.data);

document.getElementById("signal").innerText=d.signal;
document.getElementById("price").innerText=d.price;
document.getElementById("rsi").innerText=d.rsi;
document.getElementById("macd").innerText=d.macd;
document.getElementById("win").innerText=d.winRate;
};

</script>

</body>
</html>
