<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI V14</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.app{
width:95%;
max-width:420px;
background:#0c1224;
border-radius:25px;
padding:18px;
box-shadow:0 0 35px #00ff9d22;
}

/* TITLE */
h2{
text-align:center;
color:#00ff9d;
}

/* SELECT */
select{
width:100%;
padding:14px;
margin-top:10px;
border-radius:12px;
border:none;
background:#111a33;
color:white;
font-weight:bold;
}

/* BUTTONS */
button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:14px;
background:#00ff9d;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

button:active{
transform:scale(0.97);
}

.auto{
background:#00c3ff;
color:black;
}

/* SIGNAL */
.signal{
text-align:center;
font-size:70px;
margin-top:20px;
font-weight:bold;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

/* INFO */
.info{
text-align:center;
margin-top:10px;
color:#aaa;
}

/* BAR */
.bar{
height:18px;
background:#1a1f35;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:0.5s;
}

/* STATUS */
.status{
text-align:center;
margin-top:10px;
font-size:13px;
color:#888;
}

</style>

</head>

<body>

<div class="app">

<h2>📊 SMART MONEY V14</h2>

<!-- MARKET -->
<select id="market">
<option value="EURUSD">EUR/USD</option>
<option value="GBPUSD">GBP/USD</option>
<option value="USDJPY">USD/JPY</option>
<option value="USDCHF">USD/CHF</option>
<option value="XAUUSD">GOLD</option>
</select>

<!-- TIME -->
<select id="time">
<option value="60">1 MIN</option>
<option value="300">5 MIN</option>
<option value="900">15 MIN</option>
</select>

<!-- MANUAL ANALYZE -->
<button onclick="analyze()">🔄 ANALYZE MARKET</button>

<!-- AUTO MODE -->
<button class="auto" onclick="toggleAuto()">🤖 AUTO ANALYZE: OFF</button>

<!-- SIGNAL -->
<div id="signal" class="signal wait">WAIT</div>

<div class="info" id="score">SCORE: 0</div>
<div class="info" id="prob">PROB: 0%</div>

<!-- BAR -->
<div class="bar">
<div id="fill" class="fill"></div>
</div>

<div class="status" id="status">READY</div>

</div>

<script>

let autoMode = false;
let autoInterval = null;

/* ================= ANALYZE ================= */

async function analyze(){

try{

const market = document.getElementById("market").value;

const res = await fetch(`/api/${market}`);
const data = await res.json();

/* SCORE */
document.getElementById("score").innerText =
"SCORE: " + (data.score || 0);

/* PROB */
document.getElementById("prob").innerText =
"PROB: " + (data.probability || 50) + "%";

/* SIGNAL */
const s = document.getElementById("signal");

if(data.signal === "BUY"){
s.innerText = "🟢 BUY";
s.className = "signal buy";
}

else if(data.signal === "SELL"){
s.innerText = "🔴 SELL";
s.className = "signal sell";
}

else{
s.innerText = "🟡 WAIT";
s.className = "signal wait";
}

/* BAR */
document.getElementById("fill").style.width =
(data.probability || 50) + "%";

/* STATUS */
document.getElementById("status").innerText =
"LAST UPDATE: " + new Date().toLocaleTimeString();

}catch(err){
console.log(err);
document.getElementById("status").innerText =
"ERROR SERVER";
}

}

/* ================= AUTO MODE ================= */

function toggleAuto(){

autoMode = !autoMode;

const btn = document.querySelector(".auto");

if(autoMode){

btn.innerText = "🤖 AUTO ANALYZE: ON";

autoInterval = setInterval(analyze, 4000);

}else{

btn.innerText = "🤖 AUTO ANALYZE: OFF";

clearInterval(autoInterval);

}

}

</script>

</body>

</html>
