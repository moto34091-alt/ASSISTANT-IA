<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NEXT LEVEL TRADING</title>

<style>

body{
margin:0;
background:#070b14;
color:white;
font-family:Arial;
}

header{
padding:15px;
text-align:center;
background:#111827;
color:#00ff99;
font-weight:bold;
letter-spacing:1px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
padding:10px;
}

.card{
background:#111827;
padding:15px;
border-radius:12px;
text-align:center;
box-shadow:0 0 10px rgba(0,255,150,0.1);
}

.buy{color:#00ff99;}
.sell{color:#ff4d6d;}
.wait{color:#facc15;}

canvas{
width:100%;
height:300px;
background:#0f172a;
margin-top:10px;
border-radius:10px;
}

.float{
position:fixed;
bottom:20px;
right:20px;
background:#00ff99;
color:black;
padding:15px;
border-radius:50%;
text-decoration:none;
font-weight:bold;
}

#signal{
font-size:20px;
font-weight:bold;
}

</style>
</head>

<body>

<header>🚀 NEXT LEVEL AI TRADER PRO</header>

<canvas id="chart"></canvas>

<div class="grid">

<div class="card">SIGNAL <div id="signal">WAIT</div></div>
<div class="card">PRICE <div id="price">0</div></div>
<div class="card">RSI <div id="rsi">0</div></div>
<div class="card">EMA FAST <div id="emaF">0</div></div>
<div class="card">EMA SLOW <div id="emaS">0</div></div>
<div class="card">WIN RATE <div id="win">0%</div></div>

</div>

<a class="float" href="https://t.me/signalstradings_bot">📡 BOT</a>

<script>

const ws = new WebSocket("ws://" + location.host);

let chartData = [];

ws.onmessage = (msg)=>{
let d = JSON.parse(msg.data);

document.getElementById("signal").innerText = d.signal;
document.getElementById("price").innerText = d.price;
document.getElementById("rsi").innerText = d.rsi;
document.getElementById("emaF").innerText = d.emaFast;
document.getElementById("emaS").innerText = d.emaSlow;
document.getElementById("win").innerText = d.winRate;

/* chart update */
chartData.push(d.price);
if(chartData.length > 50) chartData.shift();

drawChart();
};

/* SIMPLE CHART ENGINE */

const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;

function drawChart(){

ctx.clearRect(0,0,canvas.width,300);

ctx.beginPath();

for(let i=0;i<chartData.length;i++){

let x = i * (canvas.width / chartData.length);
let y = 300 - chartData[i]*0.002;

ctx.lineTo(x,y);
}

ctx.strokeStyle = "#00ff99";
ctx.lineWidth = 2;
ctx.stroke();
}

</script>

</body>
</html>
