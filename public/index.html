<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V4 FULL APP PRO</title>

<style>
body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
overflow:hidden;
}

/* APP */
.app{
width:100%;
max-width:420px;
margin:auto;
height:100vh;
display:flex;
flex-direction:column;
}

/* SCREEN */
.screen{
display:none;
flex:1;
padding:15px;
}
.screen.active{display:flex;flex-direction:column;}

/* CARD */
.card{
background:#0c1224;
padding:12px;
margin:6px 0;
border-radius:12px;
text-align:center;
cursor:pointer;
}

/* BUTTON */
button{
padding:12px;
border:none;
border-radius:12px;
background:#00ff9d;
font-weight:bold;
margin-top:10px;
}

/* TITLE */
h2{
text-align:center;
color:#00ff9d;
}

/* SIGNAL */
.signal{
font-size:60px;
text-align:center;
margin-top:20px;
}
.buy{color:#00ff9d}
.sell{color:#ff3b5c}
.wait{color:#facc15}

/* TIMER BAR */
.bar{
height:6px;
background:#222;
border-radius:10px;
overflow:hidden;
margin-top:15px;
}
.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
}
</style>
</head>

<body>

<div class="app">

<!-- SCREEN 1 -->
<div class="screen active" id="s1">
<h2>MARKET SCAN</h2>
<button onclick="loadMarkets()">SCAN</button>
<div id="list"></div>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">
<h2>CHOOSE MARKET</h2>
<div id="markets"></div>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="s3">
<h2>TIME</h2>
<div class="card" onclick="setTF('1m')">1 MIN</div>
<div class="card" onclick="setTF('5m')">5 MIN</div>
<div class="card" onclick="setTF('15m')">15 MIN</div>
</div>

<!-- SCREEN 4 -->
<div class="screen" id="s4">
<h2>ANALYZING</h2>
<button onclick="analyze()">START ANALYSIS</button>
</div>

<!-- SCREEN 5 -->
<div class="screen" id="s5">
<div id="signal" class="signal wait">WAIT</div>
<div id="prob" style="text-align:center"></div>
<button onclick="reset()">NEW TRADE</button>
</div>

</div>

<script>

let symbol="";
let tf="1m";

/* NAV */
function go(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* SCAN */
async function loadMarkets(){
let res = await fetch("/api/scan");
let data = await res.json();

let box=document.getElementById("markets");
box.innerHTML="";

data.markets.forEach(m=>{
let div=document.createElement("div");
div.className="card";
div.innerText=m;

div.onclick=()=>{
symbol=m;
go("s3");
};

box.appendChild(div);
});

go("s2");
}

/* TIME */
function setTF(t){
tf=t;
go("s4");
}

/* ANALYZE */
async function analyze(){

let res = await fetch(`/api/analyze/${symbol}/${tf}`);
let d = await res.json();

let s=document.getElementById("signal");
let p=document.getElementById("prob");

s.innerText=d.signal;
p.innerText="PROBABILITY: "+d.probability+"%";

s.className="signal "+
(d.signal=="BUY"?"buy":
d.signal=="SELL"?"sell":"wait");

go("s5");
}

/* RESET */
function reset(){
go("s1");
}

</script>

</body>
</html>
