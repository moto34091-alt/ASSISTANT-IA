<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SNIPER AI PRO V9</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial;
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.app{
width:95%;
max-width:420px;
background:#0c1224;
border-radius:25px;
padding:18px;
box-shadow:0 0 25px #00ff9d22;
border:1px solid #00ff9d22;
}

/* TITLE */

.title{
text-align:center;
font-size:24px;
font-weight:bold;
color:#00ff9d;
margin-bottom:15px;
}

/* SELECT */

select{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:14px;
background:#111a33;
color:white;
font-size:15px;
font-weight:bold;
outline:none;
}

/* BUTTON */

button{
width:100%;
padding:15px;
margin-top:14px;
border:none;
border-radius:15px;
background:#00ff9d;
color:black;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:active{
transform:scale(0.96);
}

/* ANALYZE ANIMATION */

.analyze-btn{
position:relative;
overflow:hidden;
}

.loader{
width:18px;
height:18px;
border:3px solid #00000033;
border-top:3px solid black;
border-radius:50%;
display:inline-block;
margin-right:8px;
animation:spin 1s linear infinite;
vertical-align:middle;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

/* SIGNAL */

.signal{
font-size:65px;
font-weight:bold;
text-align:center;
margin-top:20px;
transition:0.4s;
}

.buy{
color:#00ff9d;
text-shadow:0 0 20px #00ff9d;
}

.sell{
color:#ff3b5c;
text-shadow:0 0 20px #ff3b5c;
}

.wait{
color:#facc15;
}

/* INFO */

.info{
text-align:center;
margin-top:10px;
font-size:18px;
color:#aaa;
}

/* BAR */

.bar{
width:100%;
height:20px;
background:#1a1f35;
border-radius:30px;
overflow:hidden;
margin-top:20px;
box-shadow:0 0 15px #00ff9d22 inset;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:1s linear;
}

/* EXPIRY */

.expiry{
text-align:center;
margin-top:12px;
font-size:18px;
font-weight:bold;
}

/* COLORS */

.good{
color:#00ff9d;
}

.medium{
color:#facc15;
}

.bad{
color:#ff3b5c;
}

</style>

</head>

<body>

<div class="app">

<div class="title">
📊 SNIPER AI PRO V9
</div>

<!-- 🔥 REAL MARKETS ONLY -->

<select id="market">

<option value="EURUSD">EUR/USD</option>
<option value="GBPUSD">GBP/USD</option>
<option value="USDJPY">USD/JPY</option>
<option value="USDCHF">USD/CHF</option>
<option value="USDCAD">USD/CAD</option>
<option value="AUDUSD">AUD/USD</option>
<option value="NZDUSD">NZD/USD</option>

<option value="EURJPY">EUR/JPY</option>
<option value="GBPJPY">GBP/JPY</option>

<option value="XAUUSD">GOLD (XAU/USD)</option>

<option value="NAS100">NASDAQ 100</option>
<option value="SPX500">S&P 500</option>
<option value="DOWJONES">DOW JONES</option>

</select>

<!-- 🔥 TIME -->

<select id="time">

<option value="60">1 MIN</option>
<option value="300">5 MIN</option>
<option value="900">15 MIN</option>

</select>

<!-- 🔥 BUTTON -->

<button class="analyze-btn" id="analyzeBtn" onclick="analyze()">
🔄 ANALYZE MARKET
</button>

<button onclick="autoMode()">
🤖 AUTO MODE
</button>

<!-- 🔥 SIGNAL -->

<div id="signal" class="signal wait">
WAIT
</div>

<!-- 🔥 DATA -->

<div class="info" id="score">
SCORE: 0
</div>

<div class="info" id="prob">
PROB: 0%
</div>

<!-- 🔥 EXPIRY BAR -->

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<!-- 🔥 EXPIRY STATUS -->

<div class="expiry" id="expiry">
READY
</div>

</div>

<script>

let autoInterval;
let expiryInterval;

/* 🔥 ANALYZE */

async function analyze(){

const btn=document.getElementById("analyzeBtn");

btn.innerHTML=
'<span class="loader"></span> ANALYZING...';

btn.disabled=true;

const market=
document.getElementById("market").value;

const tf=
document.getElementById("time").value;

try{

const res=
await fetch(`/api/${market}/1m`);

const data=
await res.json();

const signal=
document.getElementById("signal");

const score=
document.getElementById("score");

const prob=
document.getElementById("prob");

/* 🔥 FILTER */

if((data.probability || 0) < 70){

signal.innerText="🟡 WAIT";
signal.className="signal wait";

score.innerText=
"SCORE: LOW";

prob.innerText=
"PROB: LOW";

document.getElementById("expiry").innerHTML=
"❌ BAD ENTRY";

btn.innerHTML=
"🔄 ANALYZE MARKET";

btn.disabled=false;

return;

}

/* 🔥 SIGNAL */

if(data.signal==="BUY"){

signal.innerText="🟢 BUY";
signal.className="signal buy";

playSound();
vibrate();

}

else if(data.signal==="SELL"){

signal.innerText="🔴 SELL";
signal.className="signal sell";

playSound();
vibrate();

}

/* 🔥 DATA */

score.innerText=
"SCORE: " + (data.score || 0);

prob.innerText=
"PROB: " + (data.probability || 0) + "%";

/* 🔥 START EXPIRY */

startExpiry(parseInt(tf));

}catch(err){

console.log(err);

}

btn.innerHTML=
"🔄 ANALYZE MARKET";

btn.disabled=false;

}

/* 🔥 EXPIRY */

function startExpiry(seconds){

clearInterval(expiryInterval);

let left=seconds;

const fill=
document.getElementById("fill");

const expiry=
document.getElementById("expiry");

fill.style.width="100%";

expiryInterval=setInterval(()=>{

left--;

let percent=
(left/seconds)*100;

fill.style.width=
percent + "%";

/* 🔥 ENTRY QUALITY */

if(percent > 70){

expiry.innerHTML=
"🟢 PERFECT ENTRY";

expiry.className=
"expiry good";

}

else if(percent > 40){

expiry.innerHTML=
"🟡 ENTRY POSSIBLE";

expiry.className=
"expiry medium";

}

else{

expiry.innerHTML=
"🔴 TOO LATE";

expiry.className=
"expiry bad";

}

/* 🔥 EXPIRED */

if(left <= 0){

clearInterval(expiryInterval);

expiry.innerHTML=
"⌛ SIGNAL EXPIRED";

expiry.className=
"expiry bad";

fill.style.width="0%";

}

},1000);

}

/* 🔥 AUTO MODE */

function autoMode(){

if(autoInterval){

clearInterval(autoInterval);

autoInterval=null;

alert("AUTO MODE STOPPED");

return;

}

alert("AUTO MODE STARTED");

autoInterval=setInterval(()=>{

analyze();

},7000);

}

/* 🔊 SOUND */

function playSound(){

let audio=
new Audio(
"https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
);

audio.play();

}

/* 📳 VIBRATION */

function vibrate(){

if(navigator.vibrate){

navigator.vibrate([200,100,200]);

}

}

</script>

</body>
</html>
