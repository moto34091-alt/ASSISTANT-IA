<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>D-FLAM BOT TRADING</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:15px;
}

.app{
width:100%;
max-width:420px;
background:#0c1224;
padding:15px;
border-radius:15px;
}

h2{text-align:center;color:#00ff9d;}

select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:none;
font-weight:bold;
}

button{background:#00ff9d;color:black;}

.icon{
text-align:center;
font-size:60px;
margin-top:15px;
}

.signal{
text-align:center;
font-size:40px;
font-weight:bold;
margin-top:5px;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

.info{
text-align:center;
margin-top:8px;
}

.bar{
height:10px;
background:#1d2746;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
}

.timer{
text-align:center;
margin-top:8px;
font-size:14px;
}
</style>
</head>

<body>

<div class="app">

<h2>SNIPER AI PRO V2</h2>

<select id="market">
<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>EUR/JPY</option>
<option>USD/CHF</option>
<option>AUD/USD</option>
<option>USD/CAD</option>
<option>EUR/GBP</option>
<option>GBP/JPY</option>
<option>EUR/AUD</option>
<option>EUR/CAD</option>
<option>GBP/CHF</option>
<option>CHF/JPY</option>
<option>AUD/JPY</option>
<option>NZD/USD</option>
<option>BTC/USD</option>
<option>ETH/USD</option>
<option>US30</option>
<option>NAS100</option>
<option>XAU/USD</option>
</select>

<select id="time">
<option value="60">1 MIN</option>
<option value="300">5 MIN</option>
<option value="900">15 MIN</option>
</select>

<button onclick="analyze()">ANALYZE</button>
<button onclick="autoMode()">AUTO MODE</button>

<div id="icon" class="icon">🟡</div>
<div id="signal" class="signal wait">WAIT</div>

<div class="info" id="score">SCORE: 0</div>
<div class="info" id="prob">PROB: 0%</div>

<div class="bar"><div id="fill" class="fill"></div></div>
<div class="timer" id="timer">READY</div>

</div>

<script>

let lock=false;
let interval=null;
let timer=null;

let lastKey="";
let lastData=null;

/* =========================
   🧠 IA SIMPLE MAIS PROPRE
========================= */
function ai(){

let rsi = Math.random()*100;
let trend = Math.random()*2-1;
let volume = Math.random()*100;

/* RSI */
let rsiS = rsi<30?1:rsi>70?-1:0;

/* TREND */
let trendS = trend>0.2?1:trend<-0.2?-1:0;

/* VOLUME */
let volS = volume>65?1:volume<35?-1:0;

/* SCORE FINAL */
let score = (rsiS*0.45) + (trendS*0.4) + (volS*0.15);

let signal="WAIT";
if(score>0.35) signal="BUY";
else if(score<-0.35) signal="SELL";

/* PROBABILITÉ */
let prob = Math.min(100, Math.floor(Math.abs(score)*100 + 50));

return {rsi,trend,volume,score,signal,prob};
}

/* =========================
   ANALYZE (CACHE STABLE)
========================= */
function analyze(){

let m=document.getElementById("market").value;
let t=document.getElementById("time").value;
let key=m+"_"+t;

/* si déjà calculé → même signal */
if(lock && key===lastKey){
apply(lastData);
return;
}

if(lock && key!==lastKey) return;

lock=true;
lastKey=key;

document.getElementById("icon").innerText="🧠";
document.getElementById("signal").innerText="ANALYZING...";
document.getElementById("signal").className="signal wait";

setTimeout(()=>{

let data=ai();
lastData=data;

apply(data);
startTimer(t);

},900);
}

/* =========================
   APPLY SIGNAL
========================= */
function apply(d){

let icon=document.getElementById("icon");
let s=document.getElementById("signal");

if(d.signal=="BUY"){
icon.innerText="🟢";
s.innerText="BUY";
s.className="signal buy";
}
else if(d.signal=="SELL"){
icon.innerText="🔴";
s.innerText="SELL";
s.className="signal sell";
}
else{
icon.innerText="🟡";
s.innerText="WAIT";
s.className="signal wait";
}

document.getElementById("score").innerText="SCORE: "+d.score.toFixed(2);
document.getElementById("prob").innerText="PROB: "+d.prob+"%";
}

/* =========================
   TIMER
========================= */
function startTimer(sec){

clearInterval(timer);
let r=sec;

timer=setInterval(()=>{

r--;

document.getElementById("fill").style.width=(r/sec*100)+"%";
document.getElementById("timer").innerText=r+" SEC";

if(r<=0){
clearInterval(timer);
lock=false;
document.getElementById("timer").innerText="READY";
}

},1000);
}

/* =========================
   AUTO MODE
========================= */
function autoMode(){

if(interval){
clearInterval(interval);
interval=null;
alert("STOP AUTO");
return;
}

alert("START AUTO");

interval=setInterval(()=>{
if(!lock) analyze();
},3000);
}

</script>

</body>
</html>
