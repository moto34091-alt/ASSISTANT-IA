<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>D-FLAM SIGNAL BOT</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:10px;
}

.app{
width:100%;
max-width:420px;
background:#0c1224;
border-radius:25px;
padding:16px;
border:1px solid #1f2b4d;
}

.top{
display:flex;
justify-content:space-between;
}

.live{color:#00ff9d;font-weight:bold}
.clock{color:#ccc}

h2{
text-align:center;
color:#00ff9d;
margin:10px 0;
}

select,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
font-weight:bold;
}

button{
background:#00ff9d;
color:black;
cursor:pointer;
}

button.auto{
background:#1d2d52;
color:white;
}

.signalBox{
margin-top:15px;
background:#111827;
padding:18px;
border-radius:18px;
}

.signal{
font-size:50px;
text-align:center;
font-weight:bold;
}

.buy{color:#00ff9d}
.sell{color:#ff3b5c}
.wait{color:#facc15}

.timer{
text-align:center;
margin-top:8px;
color:#00ff9d;
font-weight:bold;
}

.price{
text-align:center;
margin-top:6px;
color:#ccc;
font-size:14px;
}

/* EXP BAR */
.expBar{
height:6px;
background:#1a2440;
border-radius:20px;
margin-top:10px;
overflow:hidden;
}

.expFill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:width 1s linear;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:10px;
}

.card{
background:#141f3a;
padding:10px;
border-radius:12px;
text-align:center;
}

.cardTitle{font-size:11px;color:#aaa}
.cardValue{font-size:16px;font-weight:bold}

.footer{
text-align:center;
margin-top:10px;
font-size:11px;
color:#5e6781;
}

</style>
</head>

<body>

<div class="app">

<div class="top">
<div class="live">🟢 LIVE</div>
<div class="clock" id="clock"></div>
</div>

<h2>D-FLAM SIGNAL BOT</h2>

<select id="market">

<option>EUR/JPY</option>
<option>GBP/JPY</option>

<option>AUD/CAD</option>
<option>AUD/USD</option>

<option>CAD/CHF</option>
<option>CAD/JPY</option>

<option>EUR/AUD</option>
<option>EUR/CAD</option>
<option>EUR/CHF</option>
<option>EUR/GBP</option>
<option>EUR/USD</option>

<option>GBP/CHF</option>
<option>GBP/USD</option>
<option>GBP/AUD</option>
<option>GBP/CAD</option>

<option>USD/CAD</option>
<option>USD/CHF</option>
<option>USD/JPY</option>

<option>AUD/CHF</option>
<option>AUD/JPY</option>

<option>CHF/JPY</option>

<option>BTCUSD</option>
<option>XAUUSD</option>

</select>

<select id="tf">
<option>1min</option>
<option>5min</option>
<option>15min</option>
</select>

<button onclick="analyze()">ANALYSE</button>
<button class="auto" onclick="toggleAuto()">AUTO ANALYSE</button>

<div class="signalBox">

<div class="signal wait" id="signal">WAIT</div>

<div class="timer" id="timer"></div>

<div class="price" id="price">PRICE: --</div>

<div class="expBar">
<div class="expFill" id="expFill"></div>
</div>

<div class="grid">

<div class="card">
<div class="cardTitle">CONFIDENCE</div>
<div class="cardValue" id="smc">0%</div>
</div>

<div class="card">
<div class="cardTitle">RSI</div>
<div class="cardValue" id="rsi">50</div>
</div>

<div class="card">
<div class="cardTitle">STRUCTURE</div>
<div class="cardValue" id="macd">NEUTRAL</div>
</div>

<div class="card">
<div class="cardTitle">QUALITY</div>
<div class="cardValue" id="quality">LOW</div>
</div>

</div>

</div>

<div class="footer">SMART MONEY ENGINE</div>

</div>

<script>

/* CLOCK */
setInterval(()=>{
document.getElementById("clock").innerText =
new Date().toLocaleTimeString();
},1000);

/* AUTO */
let auto=false;
let loop;

/* TIMER */
let t;

function startTimer(){

clearInterval(t);

let time=60;
expFill.style.width="100%";

t=setInterval(()=>{

time--;

timer.innerText="⏳ EXP "+time+"s";

expFill.style.width=(time/60*100)+"%";

if(time<=0){
clearInterval(t);
timer.innerText="EXPIRED";
}

},1000);

}

/* TOGGLE AUTO */
function toggleAuto(){

auto=!auto;

if(auto){
loop=setInterval(analyse,1500);
}else{
clearInterval(loop);
}

}

/* ANALYZE */
async function analyze(){

const res = await fetch(`/signal?symbol=${market.value}&tf=${tf.value}`);
const data = await res.json();

/* SIGNAL */
signal.innerText = data.signal || "WAIT";
signal.className =
data.signal==="BUY"?"signal buy":
data.signal==="SELL"?"signal sell":"signal wait";

/* PRICE */
price.innerText =
"PRICE: " + (data.price ?? "--");

/* RSI */
rsi.innerText =
data.rsi ?? "50";

/* STRUCTURE */
macd.innerText =
data.structure ?? "NEUTRAL";

/* SMC SCORE */
smc.innerText =
(data.confidence ?? 0) + "%";

/* QUALITY */
quality.innerText =
data.quality ?? "LOW";

/* TIMER */
if(data.signal !== "WAIT"){
startTimer();
}

}

</script>

</body>
</html>
