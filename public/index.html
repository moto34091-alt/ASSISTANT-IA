<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>NZFX AI TERMINAL</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050816;
font-family:Arial,sans-serif;
color:white;
overflow-x:hidden;
}

/* =========================
HEADER
========================= */

header{

padding:20px;

background:#0b1220;

border-bottom:1px solid #00ff9d33;

text-align:center;

}

header h1{

font-size:28px;

color:#00ff9d;

margin-bottom:5px;

}

header p{

color:#999;

font-size:14px;

}

/* =========================
TOP BAR
========================= */

.topbar{

display:flex;

gap:10px;

padding:15px;

}

select{

flex:1;

background:#0f172a;

color:white;

border:none;

padding:12px;

border-radius:10px;

font-size:16px;

}

/* =========================
STATUS
========================= */

#status{

text-align:center;

padding:10px;

color:#00ff9d;

font-weight:bold;

}

/* =========================
SIGNAL BOX
========================= */

.signal-box{

margin:15px;

padding:25px;

border-radius:20px;

text-align:center;

background:#0c1224;

border:1px solid #00ff9d22;

box-shadow:0 0 25px #00ff2222;

}

.signal-label{

font-size:16px;

color:#999;

margin-bottom:10px;

}

.signal-value{

font-size:60px;

font-weight:900;

}

.buy{
color:#00ff9d;
text-shadow:0 0 20px #00ff9d;
}

.sell{
color:#ff3b5c;
text-shadow:0 0 20px #ff3b5c;
}

.wait{
color:#facc15;
}

/* =========================
TRADINGVIEW
========================= */

#tvchart{

height:350px;

margin:15px;

border-radius:20px;

overflow:hidden;

}

/* =========================
GRID
========================= */

.grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:12px;

padding:15px;

}

.card{

background:#0c1224;

padding:20px;

border-radius:20px;

border:1px solid #00ff9d22;

backdrop-filter:blur(10px);

box-shadow:0 0 20px rgba(0,255,157,0.05);

}

.label{

font-size:13px;

color:#888;

margin-bottom:12px;

}

.value{

font-size:28px;

font-weight:bold;

}

/* =========================
MARKET
========================= */

.market{

margin:15px;

padding:20px;

background:#0c1224;

border-radius:20px;

border:1px solid #00ff9d22;

}

.market-row{

display:flex;

justify-content:space-between;

margin-bottom:15px;

}

/* =========================
BOT
========================= */

.telegram{

position:fixed;

right:20px;

bottom:20px;

width:70px;

height:70px;

display:flex;

align-items:center;

justify-content:center;

border-radius:50%;

background:#00ff9d;

color:black;

font-size:28px;

text-decoration:none;

font-weight:bold;

box-shadow:0 0 25px #00ff9d;

}

</style>

</head>

<body>

<header>

<h1>🚀 NZFX AI TERMINAL</h1>

<p>BINANCE LIVE FUTURES ENGINE</p>

</header>

<div class="topbar">

<select id="symbol">

<option value="BTCUSDT">BTC/USDT</option>
<option value="ETHUSDT">ETH/USDT</option>
<option value="SOLUSDT">SOL/USDT</option>
<option value="BNBUSDT">BNB/USDT</option>
<option value="XRPUSDT">XRP/USDT</option>
<option value="DOGEUSDT">DOGE/USDT</option>

</select>

<select id="interval">

<option value="1m">1 MIN</option>
<option value="5m">5 MIN</option>
<option value="15m">15 MIN</option>
<option value="1h">1 HOUR</option>

</select>

</div>

<div id="status">
🟢 CONNECTED TO BINANCE
</div>

<div class="signal-box">

<div class="signal-label">
AI SIGNAL
</div>

<div
id="signal"
class="signal-value wait"
>
WAIT
</div>

</div>

<div id="tvchart"></div>

<div class="market">

<div class="market-row">
<span>MARKET TREND</span>
<b id="trend">SIDEWAYS</b>
</div>

<div class="market-row">
<span>SIGNAL STRENGTH</span>
<b id="strength">0%</b>
</div>

<div class="market-row">
<span>24H VOLUME</span>
<b id="volume">0</b>
</div>

</div>

<div class="grid">

<div class="card">
<div class="label">PRICE</div>
<div class="value" id="price">0</div>
</div>

<div class="card">
<div class="label">RSI</div>
<div class="value" id="rsi">0</div>
</div>

<div class="card">
<div class="label">EMA FAST</div>
<div class="value" id="emaF">0</div>
</div>

<div class="card">
<div class="label">EMA SLOW</div>
<div class="value" id="emaS">0</div>
</div>

<div class="card">
<div class="label">WIN RATE</div>
<div class="value" id="win">0%</div>
</div>

<div class="card">
<div class="label">MOMENTUM</div>
<div class="value" id="momentum">0</div>
</div>

</div>

<a
class="telegram"
href="https://t.me/signalstradings_bot"
target="_blank"
>
📡
</a>

<script>

/* =========================
WEBSOCKET
========================= */

const protocol =
location.protocol === "https:"
? "wss://"
: "ws://";

const ws =
new WebSocket(
protocol + location.host
);

/* =========================
ELEMENTS
========================= */

const signal =
document.getElementById("signal");

const statusBox =
document.getElementById("status");

const symbolSelect =
document.getElementById("symbol");

const intervalSelect =
document.getElementById("interval");

/* =========================
TRADINGVIEW
========================= */

let widget;

function loadChart(){

document.getElementById(
"tvchart"
).innerHTML = "";

widget = new TradingView.widget({

container_id:"tvchart",

autosize:true,

symbol:
"BINANCE:" +
symbolSelect.value,

interval:
intervalSelect.value.replace("m",""),

theme:"dark",

style:"1",

locale:"fr",

toolbar_bg:"#050816",

hide_top_toolbar:false,

enable_publishing:false

});

}

loadChart();

/* =========================
SEND REQUEST
========================= */

function requestData(){

ws.send(JSON.stringify({

symbol:
symbolSelect.value,

interval:
intervalSelect.value

}));

}

symbolSelect.onchange = ()=>{

loadChart();

requestData();

};

intervalSelect.onchange = ()=>{

loadChart();

requestData();

};

/* =========================
SOCKET
========================= */

ws.onopen = ()=>{

statusBox.innerHTML =
"🟢 LIVE CONNECTED";

requestData();

};

ws.onmessage = (msg)=>{

const d =
JSON.parse(msg.data);

/* SIGNAL */

signal.innerText =
d.signal;

signal.className =
"signal-value " +
(d.signal === "BUY"
? "buy"
: d.signal === "SELL"
? "sell"
: "wait");

/* DATA */

document.getElementById("price")
.innerText = d.price;

document.getElementById("rsi")
.innerText = d.rsi;

document.getElementById("emaF")
.innerText = d.emaFast;

document.getElementById("emaS")
.innerText = d.emaSlow;

document.getElementById("win")
.innerText = d.winRate + "%";

document.getElementById("momentum")
.innerText = d.momentum;

document.getElementById("trend")
.innerText = d.trend;

document.getElementById("strength")
.innerText = d.strength + "%";

document.getElementById("volume")
.innerText = d.volume + "M";

};

ws.onerror = ()=>{

statusBox.innerHTML =
"🔴 CONNECTION ERROR";

};

</script>

</body>
</html>
