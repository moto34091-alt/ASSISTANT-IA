<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI PRO V8</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.app{
width:95%;
max-width:420px;
background:#0c1224;
border-radius:20px;
padding:15px;
box-shadow:0 0 25px #00ff9d22;
}

/* TITLE */
h2{
text-align:center;
color:#00ff9d;
margin-bottom:10px;
}

/* SELECT */
select{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:12px;
background:#111a33;
color:white;
font-weight:bold;
}

/* BUTTON */
button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
background:#00ff9d;
color:black;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:active{
transform:scale(0.96);
}

/* SIGNAL */
.signal{
font-size:60px;
text-align:center;
margin:15px 0;
font-weight:bold;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

/* INFO */
.info{
text-align:center;
color:#aaa;
margin:5px 0;
font-size:16px;
}

/* BAR */
.bar{
width:100%;
height:10px;
background:#1a1f35;
border-radius:20px;
overflow:hidden;
margin-top:12px;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:1s linear;
}

/* TIMER */
.timer{
text-align:center;
margin-top:8px;
color:#aaa;
font-size:14px;
}

</style>

</head>

<body>

<div class="app">

<h2>📊 SNIPER AI PRO V8</h2>

<!-- 📊 REAL MARKET ONLY -->
<select id="market">

<option value="EURUSD">EUR/USD</option>
<option value="GBPUSD">GBP/USD</option>
<option value="USDJPY">USD/JPY</option>
<option value="USDCHF">USD/CHF</option>
<option value="USDCAD">USD/CAD</option>
<option value="AUDUSD">AUD/USD</option>
<option value="NZDUSD">NZD/USD</option>

<option value="EURJPY">EUR/JPY</option>
<option value="GBPJPY">GBP/JPY</option>

<option value="XAUUSD">GOLD (XAU/USD)</option>

<option value="NAS100">NASDAQ 100</option>
<option value="SPX500">S&P 500</option>
<option value="DOWJONES">DOW JONES</option>

</select>

<!-- TIMEFRAME -->
<select id="time">
<option value="60">1 MIN</option>
<option value="300">5 MIN</option>
<option value="900">15 MIN</option>
</select>

<button onclick="analyze()">🔄 ANALYZE SIGNAL</button>

<button onclick="autoMode()">🤖 AUTO MODE</button>

<div id="signal" class="signal wait">WAIT</div>

<div class="info" id="score">SCORE: 0</div>
<div class="info" id="prob">PROB: 0%</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="timer" id="timer">READY</div>

</div>

<script>

let intervalAuto;

/* ANALYZE */
async function analyze(){

const market=document.getElementById("market").value;
const tf=document.getElementById("time").value;

const res = await fetch(`/api/analyze/${market}/1m`);
const data = await res.json();

const signal=document.getElementById("signal");
const score=document.getElementById("score");
const prob=document.getElementById("prob");

/* SIGNAL */
if(data.signal==="BUY"){
signal.innerText="🟢 BUY";
signal.className="signal buy";
playSound();
}

else if(data.signal==="SELL"){
signal.innerText="🔴 SELL";
signal.className="signal sell";
playSound();
}

else{
signal.innerText="🟡 WAIT";
signal.className="signal wait";
}

/* DATA */
score.innerText="SCORE: "+(data.score || 0);
prob.innerText="PROB: "+(data.probability || 0)+"%";

/* BAR */
document.getElementById("fill").style.width =
(data.probability || 0) + "%";

}

/* 🤖 AUTO MODE */
function autoMode(){

if(intervalAuto){
clearInterval(intervalAuto);
intervalAuto=null;
alert("AUTO STOPPED");
return;
}

alert("AUTO STARTED");

intervalAuto=setInterval(()=>{
analyze();
vibrate();
},5000);

}

/* 🔊 SOUND ALERT */
function playSound(){
let audio=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
audio.play();
}

/* 📳 VIBRATION */
function vibrate(){
if(navigator.vibrate){
navigator.vibrate(200);
}
}

</script>

</body>
</html>
