<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI PRO</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.app{
width:95%;
max-width:420px;
background:#0c1224;
border-radius:25px;
padding:20px;
border:1px solid #00ff9d22;
box-shadow:0 0 25px #00ff9d22;
}

/* BUTTONS */
button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:14px;
background:#00ff9d;
font-weight:bold;
cursor:pointer;
}

/* LIST */
.list{
margin-top:15px;
max-height:250px;
overflow:auto;
}

.item{
padding:12px;
margin-bottom:8px;
background:#111a33;
border-radius:12px;
display:flex;
justify-content:space-between;
cursor:pointer;
border:1px solid transparent;
}

.item.active{
border:1px solid #00ff9d;
}

/* TIMER BAR */
.bar{
height:8px;
width:100%;
background:#1a1f35;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
animation:none;
}

/* RESULT */
.signal{
font-size:55px;
text-align:center;
margin-top:20px;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{opacity:1;}
50%{opacity:0.4;}
100%{opacity:1;}
}

.hidden{display:none;}

</style>

</head>

<body>

<div class="app">

<h3>🚀 SNIPER AI SCANNER</h3>

<button onclick="scan()">🔄 ACTUALISER MARCHÉS</button>

<div id="list" class="list hidden"></div>

<div id="step2" class="hidden">
<h3>⏱ TIMEFRAME</h3>
<button onclick="setTime('1m')">1M</button>
<button onclick="setTime('5m')">5M</button>
<button onclick="setTime('15m')">15M</button>
</div>

<div id="step3" class="hidden">
<h3>🧠 ANALYSE</h3>

<div class="bar">
<div class="fill" id="bar"></div>
</div>

<button onclick="analyze()">START ANALYSE</button>
</div>

<div id="result" class="hidden">
<div class="signal" id="signal">---</div>
</div>

</div>

<script>

let markets = [];
let selected = "";
let time = "";

/* ================= SCAN ================= */
function scan(){

markets = [
"BTCUSD","ETHUSD","EURUSD","GBPUSD","USDJPY",
"GOLD","NAS100","SPX500","GER40","AUDUSD"
];

let list = document.getElementById("list");
list.classList.remove("hidden");
list.innerHTML = "";

markets.forEach(m=>{

let div = document.createElement("div");
div.className="item";
div.innerHTML = `<span>${m}</span><span>🔥</span>`;

div.onclick = ()=>{
document.querySelectorAll(".item").forEach(x=>x.classList.remove("active"));
div.classList.add("active");
selected = m;
document.getElementById("step2").classList.remove("hidden");
};

list.appendChild(div);

});

}

/* ================= TIME ================= */
function setTime(t){
time = t;
document.getElementById("step3").classList.remove("hidden");
}

/* ================= ANALYSE ================= */
async function analyze(){

const bar = document.getElementById("bar");
bar.style.animation = "none";
void bar.offsetWidth;
bar.style.animation = "shrink 5s linear forwards";

const res = await fetch(`/api/${selected}/${time}`);
const data = await res.json();

setTimeout(()=>{

document.getElementById("result").classList.remove("hidden");
document.getElementById("signal").innerText =
data.signal + " (" + data.strength + "%)";

},5000);

}

</script>

<style>
@keyframes shrink{
from{width:100%;}
to{width:0%;}
}
</style>

</body>
</html>
