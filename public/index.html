<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocket Sniper AI</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1f;
color:white;
overflow:hidden;
}

/* ================= TOP BAR ================= */
.top{
height:60px;
background:#0f172a;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
border-bottom:1px solid #00ff9d22;
}

.logo{
color:#00ff9d;
font-weight:bold;
}

.balance{
font-size:12px;
color:#aaa;
}

/* ================= CHART AREA ================= */
.chart{
height:45vh;
background:radial-gradient(circle at top,#111a33,#070b16);
display:flex;
justify-content:center;
align-items:center;
font-size:12px;
color:#555;
}

/* ================= SIGNAL PANEL ================= */
.panel{
padding:20px;
text-align:center;
}

.signal{
font-size:70px;
font-weight:bold;
margin:10px 0;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1); opacity:1;}
50%{transform:scale(1.1); opacity:0.5;}
100%{transform:scale(1); opacity:1;}
}

.status{
font-size:13px;
color:#888;
}

/* ================= ACTION BUTTONS ================= */
.actions{
position:fixed;
bottom:0;
width:100%;
display:flex;
gap:10px;
padding:15px;
background:#0f172a;
border-top:1px solid #00ff9d22;
}

button{
flex:1;
padding:15px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.buy{
background:#00ff9d;
color:black;
}

.sell{
background:#ff3b5c;
color:white;
}

.analyze{
background:#1f2937;
color:white;
}

/* ================= LIGHT EFFECT ================= */
.glow{
position:absolute;
width:300px;
height:300px;
background:#00ff9d;
filter:blur(140px);
opacity:0.12;
top:30%;
left:50%;
transform:translate(-50%,-50%);
animation:move 5s infinite alternate;
}

@keyframes move{
from{transform:translate(-50%,-50%) scale(1);}
to{transform:translate(-50%,-50%) scale(1.3);}
}

</style>

</head>

<body>

<div class="glow"></div>

<div class="top">
<div class="logo">POCKET SNIPER AI</div>
<div class="balance">LIVE • BTC/USD</div>
</div>

<div class="chart">
📊 LIVE CHART AREA
</div>

<div class="panel">

<div class="status" id="status">READY</div>

<div class="signal" id="signal">WAIT</div>

<div class="status" id="info">ANALYSIS ENGINE ACTIVE</div>

</div>

<div class="actions">

<button class="buy" onclick="run()">
BUY
</button>

<button class="analyze" onclick="run()">
ANALYZE
</button>

<button class="sell" onclick="run()">
SELL
</button>

</div>

<script>

async function run(){

document.getElementById("status").innerText = "ANALYZING...";

const res = await fetch("/api/BTCUSD/1m");
const data = await res.json();

let s = data.signal || "WAIT";

document.getElementById("signal").innerText = s;

/* STYLE FEEDBACK */
if(s === "BUY"){
document.getElementById("signal").style.color = "#00ff9d";
document.body.style.background = "#041a12";
}

if(s === "SELL"){
document.getElementById("signal").style.color = "#ff3b5c";
document.body.style.background = "#1a0404";
}

if(s === "WAIT"){
document.getElementById("signal").style.color = "#facc15";
document.body.style.background = "#0a0f1f";
}

document.getElementById("status").innerText =
"POSITION READY";

document.getElementById("info").innerText =
"RSI + MOMENTUM ANALYZED";

}

</script>

</body>
</html>
