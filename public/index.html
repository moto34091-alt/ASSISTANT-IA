<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SNIPER V9</title>

<style>
body{
margin:0;
background:#050505;
color:white;
font-family:Arial;
}

.screen{display:none;text-align:center;padding:20px;}
.active{display:block;}

button{
padding:15px;
margin:10px;
background:#00aaff;
border:none;
color:white;
border-radius:10px;
}

.card{
background:#111;
padding:20px;
border-radius:15px;
margin-top:20px;
}

.signal{
font-size:30px;
font-weight:bold;
}
</style>
</head>

<body>

<div id="s1" class="screen active">
<h2>📊 MARKET</h2>
<button onclick="setS('EURUSD')">EUR/USD</button>
<button onclick="setS('GBPUSD')">GBP/USD</button>
</div>

<div id="s2" class="screen">
<h2>⏱ TIME</h2>
<button onclick="setT('1m')">1M</button>
<button onclick="setT('5m')">5M</button>
</div>

<div id="s3" class="screen">
<h2>⚡ ANALYSING...</h2>
</div>

<div id="s4" class="screen">
<div class="card">
<div id="sig" class="signal"></div>
<div id="info"></div>
</div>

<button onclick="reset()">RESET</button>
</div>

<script src="app.js"></script>

</body>
</html>
