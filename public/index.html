<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>D-FLAM BOT TRADING</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:15px;
}

.app{
width:100%;
max-width:420px;
background:#0c1224;
padding:15px;
border-radius:15px;
}

h2{text-align:center;color:#00ff9d;}

select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:none;
font-weight:bold;
}

button{background:#00ff9d;color:black;}

.icon{
text-align:center;
font-size:60px;
margin-top:15px;
}

.signal{
text-align:center;
font-size:34px;
font-weight:bold;
margin-top:5px;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}
.entry{color:#00c3ff;}

.info{
text-align:center;
margin-top:6px;
font-size:14px;
color:#ccc;
}

.bar{
height:10px;
background:#1d2746;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
}

.timer{
text-align:center;
margin-top:6px;
font-size:13px;
color:#aaa;
}
</style>
</head>

<body>

<div class="app">

<h2>SNIPER AI PRO V3</h2>

<select id="market">
<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>EUR/JPY</option>
<option>USD/CHF</option>
<option>AUD/USD</option>
<option>USD/CAD</option>
<option>EUR/GBP</option>
<option>GBP/JPY</option>
<option>EUR/AUD</option>
<option>EUR/CAD</option>
<option>GBP/CHF</option>
<option>CHF/JPY</option>
<option>AUD/JPY</option>
<option>NZD/USD</option>
<option>BTC/USD</option>
<option>ETH/USD</option>
<option>US30</option>
<option>NAS100</option>
<option>XAU/USD</option>
</select>

<select id="time">
<option value="60">1 MIN</option>
<option value="300">5 MIN</option>
<option value="900">15 MIN</option>
</select>

<button onclick="analyze()">ANALYZE</button>
<button onclick="autoMode()">AUTO MODE</button>

<div id="icon" class="icon">🟡</div>
<div id="signal" class="signal wait">WAIT</div>

<div class="info" id="price">PRICE: --</div>
<div class="info" id="score">SCORE: 0</div>
<div class="info" id="prob">PROB: 0%</div>
<div class="info" id="winrate">WINRATE: 0%</div>

<div class="bar"><div id="fill" class="fill"></div></div>
<div class="timer" id="timer"></div>

</div>

<script>

let lock=false;
let interval=null;
let timer=null;

let lastKey="";
let lastData=null;

/* =========================
   💰 MARKET PRICE SIMULÉ
========================= */
function getPrice(base){
let p = 100 + Math.random()*50;
return p.toFixed(2);
}

/* =========================
   🧠 IA FORTIFIÉE
========================= */
function ai(){

let rsi = Math.random()*100;
let trend1 = Math.random()*2-1;
let trend2 = Math.random()*2-1; // confirmation
let volume = Math.random()*100;

/* RSI */
let rsiS = rsi<30?1:rsi>70?-1:0;

/* TREND DOUBLE CONFIRM */
let trendS = (trend1>0.25 && trend2>0.25) ? 1 :
             (trend1<-0.25 && trend2<-0.25) ? -1 : 0;

/* VOLUME FILTER */
let volS = volume>65?1:volume<35?-1:0;

/* SCORE FINAL */
let score =
(rsiS*0.4) +
(trendS*0.5) +
(volS*0.1);

/* SIGNAL */
let signal="WAIT";
if(score>0.45) signal="BUY";
else if(score<-0.45) signal="SELL";

/* ENTRY POINT EXACT */
let entry=false;
if(Math.abs(score)>0.55 && trendS!==0){
entry=true;
}

/* WINRATE SIMULÉ */
let winrate = Math.min(95, Math.floor(55 + Math.abs(score)*80));

let prob = Math.min(100, Math.floor(Math.abs(score)*100 + 40));

return {
rsi,
trend1,
trend2,
volume,
score,
signal,
prob,
entry,
winrate
};
}

/* =========================
   ANALYZE
========================= */
function analyze(){

let m=document.getElementById("market").value;
let t=document.getElementById("time").value;
let key=m+"_"+t;

if(lock && key===lastKey){
apply(lastData);
return;
}

lock=true;
lastKey=key;

document.getElementById("icon").innerText="🧠";
document.getElementById("signal").innerText="SCANNING...";
document.getElementById("signal").className="signal wait";

setTimeout(()=>{

let data=ai();
lastData=data;

apply(data,m);

startTimer(t);

},900);
}

/* =========================
   APPLY
========================= */
function apply(d,market){

let icon=document.getElementById("icon");
let s=document.getElementById("signal");

/* PRICE */
document.getElementById("price").innerText =
"PRICE: " + getPrice(market);

/* SIGNAL */
if(d.entry){
s.innerText="ENTRY POINT EXACT";
s.className="signal entry";
icon.innerText="⚡";
}
else if(d.signal=="BUY"){
s.innerText="BUY";
s.className="signal buy";
icon.innerText="🟢";
}
else if(d.signal=="SELL"){
s.innerText="SELL";
s.className="signal sell";
icon.innerText="🔴";
}
else{
s.innerText="WAIT";
s.className="signal wait";
icon.innerText="🟡";
}

/* INFO */
document.getElementById("score").innerText =
"SCORE: "+d.score.toFixed(2);

document.getElementById("prob").innerText =
"PROB: "+d.prob+"%";

document.getElementById("winrate").innerText =
"WINRATE: "+d.winrate+"%";

/* cacher timer si WAIT */
if(d.signal=="WAIT" && !d.entry){
document.getElementById("timer").innerText="";
}
}

/* =========================
   TIMER
========================= */
function startTimer(sec){

clearInterval(timer);
let r=sec;

timer=setInterval(()=>{

r--;

document.getElementById("fill").style.width=(r/sec*100)+"%";
document.getElementById("timer").innerText=r+" SEC";

if(r<=0){
clearInterval(timer);
lock=false;
document.getElementById("timer").innerText="READY";
}

},1000);
}

/* =========================
   AUTO MODE
========================= */
function autoMode(){

if(interval){
clearInterval(interval);
interval=null;
return;
}

interval=setInterval(()=>{
if(!lock) analyze();
},3000);
}

</script>

</body>
</html>
