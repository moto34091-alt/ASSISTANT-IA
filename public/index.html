<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D-FLAM BOT TRADING</title>

<style>

/* ===== GLOBAL ===== */
body{
margin:0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
background: linear-gradient(160deg,#050816,#0b1430);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:12px;
}

/* ===== APP CARD ===== */
.app{
width:100%;
max-width:420px;
background: rgba(15, 20, 45, 0.9);
border-radius:24px;
padding:18px;
box-shadow:0 10px 40px rgba(0,0,0,0.6);
backdrop-filter: blur(12px);
border:1px solid rgba(255,255,255,0.06);
}

/* ===== HEADER ===== */
.header{
text-align:center;
font-size:20px;
font-weight:700;
color:#00ff9d;
letter-spacing:1px;
margin-bottom:12px;
}

/* ===== SELECTS ===== */
select,button{
width:100%;
padding:14px;
margin-top:10px;
border-radius:14px;
border:none;
font-size:14px;
font-weight:600;
outline:none;
}

select{
background:#141d38;
color:white;
}

button{
background: linear-gradient(90deg,#00ff9d,#00c3ff);
color:black;
cursor:pointer;
transition:0.2s;
}

button:active{
transform:scale(0.98);
}

/* ===== SIGNAL CARD ===== */
.card{
margin-top:16px;
padding:14px;
border-radius:18px;
background: rgba(255,255,255,0.03);
text-align:center;
}

/* ===== SIGNAL ===== */
.signal{
font-size:48px;
font-weight:800;
margin-top:5px;
}

.buy{
color:#00ff9d;
text-shadow:0 0 18px #00ff9d;
}

.sell{
color:#ff3b5c;
text-shadow:0 0 18px #ff3b5c;
}

.wait{
color:#facc15;
}

/* ===== INFO GRID ===== */
.info{
margin-top:8px;
font-size:14px;
color:#cfcfcf;
}

/* ===== TIMER ===== */
.timerBox{
margin-top:15px;
display:none;
}

.bar{
height:10px;
background:#1a2340;
border-radius:20px;
overflow:hidden;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:width 1s linear;
}

.timerText{
text-align:center;
margin-top:6px;
font-size:13px;
color:#aaa;
}

/* ===== BADGE ===== */
.badge{
text-align:center;
font-size:12px;
padding:5px 10px;
border-radius:10px;
background:rgba(0,255,157,0.1);
border:1px solid rgba(0,255,157,0.25);
margin-bottom:10px;
}

</style>
</head>

<body>

<div class="app">

<div class="header">🔥 SNIPER AI PRO</div>
<div class="badge">ANDROID TRADING ENGINE</div>

<select id="market">
<option>EURUSD</option>
<option>GBPUSD</option>
<option>USDJPY</option>
<option>BTCUSD</option>
<option>ETHUSD</option>
<option>XAUUSD</option>
</select>

<select id="tf">
<option value="1min">⚡ 1 MIN</option>
<option value="5min">📊 5 MIN</option>
<option value="15min">📈 15 MIN</option>
</select>

<button onclick="analyze()">📡 ANALYSE</button>

<button id="autoBtn" onclick="toggleAuto()">🤖 AUTO MODE</button>

<div class="card">

<div id="signal" class="signal wait">WAIT</div>

<div class="info" id="price">PRICE: --</div>
<div class="info" id="rsi">RSI: --</div>
<div class="info" id="conf">CONF: 0%</div>

</div>

<!-- TIMER -->
<div class="timerBox" id="timerBox">

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="timerText" id="timerText">60 SEC EXPIRATION</div>

</div>

</div>

<script>

let timer=null;
let auto=null;

/* ANALYSE */
async function analyse(){

const symbol=document.getElementById("market").value;
const tf=document.getElementById("tf").value;

const res=await fetch(`/signal?symbol=${symbol}&tf=${tf}`);
const d=await res.json();

const s=document.getElementById("signal");
s.innerText=d.signal;
s.className="signal "+d.signal.toLowerCase();

document.getElementById("price").innerText="PRICE: "+d.price;
document.getElementById("rsi").innerText="RSI: "+d.rsi;
document.getElementById("conf").innerText="CONF: "+d.confidence+"%";

startTimer();

}

/* TIMER */
function startTimer(){

clearInterval(timer);

let t=60;

document.getElementById("timerBox").style.display="block";

timer=setInterval(()=>{

t--;

document.getElementById("fill").style.width=(t/60*100)+"%";
document.getElementById("timerText").innerText=t+" SEC EXPIRATION";

if(t<=0){
clearInterval(timer);
document.getElementById("timerBox").style.display="none";
}

},1000);

}

/* AUTO MODE */
function toggleAuto(){

const btn=document.getElementById("autoBtn");

if(auto){
clearInterval(auto);
auto=null;
btn.innerText="🤖 AUTO MODE";
btn.style.background="";
return;
}

btn.innerText="AUTO RUNNING...";
btn.style.background="#ff3b5c";

auto=setInterval(()=>analyse(),4000);

}

</script>

</body>
</html>
