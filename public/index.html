<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI PRO</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
overflow:hidden;
}

/* ================= PAGES ================= */
.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
opacity:0;
transform:translateX(80px);
transition:0.4s ease;
pointer-events:none;
}

.page.active{
opacity:1;
transform:translateX(0);
pointer-events:auto;
}

/* ================= CARD ================= */
.card{
width:90%;
max-width:360px;
background:#0c1224;
border-radius:25px;
padding:25px;
text-align:center;
border:1px solid #00ff9d22;
box-shadow:0 0 25px #00ff9d22;
}

/* ================= BUTTON ================= */
button{
width:100%;
margin-top:10px;
padding:14px;
border:none;
border-radius:14px;
background:#00ff9d;
font-weight:bold;
cursor:pointer;
}

/* ================= SIGNAL ================= */
.signal{
font-size:50px;
margin-top:15px;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{opacity:1;}
50%{opacity:0.4;}
100%{opacity:1;}
}

/* ================= TIMER ================= */
.bar{
width:100%;
height:8px;
background:#1a1f35;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
animation: shrink 5s linear forwards;
}

@keyframes shrink{
from{width:100%;}
to{width:0%;}
}

</style>

</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="p1">
<div class="card">
<h2>📊 MARCHÉ</h2>

<button onclick="setMarket('BTCUSD')">BTC/USD</button>
<button onclick="setMarket('EURUSD')">EUR/USD</button>
<button onclick="setMarket('GBPUSD')">GBP/USD</button>

</div>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
<div class="card">
<h2>⏱ TIMEFRAME</h2>

<button onclick="setTime('1m')">1 MIN</button>
<button onclick="setTime('5m')">5 MIN</button>
<button onclick="setTime('15m')">15 MIN</button>

</div>
</div>

<!-- PAGE 3 -->
<div class="page" id="p3">
<div class="card">
<h2>⌛ ANALYSE</h2>

<div class="signal" id="loading">WAIT</div>

<div class="bar">
<div class="fill"></div>
</div>

<button onclick="runAnalysis()">START</button>

</div>
</div>

<!-- PAGE 4 -->
<div class="page" id="p4">
<div class="card">
<h2>🔥 POSITION</h2>

<div class="signal" id="result">---</div>

<div id="info">---</div>

</div>
</div>

<script>

let market = "";
let time = "";

/* ================= NAV ================= */
function show(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* ================= STEP 1 ================= */
function setMarket(m){
market = m;
show("p2");
}

/* ================= STEP 2 ================= */
function setTime(t){
time = t;
show("p3");
}

/* ================= STEP 3 ================= */
async function runAnalysis(){

document.getElementById("loading").innerText = "ANALYZING...";

/* restart animation */
let bar = document.querySelector(".fill");
bar.style.animation = "none";
void bar.offsetWidth;
bar.style.animation = "shrink 5s linear forwards";

const res = await fetch(`/api/${market}/${time}`);
const data = await res.json();

setTimeout(()=>{

show("p4");

document.getElementById("result").innerText =
data.signal;

document.getElementById("info").innerText =
"RSI: " + data.rsi + " | SCORE: " + data.score;

},5000);

}

</script>

</body>
</html>
