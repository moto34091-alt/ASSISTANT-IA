<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>D-FLAM BOT TRADING</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:15px;
}

.app{
width:100%;
max-width:420px;
background:#0c1224;
padding:15px;
border-radius:15px;
}

h2{text-align:center;color:#00ff9d;}

select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:none;
font-weight:bold;
}

button{background:#00ff9d;color:black;}

.icon{
text-align:center;
font-size:60px;
margin-top:15px;
}

.signal{
text-align:center;
font-size:40px;
font-weight:bold;
margin-top:5px;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

.info{
text-align:center;
margin-top:8px;
}

.bar{
height:10px;
background:#1d2746;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
}

.timer{
text-align:center;
margin-top:8px;
font-size:14px;
display:none;
}

.price{
text-align:center;
margin-top:6px;
font-size:16px;
color:#aaa;
}

.entry{
text-align:center;
margin-top:6px;
font-size:16px;
color:#00ff9d;
font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

<h2>SNIPER AI PRO V3</h2>

<select id="market">
<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>EUR/JPY</option>
<option>USD/CHF</option>
<option>AUD/USD</option>
<option>USD/CAD</option>
<option>EUR/GBP</option>
<option>GBP/JPY</option>
<option>EUR/AUD</option>
<option>EUR/CAD</option>
<option>GBP/CHF</option>
<option>CHF/JPY</option>
<option>AUD/JPY</option>
<option>NZD/USD</option>
<option>BTC/USD</option>
<option>ETH/USD</option>
<option>US30</option>
<option>NAS100</option>
<option>XAU/USD</option>
</select>

<select id="time">
<option value="60">1 MIN</option>
<option value="300">5 MIN</option>
<option value="900">15 MIN</option>
</select>

<button onclick="analyze()">ANALYZE</button>

<div id="icon" class="icon">🟡</div>
<div id="signal" class="signal wait">WAIT</div>

<div class="entry" id="entry">ENTRY POINT: -</div>
<div class="price" id="price">PRICE: --</div>

<div class="info" id="score">SCORE: 0</div>
<div class="info" id="prob">PROB: 0%</div>
<div class="info" id="winrate">WINRATE: 0%</div>

<div class="bar"><div id="fill" class="fill"></div></div>

<div class="timer" id="timer">READY</div>

</div>

<script>

let timer=null;

/* PRICE SIM */
function getPrice(market){
let base = 50 + Math.random()*50;
if(market.includes("JPY")) base = 100 + Math.random()*50;
if(market.includes("BTC")) base = 60000 + Math.random()*2000;
if(market.includes("XAU")) base = 2300 + Math.random()*50;
return base.toFixed(2);
}

/* 🧠 IA SNIPER PRO V3 */
function ai(){

let price = 50 + Math.random()*50;

/* TIMEFRAMES */
let tf1 = Math.random()*2-1;
let tf5 = Math.random()*2-1;

/* RSI */
let rsi = 30 + Math.random()*40;

/* MOMENTUM */
let momentum = Math.random()*2-1;

/* SUPPORT / RESISTANCE */
let support = 40;
let resistance = 90;

let supportZone = price < support + 5 ? 1 : 0;
let resistanceZone = price > resistance - 5 ? 1 : 0;

/* RSI DIVERGENCE */
let rsiBuy = (momentum < 0 && rsi > 55) ? 1 : 0;
let rsiSell = (momentum > 0 && rsi < 45) ? 1 : 0;

/* MULTI TF */
let tfBuy = (tf1 > 0 && tf5 > 0) ? 1 : 0;
let tfSell = (tf1 < 0 && tf5 < 0) ? 1 : 0;

/* FAKE BREAKOUT */
let breakout = Math.abs(momentum) > 0.9;
let volume = Math.random();

let fakeBreakout = breakout && volume < 0.4;

/* BLOCK FAKE */
if(fakeBreakout){
return {
signal:"WAIT",
score:0,
prob:45,
winrate:45,
entry:"FAKE BREAKOUT BLOCKED ❌"
};
}

/* SCORES */
let buyScore =
(rsiBuy*2) +
(tfBuy*2) +
(supportZone*1.5) +
(momentum>0?1:0);

let sellScore =
(rsiSell*2) +
(tfSell*2) +
(resistanceZone*1.5) +
(momentum<0?1:0);

/* SIGNAL */
let signal="WAIT";

if(buyScore >= 4) signal="BUY";
else if(sellScore >= 4) signal="SELL";

/* PROB */
let prob = Math.min(92, 50 + Math.max(buyScore,sellScore)*10);

/* WINRATE */
let winrate = 50 + Math.max(buyScore,sellScore)*8;

if(tfBuy || tfSell) winrate += 5;
if(supportZone || resistanceZone) winrate += 3;

if(winrate > 90) winrate = 90;
if(winrate < 45) winrate = 45;

/* ENTRY */
let entry =
signal=="BUY" ? "SNIPER BUY ENTRY 🔼" :
signal=="SELL" ? "SNIPER SELL ENTRY 🔽" : "-";

return {price,signal,prob,winrate,entry};
}

/* APPLY */
function apply(d,m){

document.getElementById("icon").innerText =
d.signal=="BUY"?"🟢":d.signal=="SELL"?"🔴":"🟡";

document.getElementById("signal").innerText = d.signal;
document.getElementById("signal").className =
"signal " + (d.signal=="BUY"?"buy":d.signal=="SELL"?"sell":"wait");

document.getElementById("entry").innerText="ENTRY POINT: "+d.entry;
document.getElementById("price").innerText="PRICE: "+getPrice(m);
document.getElementById("prob").innerText="PROB: "+d.prob+"%";
document.getElementById("winrate").innerText="WINRATE: "+d.winrate.toFixed(1)+"%";
}

/* ANALYZE */
function analyze(){

let m=document.getElementById("market").value;

document.getElementById("icon").innerText="🧠";
document.getElementById("signal").innerText="ANALYZING...";

setTimeout(()=>{

let d=ai();
apply(d,m);

},600);
}

</script>

</body>
</html>
