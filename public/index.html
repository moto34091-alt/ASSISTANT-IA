<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SNIPER AI PRO V4</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
background:#050816;
color:white;
display:flex;
justify-content:center;
padding:10px;
min-height:100vh;
}

.app{
width:100%;
max-width:430px;
background:#0c1224;
border-radius:25px;
padding:15px;
border:1px solid #1f2b4d;
}

.top{display:flex;justify-content:space-between}
.live{color:#00ff9d;font-weight:bold}
.clock{color:#ccc}

h2{text-align:center;color:#00ff9d;margin:10px 0}

select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:12px;
border:none;
font-weight:bold;
}

button{
background:#00ff9d;
color:black;
cursor:pointer;
}

button.auto{
background:#1d2d52;
color:white;
}

/* SIGNAL */
.signalBox{
margin-top:15px;
background:#111827;
padding:15px;
border-radius:18px;
}

.signal{
font-size:52px;
text-align:center;
font-weight:bold;
}

.buy{color:#00ff9d}
.sell{color:#ff3b5c}
.wait{color:#facc15}

.timer{
text-align:center;
margin-top:6px;
color:#00ff9d;
font-weight:bold;
}

.price{text-align:center;margin-top:6px;color:#ccc}

/* EXP BAR */
.expBar{
height:6px;
background:#1a2440;
border-radius:20px;
margin-top:10px;
overflow:hidden;
}

.expFill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:width 1s linear;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:10px;
}

.card{
background:#141f3a;
padding:10px;
border-radius:12px;
text-align:center;
}

.cardTitle{font-size:11px;color:#aaa}
.cardValue{font-size:16px;font-weight:bold}

/* CHART */
canvas{
margin-top:12px;
background:#0b1020;
border-radius:15px;
width:100%;
height:120px;
}

/* LIQUIDITY ZONES */
.zone{
position:absolute;
height:2px;
background:#ff3b5c;
width:100%;
opacity:0.4;
}

.footer{
text-align:center;
margin-top:10px;
font-size:11px;
color:#5e6781;
}

</style>
</head>

<body>

<div class="app">

<div class="top">
<div class="live">🟢 LIVE INSTITUTIONAL</div>
<div class="clock" id="clock"></div>
</div>

<h2>SNIPER AI PRO V4</h2>

<select id="market">
<option>EURUSD</option>
<option>GBPUSD</option>
<option>BTCUSD</option>
<option>XAUUSD</option>
</select>

<select id="tf">
<option>1min</option>
<option>5min</option>
<option>15min</option>
</select>

<button onclick="analyze()">ANALYZE</button>
<button class="auto" onclick="toggleAuto()">AUTO ANALYZE</button>

<div class="signalBox">

<div class="signal wait" id="signal">WAIT</div>

<div class="timer" id="timer"></div>

<div class="price" id="price">PRICE: --</div>

<div class="expBar"><div class="expFill" id="expFill"></div></div>

<canvas id="chart"></canvas>

<div class="grid">

<div class="card">
<div class="cardTitle">CONFIDENCE</div>
<div class="cardValue" id="conf">0%</div>
</div>

<div class="card">
<div class="cardTitle">SMC SCORE</div>
<div class="cardValue" id="smc">0</div>
</div>

<div class="card">
<div class="cardTitle">RSI</div>
<div class="cardValue" id="rsi">50</div>
</div>

<div class="card">
<div class="cardTitle">TREND</div>
<div class="cardValue" id="trend">NEUTRAL</div>
</div>

</div>

</div>

<div class="footer">INSTITUTIONAL SMART MONEY ENGINE</div>

</div>

<script>

/* CLOCK */
setInterval(()=>clock.innerText=new Date().toLocaleTimeString(),1000);

/* AUTO */
let auto=false, loop;

/* CANVAS CHART */
const ctx=document.getElementById("chart").getContext("2d");

function drawChart(){

ctx.clearRect(0,0,400,120);

let w=0;

for(let i=0;i<20;i++){

let h=Math.random()*100;

ctx.fillStyle="#00ff9d";

ctx.fillRect(w,120-h,10,h);

w+=18;

}

}

/* SMART MONEY ENGINE V4 */
function smcV4(d){

let score=50;

/* liquidity sweep */
if(d.rsi>70||d.rsi<30) score+=20;

/* BOS */
if(d.macd) score+=15;

/* fake breakout filter */
if(d.volatility<40) score-=10;

/* institutional trend bias */
if(d.trend==="UP"||d.trend==="DOWN") score+=10;

/* clamp */
return Math.max(0,Math.min(100,score));
}

/* TIMER */
let t;

function startTimer(){

clearInterval(t);
let time=60;

expFill.style.width="100%";

t=setInterval(()=>{

time--;

timer.innerText="⏳ EXP "+time+"s";
expFill.style.width=(time/60*100)+"%";

if(time<=0){
clearInterval(t);
timer.innerText="EXPIRED";
}

},1000);
}

/* AUTO */
function toggleAuto(){
auto=!auto;
if(auto) loop=setInterval(analyze,1500);
else clearInterval(loop);
}

/* ANALYZE */
async function analyze(){

const res=await fetch(`/signal?symbol=${market.value}&tf=${tf.value}`);
const d=await res.json();

let smc=smcV4(d);

signal.innerText=d.signal;
signal.className=
d.signal==="BUY"?"signal buy":
d.signal==="SELL"?"signal sell":"signal wait";

price.innerText="PRICE: "+d.price;

conf.innerText=smc+"%";
smc.innerText=smc;
rsi.innerText=d.rsi;
trend.innerText=d.trend||"NEUTRAL";

drawChart();

if(d.signal!=="WAIT") startTimer();

}

</script>

</body>
</html>
