<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>D-FLAM SIGNAL BOT</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:10px;
}

/* APP */
.app{
width:100%;
max-width:420px;
background:#0c1224;
border-radius:25px;
padding:16px;
border:1px solid #1f2b4d;
box-shadow:0 0 30px #00ff9d22;
}

/* HEADER */
.top{
display:flex;
justify-content:space-between;
}

.live{color:#00ff9d;font-weight:bold}
.clock{color:#ccc}

/* TITLE */
h2{
text-align:center;
color:#00ff9d;
margin:10px 0;
font-size:22px;
text-shadow:0 0 15px #00ff9d55;
animation: glow 2s infinite alternate;
}

@keyframes glow{
from{opacity:0.6}
to{opacity:1}
}

/* SELECT */
select{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
font-weight:bold;
background:#121d38;
color:white;
}

/* BUTTONS */
button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

/* ANALYZE */
button.analyze{
background:#00ff9d;
color:black;
animation:pulseGreen 1.5s infinite;
}

/* AUTO */
button.auto{
background:#1d2d52;
color:white;
animation:pulseBlue 2s infinite;
}

@keyframes pulseGreen{
0%{box-shadow:0 0 0 0 #00ff9d55}
70%{box-shadow:0 0 0 10px transparent}
100%{box-shadow:0 0 0 0 transparent}
}

@keyframes pulseBlue{
0%{box-shadow:0 0 0 0 #4aa3ff55}
70%{box-shadow:0 0 0 10px transparent}
100%{box-shadow:0 0 0 0 transparent}
}

/* SIGNAL */
.signalBox{
margin-top:15px;
background:#111827;
padding:18px;
border-radius:18px;
text-align:center;
}

.signal{
font-size:52px;
font-weight:bold;
transition:0.3s;
}

/* BUY ANIMATION */
.buy{
color:#00ff9d;
text-shadow:0 0 20px #00ff9d;
animation:pulseBuy 1s infinite;
}

/* SELL ANIMATION */
.sell{
color:#ff3b5c;
text-shadow:0 0 20px #ff3b5c;
animation:pulseSell 1s infinite;
}

@keyframes pulseBuy{
0%{transform:scale(1)}
50%{transform:scale(1.1)}
100%{transform:scale(1)}
}

@keyframes pulseSell{
0%{transform:scale(1)}
50%{transform:scale(1.1)}
100%{transform:scale(1)}
}

/* WAIT */
.wait{
color:#facc15;
}

/* INFO */
.timer{
margin-top:8px;
color:#00ff9d;
font-weight:bold;
}

.price{
margin-top:6px;
color:#ccc;
font-size:14px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:10px;
}

.card{
background:#141f3a;
padding:10px;
border-radius:12px;
text-align:center;
}

.cardTitle{font-size:11px;color:#aaa}
.cardValue{font-size:16px;font-weight:bold}

/* FOOTER */
.footer{
text-align:center;
margin-top:10px;
font-size:11px;
color:#5e6781;
}

</style>
</head>

<body>

<div class="app">

<div class="top">
<div class="live">🟢 LIVE</div>
<div class="clock" id="clock"></div>
</div>

<h2>D-FLAM SIGNAL BOT</h2>

<select id="market">
<option>EURUSD</option>
<option>GBPUSD</option>
<option>BTCUSD</option>
<option>XAUUSD</option>
<option>EUR/JPY</option>
<option>GBP/JPY</option>
<option>AUD/USD</option>
<option>USD/JPY</option>
<option>USD/CAD</option>
<option>USD/CHF</option>
<option>EUR/GBP</option>
</select>

<select id="tf">
<option>1min</option>
<option>5min</option>
<option>15min</option>
</select>

<button class="analyze" onclick="analyze()">ANALYZE</button>
<button class="auto" onclick="toggleAuto()">AUTO ANALYZE</button>

<div class="signalBox">

<div class="signal wait" id="signal">WAIT</div>

<div class="timer" id="timer"></div>

<div class="price" id="price">PRICE: --</div>

<div class="grid">

<div class="card">
<div class="cardTitle">CONFIDENCE</div>
<div class="cardValue" id="smc">0%</div>
</div>

<div class="card">
<div class="cardTitle">RSI</div>
<div class="cardValue" id="rsi">50</div>
</div>

<div class="card">
<div class="cardTitle">STRUCTURE</div>
<div class="cardValue" id="macd">NEUTRAL</div>
</div>

<div class="card">
<div class="cardTitle">QUALITY</div>
<div class="cardValue" id="quality">LOW</div>
</div>

</div>

</div>

<div class="footer">SMART MONEY ENGINE</div>

</div>

<script>

/* CLOCK */
setInterval(()=>{
document.getElementById("clock").innerText =
new Date().toLocaleTimeString();
},1000);

/* AUTO */
let auto=false;
let loop;

/* TIMER */
let t;

function startTimer(){

clearInterval(t);

let time=60;
expFill && (expFill.style.width="100%");

t=setInterval(()=>{

time--;
timer.innerText="⏳ EXP "+time+"s";

if(time<=0){
clearInterval(t);
timer.innerText="EXPIRED";
}

},1000);

}

/* TOGGLE AUTO */
function toggleAuto(){

auto=!auto;

if(auto){
loop=setInterval(analyze,1500);
}else{
clearInterval(loop);
}

}

/* ANALYZE */
async function analyze(){

const res = await fetch(`/signal?symbol=${market.value}&tf=${tf.value}`);
const data = await res.json();

/* SIGNAL */
signal.innerText = data.signal || "WAIT";
signal.className =
data.signal==="BUY"?"signal buy":
data.signal==="SELL"?"signal sell":"signal wait";

/* PRICE */
price.innerText = "PRICE: " + (data.price ?? "--");

/* RSI */
rsi.innerText = data.rsi ?? "50";

/* STRUCTURE */
macd.innerText = data.structure ?? "NEUTRAL";

/* CONF */
smc.innerText = (data.confidence ?? 0) + "%";

/* QUALITY */
quality.innerText = data.quality ?? "LOW";

}

</script>

</body>
</html>
