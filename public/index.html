<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>D-FLAM BOT TRADING</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#050816;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:90px 10px 30px;
overflow-x:hidden;
color:white;
}

/* BACKGROUND */
body::before{
content:"";
position:fixed;
width:500px;
height:500px;
background:#00ff9d15;
filter:blur(120px);
top:-150px;
right:-100px;
z-index:-1;
}

/* BRAND */
.brand{
position:absolute;
top:20px;
width:100%;
text-align:center;
font-size:30px;
font-weight:bold;
color:#00ff9d;
text-shadow:0 0 15px #00ff9d;
letter-spacing:2px;
}

/* APP */
.app{
width:100%;
max-width:420px;
background:#0c1224;
border-radius:25px;
padding:20px;
border:1px solid #1f2b4d;
box-shadow:
0 0 25px #00ff9d22,
0 0 60px #000 inset;
}

/* TITLE */
h2{
text-align:center;
color:#00ff9d;
font-size:34px;
margin-bottom:18px;
}

/* SELECT */
select{
width:100%;
padding:16px;
margin-top:12px;
border:none;
outline:none;
border-radius:16px;
background:#121d38;
color:white;
font-size:18px;
font-weight:bold;
border:2px solid transparent;
}

select:focus{
border:2px solid #facc15;
}

/* BUTTON */
button{
width:100%;
padding:16px;
margin-top:14px;
border:none;
border-radius:16px;
background:#00ff9d;
color:black;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
box-shadow:0 0 18px #00ff9d55;
}

button:active{
transform:scale(0.97);
}

/* ICON */
.icon{
font-size:90px;
text-align:center;
margin-top:25px;
}

/* SPIN */
.spin{
animation:spin 1s linear infinite;
}

@keyframes spin{
from{
transform:rotate(0deg);
}
to{
transform:rotate(360deg);
}
}

/* SIGNAL */
.signal{
font-size:75px;
font-weight:bold;
text-align:center;
margin-top:8px;
}

.buy{
color:#00ff9d;
text-shadow:0 0 20px #00ff9d;
}

.sell{
color:#ff3b5c;
text-shadow:0 0 20px #ff3b5c;
}

.wait{
color:#facc15;
text-shadow:0 0 20px #facc15;
}

/* INFO */
.info{
text-align:center;
margin-top:10px;
font-size:24px;
color:#d0d0d0;
}

/* BAR */
.bar{
width:100%;
height:16px;
background:#1d2746;
border-radius:20px;
overflow:hidden;
margin-top:20px;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:width 1s linear;
}

/* TIMER */
.timer{
text-align:center;
margin-top:10px;
font-size:18px;
color:#aaa;
}

/* FOOTER */
.footer{
margin-top:18px;
text-align:center;
font-size:14px;
color:#666;
}

/* TELEGRAM */
.telegram{
position:fixed;
right:20px;
bottom:20px;
width:65px;
height:65px;
background:#0088cc;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
text-decoration:none;
box-shadow:0 0 25px #0088cc;
animation:pulse 1.5s infinite;
z-index:999;
}

@keyframes pulse{
0%{
transform:scale(1);
}
50%{
transform:scale(1.1);
}
100%{
transform:scale(1);
}
}

</style>
</head>

<body>

<!-- BRAND -->
<div class="brand">
🔥 D-FLAM BOT TRADING
</div>

<!-- APP -->
<div class="app">

<h2>📊 SNIPER AI PRO</h2>

<!-- MARKET -->
<select id="market">

<option value="AUDNZD">AUD/NZD</option>
<option value="AUDUSD">AUD/USD</option>
<option value="EURCHF">EUR/CHF</option>
<option value="EURJPY">EUR/JPY</option>
<option value="GBPAUD">GBP/AUD</option>
<option value="EURGBP">EUR/GBP</option>
<option value="USDCAD">USD/CAD</option>
<option value="CADJPY">CAD/JPY</option>
<option value="EURUSD">EUR/USD</option>
<option value="AUDCAD">AUD/CAD</option>
<option value="CHFJPY">CHF/JPY</option>
<option value="USDSGD">USD/SGD</option>
<option value="NZDJPY">NZD/JPY</option>
<option value="NZDUSD">NZD/USD</option>
<option value="USDCHF">USD/CHF</option>
<option value="GBPJPY">GBP/JPY</option>
<option value="GBPUSD">GBP/USD</option>
<option value="AUDJPY">AUD/JPY</option>
<option value="GBPCHF">GBP/CHF</option>
<option value="EURAUD">EUR/AUD</option>
<option value="EURCAD">EUR/CAD</option>
<option value="USDJPY">USD/JPY</option>
<option value="AUDCHF">AUD/CHF</option>

</select>

<!-- TIME -->
<select id="time">

<option value="60">1 MIN</option>
<option value="300">5 MIN</option>
<option value="900" selected>15 MIN</option>

</select>

<!-- BUTTON -->
<button onclick="analyze()">
🔄 ANALYZE SIGNAL
</button>

<button onclick="autoMode()">
🤖 AUTO MODE
</button>

<!-- ICON -->
<div id="signalIcon" class="icon">
🟡
</div>

<!-- SIGNAL -->
<div id="signal" class="signal wait">
WAIT
</div>

<!-- INFO -->
<div class="info" id="score">
SCORE: 0
</div>

<div class="info" id="prob">
PROB: 0%
</div>

<!-- BAR -->
<div class="bar">
<div class="fill" id="fill"></div>
</div>

<!-- TIMER -->
<div class="timer" id="timer">
READY
</div>

<div class="footer">
POWERED BY D-FLAM AI ENGINE
</div>

</div>

<!-- TELEGRAM -->
<a href="https://t.me/Mr_dflam"
class="telegram"
target="_blank">
📩
</a>

<script>

let signalLocked = false;
let autoInterval = null;
let candleTimer = null;
let remaining = 0;

/* ANALYZE */
async function analyze(){

if(signalLocked){
return;
}

signalLocked = true;

const market =
document.getElementById("market").value;

const tf =
parseInt(document.getElementById("time").value);

const signal =
document.getElementById("signal");

const icon =
document.getElementById("signalIcon");

/* ANALYZING */
icon.innerText = "🌀";
icon.classList.add("spin");

signal.innerText = "ANALYZING...";
signal.className = "signal wait";

/* FETCH */
const res =
await fetch(`/api/analyze/${market}/${tf}`);

const data =
await res.json();

/* DELAY */
setTimeout(()=>{

icon.classList.remove("spin");

/* BUY */
if(data.signal === "BUY"){

icon.innerText = "🟢";

signal.innerText = "BUY";

signal.className = "signal buy";

playSound();

}

/* SELL */
else if(data.signal === "SELL"){

icon.innerText = "🔴";

signal.innerText = "SELL";

signal.className = "signal sell";

playSound();

}

/* WAIT */
else{

icon.innerText = "🟡";

signal.innerText = "WAIT";

signal.className = "signal wait";

}

/* DATA */
document.getElementById("score").innerText =
"SCORE: " + data.score;

document.getElementById("prob").innerText =
"PROB: " + data.probability + "%";

/* START TIMER */
startCandle(tf);

},2000);

}

/* TIMER */
function startCandle(seconds){

clearInterval(candleTimer);

remaining = seconds;

const fill =
document.getElementById("fill");

fill.style.width = "100%";

candleTimer = setInterval(()=>{

remaining--;

const percent =
(remaining / seconds) * 100;

fill.style.width =
percent + "%";

document.getElementById("timer").innerText =
remaining + " SEC";

if(remaining <= 0){

clearInterval(candleTimer);

signalLocked = false;

document.getElementById("timer").innerText =
"READY";

}

},1000);

}

/* AUTO MODE */
function autoMode(){

if(autoInterval){

clearInterval(autoInterval);

autoInterval = null;

alert("AUTO MODE STOPPED");

return;

}

alert("AUTO MODE STARTED");

autoInterval = setInterval(()=>{

if(!signalLocked){

analyze();

vibrate();

}

},3000);

}

/* SOUND */
function playSound(){

let audio =
new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

audio.play();

}

/* VIBRATE */
function vibrate(){

if(navigator.vibrate){

navigator.vibrate(200);

}

}

</script>

</body>
</html>
