<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI PRO V5</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* APP */
.app{
width:95%;
max-width:420px;
background:#0c1224;
border-radius:20px;
padding:15px;
}

/* TOP */
.top{
display:flex;
gap:8px;
margin-bottom:10px;
}

select{
flex:1;
padding:10px;
border-radius:10px;
background:#111a33;
color:white;
border:none;
}

/* TITLE */
h2{
text-align:center;
color:#00ff9d;
}

/* BUTTON ANIMATED */
button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#00ff9d;
color:black;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:active{
transform:scale(0.95);
}

.scan{
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{box-shadow:0 0 0px #00ff9d;}
50%{box-shadow:0 0 20px #00ff9d;}
100%{box-shadow:0 0 0px #00ff9d;}
}

/* SIGNAL */
.signal{
font-size:60px;
text-align:center;
margin:15px 0;
font-weight:bold;
transition:0.5s;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

/* INFO */
.info{
text-align:center;
color:#aaa;
margin:5px 0;
}

/* TIMER BAR */
.bar{
width:100%;
height:6px;
background:#1a1f35;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:1s linear;
}

</style>

</head>

<body>

<div class="app">

<h2>📊 SNIPER AI PRO V5</h2>

<div class="top">

<select id="market">
<option value="BTCUSD">BTCUSD</option>
<option value="ETHUSD">ETHUSD</option>
<option value="EURUSD">EURUSD</option>
<option value="XAUUSD">GOLD</option>
</select>

<select id="time">
<option value="60">1 MIN</option>
<option value="300">5 MIN</option>
<option value="900">15 MIN</option>
</select>

</div>

<button id="btn" onclick="analyze()">🔄 ANALYZE MARKET</button>

<div id="signal" class="signal wait">WAIT</div>

<div class="info" id="score">SCORE: 0</div>
<div class="info" id="prob">PROB: 0%</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="info" id="timer">READY</div>

</div>

<script>

let market="BTCUSD";
let tf=60;
let interval;

/* OPTIONS */
document.getElementById("market").onchange=(e)=>{
market=e.target.value;
}

document.getElementById("time").onchange=(e)=>{
tf=parseInt(e.target.value);
}

/* TIMER SYSTEM */
function startTimer(){

let time=tf;

clearInterval(interval);

interval=setInterval(()=>{

time--;

document.getElementById("timer").innerText =
"EXPIRY: "+time+"s";

document.getElementById("fill").style.width =
(time/tf)*100+"%";

if(time<=0){
clearInterval(interval);
document.getElementById("timer").innerText="EXPIRED";
}

},1000);

}

/* ANALYZE */
async function analyze(){

let btn=document.getElementById("btn");
btn.classList.add("scan");
btn.innerText="SCANNING...";

startTimer();

const res = await fetch(`/api/analyze/${market}/1m`);
const data = await res.json();

/* SIGNAL */
const signal=document.getElementById("signal");
const score=document.getElementById("score");
const prob=document.getElementById("prob");

if(data.signal==="BUY"){
signal.innerText="🟢 BUY";
signal.className="signal buy";
}

else if(data.signal==="SELL"){
signal.innerText="🔴 SELL";
signal.className="signal sell";
}

else{
signal.innerText="🟡 WAIT";
signal.className="signal wait";
}

/* DATA */
score.innerText="SCORE: "+data.score;
prob.innerText="PROB: "+data.probability+"%";

/* RESET BUTTON */
setTimeout(()=>{
btn.classList.remove("scan");
btn.innerText="🔄 ANALYZE MARKET";
},1500);

}

</script>

</body>
</html>
