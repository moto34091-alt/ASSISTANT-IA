<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>D-FLAM BOT TRADING</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:15px;
}

.app{
width:100%;
max-width:420px;
background:#0c1224;
padding:15px;
border-radius:15px;
}

h2{text-align:center;color:#00ff9d;}

select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:none;
font-weight:bold;
}

button{background:#00ff9d;color:black;}

.icon{
text-align:center;
font-size:60px;
margin-top:15px;
}

.signal{
text-align:center;
font-size:40px;
font-weight:bold;
margin-top:5px;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

.info{
text-align:center;
margin-top:8px;
}

.bar{
height:10px;
background:#1d2746;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
}

.timer{
text-align:center;
margin-top:8px;
font-size:14px;
display:none;
}

.price{
text-align:center;
margin-top:6px;
font-size:16px;
color:#aaa;
}

.entry{
text-align:center;
margin-top:6px;
font-size:16px;
color:#00ff9d;
font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

<h2>SNIPER AI PRO SMC</h2>

<select id="market">
<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>EUR/JPY</option>
<option>USD/CHF</option>
<option>AUD/USD</option>
<option>USD/CAD</option>
<option>EUR/GBP</option>
<option>GBP/JPY</option>
<option>EUR/AUD</option>
<option>EUR/CAD</option>
<option>GBP/CHF</option>
<option>CHF/JPY</option>
<option>AUD/JPY</option>
<option>NZD/USD</option>
<option>BTC/USD</option>
<option>ETH/USD</option>
<option>US30</option>
<option>NAS100</option>
<option>XAU/USD</option>
</select>

<select id="time">
<option value="60">1 MIN</option>
<option value="300">5 MIN</option>
<option value="900">15 MIN</option>
</select>

<button onclick="analyze()">ANALYZE</button>
<button onclick="autoMode()">AUTO MODE</button>

<div id="icon" class="icon">🟡</div>
<div id="signal" class="signal wait">WAIT</div>

<div class="entry" id="entry">ENTRY POINT: -</div>
<div class="price" id="price">PRICE: --</div>

<div class="info" id="prob">PROB: 0%</div>
<div class="info" id="winrate">WINRATE: 0%</div>

<div class="bar"><div id="fill" class="fill"></div></div>

<div class="timer" id="timer">READY</div>

</div>

<script>

let interval=null;
let timer=null;
let lastSignalCache={};

/* =========================
   PRICE SIM
========================= */
function getPrice(m){
let base=1+Math.random()*100;
if(m.includes("JPY")) base=100+Math.random()*50;
if(m.includes("BTC")) base=60000+Math.random()*2000;
if(m.includes("XAU")) base=2300+Math.random()*50;
return base.toFixed(2);
}

/* =========================
   CANDLE
========================= */
function candle(){
let open=Math.random()*100;
let close=Math.random()*100;
let high=Math.max(open,close)+Math.random()*10;
let low=Math.min(open,close)-Math.random()*10;
return {open,close,high,low};
}

/* =========================
   SMC AI ENGINE
========================= */
function ai(){

let c1=candle();
let c2=candle();
let c3=candle();

/* STRUCTURE */
let HH = c3.high > c2.high && c2.high > c1.high ? 1 : 0;
let HL = c3.low > c2.low ? 1 : 0;

let LH = c3.high < c2.high ? 1 : 0;
let LL = c3.low < c2.low && c2.low < c1.low ? 1 : 0;

/* LIQUIDITY */
let upperWick = c3.high - Math.max(c3.open,c3.close);
let lowerWick = Math.min(c3.open,c3.close) - c3.low;

let buyLiquidity = lowerWick > upperWick*2 ? 1 : 0;
let sellLiquidity = upperWick > lowerWick*2 ? 1 : 0;

/* ORDER BLOCK */
let bullishOB = c2.close < c2.open && c3.close > c3.high ? 1 : 0;
let bearishOB = c2.close > c2.open && c3.close < c3.low ? 1 : 0;

/* SCORE */
let buyScore = HH+HL+buyLiquidity+bullishOB;
let sellScore = LH+LL+sellLiquidity+bearishOB;

/* SIGNAL */
let signal="WAIT";

if(buyScore>=3 && buyScore>sellScore) signal="BUY";
else if(sellScore>=3 && sellScore>buyScore) signal="SELL";

/* PROB */
let prob = 50 + Math.max(buyScore,sellScore)*10;
if(prob>95) prob=95;

/* WINRATE */
let winrate = 50 + Math.max(buyScore,sellScore)*8;
if(winrate>90) winrate=90;

/* ENTRY */
let entry =
signal=="BUY" ? "LIQUIDITY BUY ZONE 🔼" :
signal=="SELL" ? "LIQUIDITY SELL ZONE 🔽" : "-";

return {signal,prob,winrate,entry};
}

/* =========================
   ANALYZE (STABLE SIGNAL)
========================= */
function analyze(){

let m=document.getElementById("market").value;
let key=m;

if(lastSignalCache[key]){
apply(lastSignalCache[key],m);
return;
}

document.getElementById("icon").innerText="🧠";
document.getElementById("signal").innerText="ANALYZING...";
document.getElementById("signal").className="signal wait";

setTimeout(()=>{

let d=ai();
lastSignalCache[key]=d;

apply(d,m);
startTimer(d.signal);

},700);
}

/* =========================
   APPLY
========================= */
function apply(d,m){

let icon=document.getElementById("icon");
let s=document.getElementById("signal");

if(d.signal=="BUY"){
icon.innerText="🟢";
s.innerText="BUY";
s.className="signal buy";
}
else if(d.signal=="SELL"){
icon.innerText="🔴";
s.innerText="SELL";
s.className="signal sell";
}
else{
icon.innerText="🟡";
s.innerText="WAIT";
s.className="signal wait";
}

document.getElementById("entry").innerText="ENTRY POINT: "+d.entry;
document.getElementById("price").innerText="PRICE: "+getPrice(m);
document.getElementById("prob").innerText="PROB: "+d.prob+"%";
document.getElementById("winrate").innerText="WINRATE: "+d.winrate.toFixed(1)+"%";

/* hide timer if WAIT */
if(d.signal=="WAIT"){
document.getElementById("timer").style.display="none";
}
}

/* =========================
   TIMER
========================= */
function startTimer(signal){

clearInterval(timer);
if(signal=="WAIT") return;

document.getElementById("timer").style.display="block";

let r=60;

timer=setInterval(()=>{

r--;
document.getElementById("fill").style.width=(r/60*100)+"%";
document.getElementById("timer").innerText=r+" SEC";

if(r<=0){
clearInterval(timer);
document.getElementById("timer").style.display="none";
}

},1000);
}

/* =========================
   AUTO MODE
========================= */
function autoMode(){

if(interval){
clearInterval(interval);
interval=null;
return;
}

interval=setInterval(()=>analyze(),3000);
}

</script>

</body>
</html>
