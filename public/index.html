<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI PRO</title>

<style>

body{
margin:0;
background:#050816;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.app{
width:100%;
max-width:420px;
background:#0c1224;
padding:15px;
border-radius:18px;
box-shadow:0 0 20px #000;
}

.header{
text-align:center;
font-size:22px;
color:#00ff9d;
font-weight:bold;
}

select,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
font-weight:bold;
}

select{background:#141d38;color:white;}
button{background:#00ff9d;color:black;cursor:pointer;}

.signal{
text-align:center;
font-size:42px;
margin-top:10px;
font-weight:bold;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

.info{
text-align:center;
margin-top:6px;
color:#ccc;
}

/* TIMER */
.timerBox{
display:none;
margin-top:15px;
}

.bar{
height:10px;
background:#182341;
border-radius:20px;
overflow:hidden;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:width 1s linear;
}

.timerText{
text-align:center;
margin-top:5px;
color:#aaa;
}

/* AUTO BUTTON */
.autoOn{
background:#ff3b5c !important;
color:white !important;
}

</style>
</head>

<body>

<div class="app">

<div class="header">🔥 SNIPER AI PRO</div>

<select id="market">
<option>EURUSD</option>
<option>GBPUSD</option>
<option>USDJPY</option>
<option>BTCUSD</option>
<option>ETHUSD</option>
<option>XAUUSD</option>
</select>

<select id="tf">
<option value="1min">1 MIN</option>
<option value="5min">5 MIN</option>
<option value="15min">15 MIN</option>
</select>

<button onclick="analyze()">📡 ANALYZE</button>

<button id="autoBtn" onclick="toggleAuto()">🤖 AUTO MODE</button>

<div id="signal" class="signal wait">WAIT</div>

<div class="info" id="price">PRICE: --</div>
<div class="info" id="rsi">RSI: --</div>
<div class="info" id="conf">CONF: 0%</div>

<!-- TIMER -->
<div class="timerBox" id="timerBox">

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="timerText" id="timerText">60 SEC EXPIRATION</div>

</div>

</div>

<script>

let timer = null;
let auto = null;

/* ANALYZE */
async function analyze(){

const symbol = document.getElementById("market").value;
const tf = document.getElementById("tf").value;

try{

const res = await fetch(`/signal?symbol=${symbol}&tf=${tf}`);
const data = await res.json();

/* UPDATE UI */
const signal = document.getElementById("signal");
signal.innerText = data.signal;
signal.className = "signal " + (data.signal.toLowerCase());

document.getElementById("price").innerText = "PRICE: " + data.price;
document.getElementById("rsi").innerText = "RSI: " + data.rsi;
document.getElementById("conf").innerText = "CONF: " + data.confidence + "%";

/* TIMER START */
startTimer();

}catch(err){
console.log("UI ERROR:", err);
}

}

/* TIMER 60 SEC */
function startTimer(){

clearInterval(timer);

let t = 60;

document.getElementById("timerBox").style.display = "block";

timer = setInterval(()=>{

t--;

document.getElementById("fill").style.width = (t/60*100)+"%";
document.getElementById("timerText").innerText = t + " SEC EXPIRATION";

if(t <= 0){
clearInterval(timer);
document.getElementById("timerBox").style.display = "none";
}

},1000);

}

/* AUTO MODE */
function toggleAuto(){

const btn = document.getElementById("autoBtn");

if(auto){
clearInterval(auto);
auto = null;
btn.classList.remove("autoOn");
return;
}

btn.classList.add("autoOn");

auto = setInterval(()=>{
analyze();
},4000);

}

</script>

</body>
</html>
