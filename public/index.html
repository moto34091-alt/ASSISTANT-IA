<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SNIPER AI PRO V3</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:10px;
}

.app{
width:100%;
max-width:420px;
background:#0c1224;
border-radius:25px;
padding:16px;
border:1px solid #1f2b4d;
}

.top{display:flex;justify-content:space-between}
.live{color:#00ff9d;font-weight:bold}
.clock{color:#ccc}

h2{text-align:center;color:#00ff9d;margin:10px 0}

select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:12px;
border:none;
font-weight:bold;
}

button{
background:#00ff9d;
color:black;
cursor:pointer;
}

.signalBox{
margin-top:15px;
background:#111827;
padding:18px;
border-radius:20px;
}

.signal{
font-size:50px;
text-align:center;
font-weight:bold;
}

.buy{color:#00ff9d}
.sell{color:#ff3b5c}
.wait{color:#facc15}

.timer{
text-align:center;
margin-top:8px;
color:#00ff9d;
font-weight:bold;
}

/* EXP BAR */
.expBar{
height:6px;
background:#1a2440;
border-radius:20px;
margin-top:10px;
overflow:hidden;
}

.expFill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:width 1s linear;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:12px;
}

.card{
background:#141f3a;
padding:10px;
border-radius:12px;
text-align:center;
}

.cardTitle{font-size:11px;color:#aaa}
.cardValue{font-size:16px;font-weight:bold}

.footer{
text-align:center;
margin-top:12px;
font-size:11px;
color:#5e6781;
}

</style>
</head>

<body>

<div class="app">

<div class="top">
<div class="live">🟢 LIVE</div>
<div class="clock" id="clock"></div>
</div>

<h2>SNIPER AI PRO V3</h2>

<select id="market">
<option>EURUSD</option>
<option>GBPUSD</option>
<option>BTCUSD</option>
<option>XAUUSD</option>
</select>

<select id="tf">
<option>1min</option>
<option>5min</option>
<option>15min</option>
</select>

<button onclick="analyze()">ANALYZE</button>

<div class="signalBox">

<div class="signal wait" id="signal">WAIT</div>

<div class="timer" id="timer"></div>

<div class="expBar">
<div class="expFill" id="expFill"></div>
</div>

<div class="grid">

<div class="card">
<div class="cardTitle">CONFIDENCE</div>
<div class="cardValue" id="conf">0%</div>
</div>

<div class="card">
<div class="cardTitle">RSI</div>
<div class="cardValue" id="rsi">50</div>
</div>

<div class="card">
<div class="cardTitle">MACD</div>
<div class="cardValue" id="macd">--</div>
</div>

<div class="card">
<div class="cardTitle">SMC SCORE</div>
<div class="cardValue" id="smc">0</div>
</div>

</div>

</div>

<div class="footer">SMART MONEY CONCEPT ENGINE V3</div>

</div>

<script>

/* CLOCK */
setInterval(()=>{
clock.innerText=new Date().toLocaleTimeString();
},1000);

/* SMART MONEY ENGINE */
function smcEngine(data){

let score = 50;

/* LIQUIDITY SWEEP */
if(data.rsi > 70 || data.rsi < 30){
score += 20;
}

/* BOS (trend confirmation) */
if(data.macd === true){
score += 15;
}

/* FAKE BREAKOUT FILTER */
if(data.volatility < 40){
score -= 10;
}

/* KILLZONE BONUS */
let h = new Date().getHours();
if((h>=8 && h<=11) || (h>=14 && h<=17)){
score += 10;
}

/* clamp */
return Math.max(0,Math.min(100,score));
}

/* TIMER */
let t;
function startTimer(){
clearInterval(t);
let time=60;

expFill.style.width="100%";

t=setInterval(()=>{
time--;
timer.innerText="⏳ EXPIRATION "+time+"s";
expFill.style.width=(time/60*100)+"%";
if(time<=0){
clearInterval(t);
timer.innerText="⚠️ EXPIRED";
}
},1000);
}

/* ANALYZE */
async function analyze(){

const res=await fetch(`/signal?symbol=${market.value}&tf=${tf.value}`);
const d=await res.json();

let smc = smcEngine(d);

/* SIGNAL */
signal.innerText=d.signal;
signal.className=
d.signal==="BUY"?"signal buy":
d.signal==="SELL"?"signal sell":"signal wait";

/* DATA */
conf.innerText=smc+"%";
rsi.innerText=d.rsi;
macd.innerText=d.macd?"BULLISH":"BEARISH";
smc.innerText=smc;

/* TIMER */
if(d.signal!=="WAIT"){
startTimer();
}

}

</script>

</body>
</html>
