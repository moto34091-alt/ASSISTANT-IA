<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SNIPER AI PRO V12</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.app{
width:95%;
max-width:420px;
background:#0c1224;
border-radius:25px;
padding:18px;
box-shadow:0 0 30px #00ff9d22;
}

/* TITLE */

h2{
text-align:center;
color:#00ff9d;
}

/* SELECT */

select{
width:100%;
padding:14px;
margin-top:10px;
border-radius:12px;
border:none;
background:#111a33;
color:white;
font-weight:bold;
}

/* BUTTON */

button{
width:100%;
padding:15px;
margin-top:12px;
border:none;
border-radius:14px;
font-weight:bold;
background:#00ff9d;
cursor:pointer;
}

button:active{
transform:scale(0.97);
}

/* SIGNAL */

.signal{
text-align:center;
font-size:70px;
margin-top:20px;
font-weight:bold;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

/* INFO */

.info{
text-align:center;
margin-top:10px;
font-size:18px;
color:#aaa;
}

/* BAR */

.bar{
height:22px;
background:#1a1f35;
border-radius:20px;
margin-top:20px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
}

/* EXPIRY */

.expiry{
text-align:center;
margin-top:12px;
font-weight:bold;
}

.good{color:#00ff9d;}
.mid{color:#facc15;}
.bad{color:#ff3b5c;}

</style>

</head>

<body>

<div class="app">

<h2>📊 SNIPER AI PRO V12</h2>

<select id="market">

<option>EURUSD</option>
<option>GBPUSD</option>
<option>USDJPY</option>
<option>XAUUSD</option>

</select>

<select id="time">
<option value="60">1 MIN</option>
<option value="300">5 MIN</option>
<option value="900">15 MIN</option>
</select>

<button onclick="analyze()">🔄 ANALYZE</button>
<button onclick="autoMode()">🤖 AUTO MODE</button>

<div id="signal" class="signal wait">WAIT</div>

<div class="info" id="score">SCORE: 0</div>
<div class="info" id="prob">PROB: 0%</div>

<div class="bar">
<div id="fill" class="fill"></div>
</div>

<div id="expiry" class="expiry">READY</div>

</div>

<script>

let auto = false;
let interval;

/* 🔥 ANALYZE */

async function analyze(){

const market =
document.getElementById("market").value;

const time =
document.getElementById("time").value;

const res =
await fetch(`/api/${market}/1m`);

const d =
await res.json();

/* SCORE */

document.getElementById("score").innerText =
"SCORE: " + (d.score || 0);

document.getElementById("prob").innerText =
"PROB: " + (d.probability || 0) + "%";

/* FILTER */

if((d.probability || 0) < 60){

setSignal("WAIT","❌ BAD ENTRY","wait");

return;

}

/* SIGNAL */

if(d.signal === "BUY"){

setSignal("BUY","🟢 BUY","buy");

}else if(d.signal === "SELL"){

setSignal("SELL","🔴 SELL","sell");

}

startExpiry(d.probability || 60);

}

/* 🔥 SIGNAL UI */

function setSignal(text,emoji,cls){

const s =
document.getElementById("signal");

s.innerText = emoji;

s.className = "signal " + cls;

notify(emoji);

}

/* 🔥 EXPIRY INTELLIGENT */

function startExpiry(prob){

clearInterval(interval);

let time =
Math.floor(prob * 1.2); // intelligent expiry

let fill =
document.getElementById("fill");

let exp =
document.getElementById("expiry");

interval =
setInterval(()=>{

time--;

let pct =
(time/(prob*1.2))*100;

fill.style.width =
pct + "%";

if(pct > 60){

exp.innerText = "🟢 SAFE ENTRY";
exp.className = "expiry good";

}else if(pct > 30){

exp.innerText = "🟡 RISK ENTRY";
exp.className = "expiry mid";

}else{

exp.innerText = "🔴 LATE ENTRY";
exp.className = "expiry bad";

}

if(time <= 0){

clearInterval(interval);

exp.innerText = "EXPIRED";

}

},1000);

}

/* 🔥 AUTO MODE */

function autoMode(){

auto = !auto;

if(auto){

alert("AUTO MODE ON");

interval = setInterval(analyze,5000);

}else{

alert("AUTO MODE OFF");

clearInterval(interval);

}

}

/* 🔔 NOTIFY */

function notify(msg){

try{

navigator.vibrate([200,100,200]);

let audio =
new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

audio.play();

}catch(e){}

}

</script>

</body>

</html>
