<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI PRO</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
overflow:hidden;
}

/* ================= CARD ================= */
.card{
width:90%;
max-width:380px;
background:#0c1224;
border-radius:25px;
padding:25px;
text-align:center;
border:1px solid #00ff9d22;
box-shadow:0 0 30px #00ff9d22;
}

/* ================= SYMBOL ================= */
.symbol{
font-size:14px;
color:#888;
margin-bottom:10px;
}

/* ================= TIMER BAR ================= */
.timerBar{
width:100%;
height:8px;
background:#1a1f35;
border-radius:20px;
overflow:hidden;
margin-top:20px;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
animation: shrink linear forwards;
}

@keyframes shrink{
from{width:100%;}
to{width:0%;}
}

/* ================= SIGNAL ================= */
.signal{
font-size:55px;
font-weight:bold;
margin:15px 0;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{opacity:1;}
50%{opacity:0.4;}
100%{opacity:1;}
}

/* ================= STATUS ================= */
.status{
font-size:16px;
color:#aaa;
}

/* ================= BUTTON ================= */
button{
width:100%;
margin-top:15px;
padding:14px;
border:none;
border-radius:14px;
background:#00ff9d;
color:black;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

button:active{
transform:scale(0.97);
}

</style>

</head>

<body>

<div class="card">

<div class="symbol" id="symbol">SYMBOL: ---</div>

<div class="status">⌛ ANALYSE EN COURS</div>

<div class="signal" id="signal">WAIT</div>

<div class="status" id="details">RSI / MOMENTUM LOADING...</div>

<div class="timerBar">
<div class="fill" id="bar"></div>
</div>

<button onclick="startAnalysis()">
🚀 START ANALYSIS
</button>

</div>

<script>

let market = "BTCUSD";
let time = "1m";

/* ================= ANALYSE ================= */
async function startAnalysis(){

document.getElementById("bar").style.animation = "none";
void document.getElementById("bar").offsetWidth;

/* restart timer animation */
document.getElementById("bar").style.animation = "shrink 5s linear forwards";

document.getElementById("symbol").innerText =
"SYMBOL: " + market;

/* FETCH DATA */
const res = await fetch(`/api/${market}/${time}`);
const data = await res.json();

/* SIGNAL */
document.getElementById("signal").innerText = data.signal;

/* DETAILS RSI + MOMENTUM */
document.getElementById("details").innerText =
`RSI: ${data.rsi || 0} | SCORE: ${data.score || 0}`;

/* END RESULT AFTER TIMER */
setTimeout(()=>{

if(data.signal === "BUY"){
document.getElementById("signal").innerText = "🟢 BUY";
}

if(data.signal === "SELL"){
document.getElementById("signal").innerText = "🔴 SELL";
}

if(data.signal === "WAIT"){
document.getElementById("signal").innerText = "⌛ WAIT";
}

},5000);

}

</script>

</body>
</html>
