<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI PRO</title>

<style>

/* ===== GLOBAL ===== */
body{
margin:0;
font-family:Arial;
background: radial-gradient(circle at top, #0f1b3d, #050816);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

/* ===== CARD ===== */
.app{
width:100%;
max-width:420px;
background: rgba(12,18,36,0.92);
backdrop-filter: blur(10px);
border-radius:22px;
padding:18px;
box-shadow:0 0 40px rgba(0,255,157,0.08);
border:1px solid rgba(255,255,255,0.05);
}

/* ===== HEADER ===== */
.header{
text-align:center;
font-size:22px;
font-weight:bold;
color:#00ff9d;
letter-spacing:1px;
margin-bottom:12px;
}

/* ===== SELECT ===== */
select,button{
width:100%;
padding:13px;
margin-top:10px;
border:none;
border-radius:12px;
font-weight:bold;
outline:none;
}

select{
background:#141d38;
color:white;
border:1px solid rgba(255,255,255,0.08);
}

button{
background:linear-gradient(90deg,#00ff9d,#00c3ff);
color:#000;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:scale(1.02);
}

/* ===== SIGNAL ===== */
.signalBox{
text-align:center;
margin-top:18px;
padding:10px;
border-radius:15px;
background:rgba(255,255,255,0.03);
}

.signal{
font-size:46px;
font-weight:bold;
letter-spacing:2px;
margin-top:8px;
}

.buy{
color:#00ff9d;
text-shadow:0 0 15px #00ff9d;
}

.sell{
color:#ff3b5c;
text-shadow:0 0 15px #ff3b5c;
}

.wait{
color:#facc15;
}

/* ===== INFO ===== */
.info{
margin-top:6px;
font-size:14px;
color:#c7c7c7;
}

/* ===== TIMER ===== */
.timerBox{
margin-top:15px;
display:none;
}

.bar{
height:10px;
background:#1a2340;
border-radius:20px;
overflow:hidden;
box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:width 1s linear;
}

.timerText{
text-align:center;
margin-top:6px;
font-size:13px;
color:#aaa;
}

/* ===== BADGE ===== */
.badge{
display:inline-block;
padding:4px 10px;
background:rgba(0,255,157,0.1);
border:1px solid rgba(0,255,157,0.3);
border-radius:8px;
font-size:12px;
margin-top:5px;
}

</style>
</head>

<body>

<div class="app">

<div class="header">🔥 SNIPER AI PRO</div>

<div class="badge">LIVE MARKET ENGINE</div>

<select id="market">
<option>EURUSD</option>
<option>GBPUSD</option>
<option>USDJPY</option>
<option>BTCUSD</option>
<option>ETHUSD</option>
<option>XAUUSD</option>
</select>

<select id="tf">
<option value="1min">⚡ 1 MIN</option>
<option value="5min">📊 5 MIN</option>
<option value="15min">📈 15 MIN</option>
</select>

<button onclick="analyze()">📡 ANALYZE</button>

<button id="autoBtn" onclick="toggleAuto()">🤖 AUTO MODE</button>

<div class="signalBox">

<div id="signal" class="signal wait">WAIT</div>

<div class="info" id="price">PRICE: --</div>
<div class="info" id="rsi">RSI: --</div>
<div class="info" id="conf">CONF: 0%</div>

</div>

<!-- TIMER -->
<div class="timerBox" id="timerBox">

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="timerText" id="timerText">60 SEC EXPIRATION</div>

</div>

</div>

<script>

let timer=null;
let auto=null;

/* ANALYZE */
async function analyze(){

const symbol=document.getElementById("market").value;
const tf=document.getElementById("tf").value;

const res=await fetch(`/signal?symbol=${symbol}&tf=${tf}`);
const d=await res.json();

/* UPDATE */
const s=document.getElementById("signal");
s.innerText=d.signal;
s.className="signal "+d.signal.toLowerCase();

document.getElementById("price").innerText="PRICE: "+d.price;
document.getElementById("rsi").innerText="RSI: "+d.rsi;
document.getElementById("conf").innerText="CONF: "+d.confidence+"%";

/* TIMER */
startTimer();

}

/* TIMER 60s */
function startTimer(){

clearInterval(timer);

let t=60;

document.getElementById("timerBox").style.display="block";

timer=setInterval(()=>{

t--;

document.getElementById("fill").style.width=(t/60*100)+"%";
document.getElementById("timerText").innerText=t+" SEC EXPIRATION";

if(t<=0){
clearInterval(timer);
document.getElementById("timerBox").style.display="none";
}

},1000);

}

/* AUTO MODE */
function toggleAuto(){

const btn=document.getElementById("autoBtn");

if(auto){
clearInterval(auto);
auto=null;
btn.style.background="";
btn.innerText="🤖 AUTO MODE";
return;
}

btn.style.background="#ff3b5c";
btn.innerText="AUTO RUNNING";

auto=setInterval(()=>analyze(),4000);

}

</script>

</body>
</html>
