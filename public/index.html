<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI PRO</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#050816,#070b1a);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* PHONE APP CONTAINER */
.app{
width:95%;
max-width:420px;
height:90vh;
background:#0b1022;
border-radius:25px;
overflow:hidden;
box-shadow:0 0 40px #00ff9d22;
position:relative;
}

/* HEADER */
.header{
padding:15px;
text-align:center;
background:#0f1630;
border-bottom:1px solid #1f2a55;
}

.header h2{
margin:0;
color:#00ff9d;
}

.header p{
font-size:12px;
color:#888;
}

/* SCREENS */
.screen{
display:none;
padding:15px;
height:calc(100% - 60px);
overflow:auto;
}

.screen.active{
display:block;
}

/* CARD STYLE */
.card{
background:#121a33;
padding:15px;
border-radius:15px;
margin-bottom:10px;
border:1px solid #1f2a55;
transition:0.3s;
}

.card:hover{
transform:scale(1.02);
}

/* BUTTON */
button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#00ff9d;
font-weight:bold;
cursor:pointer;
color:black;
margin-top:10px;
}

/* ITEM LIST */
.item{
padding:14px;
margin:8px 0;
background:#111a33;
border-radius:12px;
text-align:center;
cursor:pointer;
border:1px solid #1f2a55;
}

.item:hover{
background:#18244a;
}

/* SIGNAL */
.signal{
font-size:70px;
text-align:center;
margin-top:20px;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

/* SCORE */
.score{
text-align:center;
font-size:20px;
margin-top:10px;
color:#aaa;
}

/* TIMER BAR */
.bar{
height:8px;
background:#1a1f35;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:1s;
}

/* TIMER TEXT */
.timer{
text-align:center;
margin-top:10px;
color:#999;
font-size:13px;
}

/* NAV BUTTONS */
.nav{
position:absolute;
bottom:0;
width:100%;
display:flex;
background:#0f1630;
border-top:1px solid #1f2a55;
}

.nav button{
flex:1;
background:none;
color:white;
padding:12px;
border:none;
font-size:12px;
}

.nav button:hover{
background:#1a2550;
}

</style>

</head>

<body>

<div class="app">

<!-- HEADER -->
<div class="header">
<h2>SNIPER AI PRO</h2>
<p>AI PREDICTION ENGINE</p>
</div>

<!-- SCREEN 1 -->
<div class="screen active" id="s1">

<div class="card">
<h3>🔄 SCAN MARKET</h3>
<button onclick="scan()">START SCAN</button>
</div>

</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">
<h3>📊 CHOOSE MARKET</h3>
<div id="markets"></div>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="s3">
<h3>⏱ SELECT TIME</h3>

<div class="item" onclick="setTime(60)">1 MIN</div>
<div class="item" onclick="setTime(300)">5 MIN</div>
<div class="item" onclick="setTime(900)">15 MIN</div>

</div>

<!-- SCREEN 4 -->
<div class="screen" id="s4">

<div class="card">
<h3>🧠 ANALYZING...</h3>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="timer" id="timer">WAITING SIGNAL...</div>

<button onclick="analyze()">ANALYZE NOW</button>
</div>

</div>

<!-- SCREEN 5 -->
<div class="screen" id="s5">

<div id="signal" class="signal wait">WAIT</div>

<div class="score" id="score">0%</div>

<button onclick="restart()">NEW ANALYSIS</button>

</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="go('s1')">HOME</button>
<button onclick="go('s2')">MARKET</button>
<button onclick="go('s3')">TIME</button>
<button onclick="go('s4')">AI</button>
</div>

<script>

let symbol="";
let expiry=60;
let interval;

/* NAV */
function go(id){
document.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* SCAN MARKET */
function scan(){

let markets=[
"BTCUSD","ETHUSD","EURUSD","GBPUSD",
"USDJPY","XAUUSD","NAS100","SPX500",
"DOWJONES","GER40","AUDUSD","NZDUSD"
];

let box=document.getElementById("markets");
box.innerHTML="";

markets.forEach(m=>{

let div=document.createElement("div");
div.className="item";
div.innerText=m;

div.onclick=()=>{
symbol=m;
go("s3");
};

box.appendChild(div);

});

go("s2");
}

/* TIME */
function setTime(t){
expiry=t;
go("s4");
}

/* TIMER */
function startTimer(){

let time=expiry;
clearInterval(interval);

interval=setInterval(()=>{

time--;

document.getElementById("timer").innerText =
"EXPIRY: " + time + "s";

document.getElementById("fill").style.width =
(time/expiry)*100 + "%";

if(time<=0){
clearInterval(interval);
document.getElementById("timer").innerText="EXPIRED";
}

},1000);

}

/* ANALYZE */
async function analyze(){

startTimer();

const res = await fetch(`/api/${symbol}/1m`);
const data = await res.json();

let signal=document.getElementById("signal");
let score=document.getElementById("score");

signal.innerText=data.signal;
score.innerText=(data.strength||0)+"%";

signal.className="signal " +
(data.signal==="BUY"?"buy":
data.signal==="SELL"?"sell":"wait");

setTimeout(()=>{
go("s5");
},1500);

}

/* RESET */
function restart(){
go("s1");
}

</script>

</body>
</html>
