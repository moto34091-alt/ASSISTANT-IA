<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI PRO</title>

<style>

body{
margin:0;
background:#050816;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.app{
width:100%;
max-width:420px;
background:#0c1224;
border-radius:18px;
padding:15px;
box-shadow:0 0 25px #000;
}

/* HEADER */
.header{
text-align:center;
font-size:22px;
font-weight:bold;
color:#00ff9d;
margin-bottom:10px;
}

/* SELECTS */
select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:none;
font-weight:bold;
}

select{
background:#141d38;
color:white;
}

button{
background:#00ff9d;
color:black;
cursor:pointer;
}

/* SIGNAL */
.signalBox{
text-align:center;
margin-top:15px;
}

.signal{
font-size:42px;
font-weight:bold;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

/* INFO */
.info{
margin-top:8px;
color:#ccc;
}

/* TIMER BAR */
.timerContainer{
margin-top:15px;
display:none;
}

.bar{
height:10px;
background:#182341;
border-radius:20px;
overflow:hidden;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:width 1s linear;
}

.timerText{
text-align:center;
margin-top:5px;
font-size:14px;
color:#aaa;
}

</style>
</head>

<body>

<div class="app">

<div class="header">🔥 SNIPER AI PRO</div>

<!-- MARKET -->
<select id="market">
<option>EURUSD</option>
<option>GBPUSD</option>
<option>USDJPY</option>
<option>BTCUSD</option>
<option>ETHUSD</option>
<option>XAUUSD</option>
</select>

<!-- TIMEFRAME -->
<select id="tf">
<option value="1min">1 MIN</option>
<option value="5min">5 MIN</option>
<option value="15min">15 MIN</option>
</select>

<button onclick="analyze()">📡 ANALYZE</button>

<div class="signalBox">

<div id="signal" class="signal wait">WAIT</div>

<div class="info" id="price">PRICE: --</div>
<div class="info" id="rsi">RSI: --</div>
<div class="info" id="conf">CONF: 0%</div>

</div>

<!-- TIMER -->
<div class="timerContainer" id="timerBox">

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="timerText" id="timerText">60 SEC EXPIRATION</div>

</div>

</div>

<script>

let timer = null;

async function analyze(){

const symbol = document.getElementById("market").value;
const tf = document.getElementById("tf").value;

const res = await fetch(`/signal?symbol=${symbol}&tf=${tf}`);
const data = await res.json();

/* UPDATE UI */
document.getElementById("signal").innerText = data.signal;
document.getElementById("price").innerText = "PRICE: " + data.price;
document.getElementById("rsi").innerText = "RSI: " + data.rsi;
document.getElementById("conf").innerText = "CONF: " + data.confidence + "%";

/* STYLE SIGNAL */
let s = document.getElementById("signal");
s.className = "signal " + (data.signal === "BUY" ? "buy" :
                          data.signal === "SELL" ? "sell" : "wait"));

/* START TIMER */
startTimer();

}

/* 60 SEC EXPIRATION BAR */
function startTimer(){

clearInterval(timer);

let time = 60;

document.getElementById("timerBox").style.display = "block";

timer = setInterval(()=>{

time--;

document.getElementById("fill").style.width = (time/60*100) + "%";
document.getElementById("timerText").innerText = time + " SEC EXPIRATION";

if(time <= 0){
clearInterval(timer);
document.getElementById("timerBox").style.display = "none";
}

},1000);

}

</script>

</body>
</html>
