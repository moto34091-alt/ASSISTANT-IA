<script>

/* =========================
   SAFE WEBSOCKET FIX
========================= */

const protocol =
location.protocol === "https:"
? "wss://"
: "ws://";

const ws = new WebSocket(
protocol + location.host
);

/* DEBUG */

ws.onopen = ()=>{
console.log("✅ WS CONNECTED");
};

ws.onerror = (e)=>{
console.log("❌ WS ERROR", e);
};

ws.onclose = ()=>{
console.log("⚠️ WS CLOSED");
};

/* =========================
   LIVE DATA
========================= */

let chart = [];

ws.onmessage = (msg)=>{

let d = JSON.parse(msg.data);

console.log("LIVE:", d);

/* SAFE CHECK */

if(!d || !d.price){
return;
}

/* UPDATE UI */

document.getElementById("signal").innerText =
d.signal || "WAIT";

document.getElementById("price").innerText =
d.price || 0;

document.getElementById("rsi").innerText =
d.rsi || 0;

document.getElementById("emaF").innerText =
d.emaFast || 0;

document.getElementById("emaS").innerText =
d.emaSlow || 0;

document.getElementById("win").innerText =
d.winRate || 0;

/* =========================
   CHART
========================= */

chart.push(d.price);

if(chart.length > 60){
chart.shift();
}

drawChart();

};

/* =========================
   SIMPLE LIVE CHART
========================= */

const canvas =
document.getElementById("chart");

const ctx =
canvas.getContext("2d");

canvas.width = window.innerWidth;

function drawChart(){

ctx.clearRect(
0,
0,
canvas.width,
300
);

ctx.beginPath();

for(let i=0;i<chart.length;i++){

let x =
i * (canvas.width / chart.length);

let y =
300 - chart[i] * 0.002;

ctx.lineTo(x,y);

}

ctx.strokeStyle = "#00ff99";
ctx.lineWidth = 2;
ctx.stroke();

}

</script>
