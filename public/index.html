<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SNIPER PRO V30</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
}

header{
text-align:center;
padding:20px;
background:#0b1220;
border-bottom:1px solid #00ff9d33;
}

header h1{
color:#00ff9d;
font-size:22px;
}

.container{
padding:15px;
}

.select-box{
display:flex;
gap:10px;
margin-bottom:15px;
}

select{
flex:1;
padding:10px;
border-radius:10px;
border:none;
background:#0f172a;
color:white;
}

.signal{
text-align:center;
padding:20px;
margin:10px 0;
border-radius:15px;
background:#0c1224;
border:1px solid #00ff9d33;
font-size:30px;
font-weight:bold;
transition:0.3s;
}

.buy{ color:#00ff9d; }
.sell{ color:#ff3b5c; }
.wait{ color:#facc15; }

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.card{
background:#0c1224;
padding:15px;
border-radius:15px;
border:1px solid #00ff9d22;
text-align:center;
}

.label{
font-size:12px;
color:#888;
}

.value{
font-size:20px;
font-weight:bold;
margin-top:5px;
}

button{
width:100%;
margin-top:15px;
padding:12px;
background:#00ff9d;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

button:active{
transform:scale(0.98);
}

</style>

</head>

<body>

<header>
<h1>🚀 SNIPER PRO V30 LIVE</h1>
</header>

<div class="container">

<!-- SELECT -->
<div class="select-box">
<select id="symbol">
<option>EURUSD</option>
<option>GBPUSD</option>
<option>BTCUSD</option>
<option>ETHUSD</option>
</select>

<select id="interval">
<option value="1m">1 MIN</option>
<option value="5m">5 MIN</option>
<option value="15m">15 MIN</option>
</select>
</div>

<!-- SIGNAL -->
<div id="signal" class="signal wait">WAIT</div>

<!-- CARDS -->
<div class="cards">

<div class="card">
<div class="label">PRICE</div>
<div class="value" id="price">0</div>
</div>

<div class="card">
<div class="label">RSI</div>
<div class="value" id="rsi">50</div>
</div>

<div class="card">
<div class="label">TREND</div>
<div class="value" id="trend">---</div>
</div>

<div class="card">
<div class="label">STRENGTH</div>
<div class="value" id="strength">0</div>
</div>

</div>

<button onclick="loadData()">🔁 REFRESH</button>

</div>

<script>

async function loadData(){

const symbol = document.getElementById("symbol").value;
const interval = document.getElementById("interval").value;

try {

const res = await fetch(`/api/${symbol}/${interval}`);
const data = await res.json();

console.log("DATA:", data);

/* UPDATE UI */
document.getElementById("price").innerText = data.price || 0;
document.getElementById("rsi").innerText = data.rsi || 50;
document.getElementById("trend").innerText = data.trend || "NO DATA";
document.getElementById("strength").innerText = data.strength || 0;

/* SIGNAL */
const signal = document.getElementById("signal");

signal.innerText = data.signal || "WAIT";

signal.className = "signal " + (
data.signal === "BUY" ? "buy" :
data.signal === "SELL" ? "sell" : "wait"
);

} catch(err){
console.log("ERROR:", err.message);
}

}

/* AUTO LIVE */
setInterval(loadData, 3000);
loadData();

</script>

</body>
</html>
