<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NEVER ZERO AI TRADER</title>

<style>

body{
margin:0;
background:#060b14;
color:white;
font-family:Arial;
}

header{
padding:15px;
text-align:center;
background:#111827;
color:#00ff99;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
padding:10px;
}

.card{
background:#111827;
padding:15px;
border-radius:12px;
text-align:center;
}

canvas{
width:100%;
height:300px;
background:#0f172a;
}

#signal{
font-size:20px;
font-weight:bold;
}

.float{
position:fixed;
bottom:20px;
right:20px;
background:#00ff99;
padding:15px;
border-radius:50%;
text-decoration:none;
color:black;
}

</style>
</head>

<body>

<header>🚀 NEVER ZERO FIX PRO</header>

<canvas id="chart"></canvas>

<div class="grid">

<div class="card">SIGNAL <div id="signal">WAIT</div></div>
<div class="card">PRICE <div id="price">loading...</div></div>
<div class="card">RSI <div id="rsi">0</div></div>
<div class="card">EMA FAST <div id="emaF">0</div></div>
<div class="card">EMA SLOW <div id="emaS">0</div></div>
<div class="card">WIN RATE <div id="win">0%</div></div>

</div>

<a class="float" href="https://t.me/signalstradings_bot">📡 BOT</a>

<script>

const ws = new WebSocket("ws://" + location.host);

let chart = [];

ws.onmessage = (msg)=>{

let d = JSON.parse(msg.data);

if(!d || !d.price) return;

document.getElementById("signal").innerText = d.signal;
document.getElementById("price").innerText = d.price;
document.getElementById("rsi").innerText = d.rsi;
document.getElementById("emaF").innerText = d.emaFast;
document.getElementById("emaS").innerText = d.emaSlow;
document.getElementById("win").innerText = d.winRate;

/* chart */
chart.push(d.price);
if(chart.length > 60) chart.shift();

draw();
};

const ctx = document.getElementById("chart").getContext("2d");
const canvas = document.getElementById("chart");
canvas.width = window.innerWidth;

function draw(){

ctx.clearRect(0,0,canvas.width,300);

ctx.beginPath();

for(let i=0;i<chart.length;i++){

let x = i * (canvas.width / chart.length);
let y = 300 - chart[i]*0.002;

ctx.lineTo(x,y);
}

ctx.strokeStyle="#00ff99";
ctx.stroke();
}

</script>

</body>
</html>
