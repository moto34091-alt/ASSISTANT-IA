<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI PRO SYSTEM</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:10px;
}

.app{
width:100%;
max-width:420px;
background:#0c1224;
border-radius:25px;
padding:16px;
border:1px solid #1f2b4d;
}

.top{display:flex;justify-content:space-between;margin-bottom:10px}
.live{color:#00ff9d;font-weight:bold}

h2{text-align:center;color:#00ff9d}

select{
width:100%;
padding:12px;
margin-top:10px;
border-radius:12px;
background:#121d38;
color:white;
}

.buttons{display:flex;gap:10px;margin-top:10px}

button{
flex:1;
padding:12px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.analyze{background:#00ff9d;color:black}
.auto{background:#1c2d52;color:white}

.signalBox{
margin-top:15px;
background:#111827;
padding:18px;
border-radius:20px;
text-align:center;
}

.icon{font-size:55px}
.signal{font-size:40px;font-weight:bold}

.buy{color:#00ff9d}
.sell{color:#ff3b5c}
.wait{color:#facc15}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.card{
background:#141f3a;
padding:10px;
border-radius:12px;
font-size:12px;
}

.bar{
height:10px;
background:#1d2746;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:width 1s linear;
}

.timer{
margin-top:10px;
font-size:13px;
color:#ccc;
display:none;
}

/* FLOAT */
.float{
position:fixed;
bottom:18px;
left:50%;
transform:translateX(-50%);
background:#00ff9d;
color:black;
padding:10px 18px;
border-radius:30px;
font-weight:bold;
font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<div class="top">
<div class="live">🟢 LIVE</div>
<div id="clock"></div>
</div>

<h2>SNIPER AI SYSTEM</h2>

<select id="market">
<option>OTC EUR/USD</option>
<option>OTC GBP/USD</option>
<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>BTC/USD</option>
<option>ETH/USD</option>
</select>

<div class="buttons">
<button class="analyze" onclick="analyze()">ANALYZE</button>
<button class="auto" onclick="autoMode()" id="autoBtn">AUTO</button>
</div>

<div class="signalBox">

<div class="icon" id="icon">🟡</div>
<div class="signal wait" id="signal">WAIT</div>

<div id="entry">ENTRY: -</div>
<div id="price">PRICE: --</div>

<div class="grid">
<div>PROB<br><b id="prob">0%</b></div>
<div>WIN<br><b id="winrate">0%</b></div>
<div>TREND<br><b id="trend">NEUTRAL</b></div>
<div>TF<br><b>1m / 5m / 15m</b></div>
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="timer" id="timer">READY</div>

</div>

</div>

<div class="float">@Mr_dflam</div>

<script>

/* CLOCK */
setInterval(()=>{
document.getElementById("clock").innerText=new Date().toLocaleTimeString();
},1000);

/* STATE */
let auto=null;
let timer=null;
let isRunning=false;

/* TIMEFRAMES */
const tf={
"1m":[],
"5m":[],
"15m":[]
};

/* MARKET CLASS */
function classify(symbol){

if(symbol.includes("OTC")){
if(symbol.includes("EUR/USD")||symbol.includes("GBP/USD")) return "OTC_HIGH";
return "OTC_LOW";
}

if(symbol.includes("BTC")||symbol.includes("ETH")) return "CRYPTO";

return "FOREX";
}

/* ADJUST */
function adjust(score,type){

if(type==="OTC_HIGH") return score*1.05;
if(type==="OTC_LOW") return score*0.80;
if(type==="CRYPTO") return score*1.15;
return score*1.10;
}

/* PRICE */
function price(symbol){
let p=100+Math.random()*10;
if(symbol.includes("BTC"))p=60000+Math.random()*1000;
if(symbol.includes("ETH"))p=3000+Math.random()*100;
return p;
}

/* CANDLE */
function candle(p){
return{
open:p,
close:p+(Math.random()-0.5),
high:p+Math.random(),
low:p-Math.random()
};
}

/* UPDATE TF */
function update(p){
tf["1m"].push(candle(p));
tf["5m"].push(candle(p));
tf["15m"].push(candle(p));

if(tf["1m"].length>30)tf["1m"].shift();
if(tf["5m"].length>30)tf["5m"].shift();
if(tf["15m"].length>30)tf["15m"].shift();
}

/* ANALYZE TF */
function analyzeTF(data){
let b=0,s=0;
for(let i=1;i<data.length;i++){
data[i].close>data[i-1].close?b++:s++;
}
return b>s?"BUY":s>b?"SELL":"NEUTRAL";
}

/* ENGINE */
function engine(p,symbol){

update(p);

let t1=analyzeTF(tf["1m"]);
let t5=analyzeTF(tf["5m"]);
let t15=analyzeTF(tf["15m"]);

let type=classify(symbol);

let buy=0,sell=0;

if(t15==="BUY")buy+=3;
if(t15==="SELL")sell+=3;

if(t5==="BUY")buy+=2;
if(t5==="SELL")sell+=2;

if(t1==="BUY")buy++;
if(t1==="SELL")sell++;

buy=adjust(buy,type);
sell=adjust(sell,type);

let signal="WAIT";

if(buy>=5 && buy>sell)signal="BUY";
else if(sell>=5 && sell>buy)signal="SELL";

let prob=50+Math.max(buy,sell)*6;
if(type==="OTC_LOW")prob-=10;
if(prob>95)prob=95;

return{
signal,
prob,
trend:t15
};
}

/* APPLY */
function apply(d,p){

document.getElementById("icon").innerText=
d.signal==="BUY"?"🟢":d.signal==="SELL"?"🔴":"🟡";

document.getElementById("signal").innerText=d.signal;
document.getElementById("signal").className="signal "+d.signal.toLowerCase();

document.getElementById("prob").innerText=d.prob+"%";
document.getElementById("winrate").innerText=(d.prob-4).toFixed(1)+"%";
document.getElementById("trend").innerText=d.trend;

document.getElementById("price").innerText="PRICE: "+p.toFixed(2);

document.getElementById("entry").innerText=
d.signal==="BUY"?"ENTRY BUY 🔼":
d.signal==="SELL"?"ENTRY SELL 🔽":"WAIT";
}

/* ANALYZE */
function analyze(){
if(isRunning)return;
isRunning=true;

let m=document.getElementById("market").value;
let p=price(m);

document.getElementById("signal").innerText="ANALYZING...";

setTimeout(()=>{
let d=engine(p,m);
apply(d,p);
start(d.signal);
isRunning=false;
},600);
}

/* TIMER */
function start(sig){

clearInterval(timer);
if(sig==="WAIT")return;

let s=60;
document.getElementById("timer").style.display="block";

timer=setInterval(()=>{

s--;
document.getElementById("fill").style.width=(s/60*100)+"%";
document.getElementById("timer").innerText="TRADE: "+s+"s";

if(s<=0){
clearInterval(timer);
document.getElementById("timer").style.display="none";
}

},1000);
}

/* AUTO */
function autoMode(){

let b=document.getElementById("autoBtn");

if(auto){
clearInterval(auto);
auto=null;
b.innerText="AUTO";
return;
}

b.innerText="AUTO ON";

auto=setInterval(()=>analyze(),3500);
}

</script>

</body>
</html>
