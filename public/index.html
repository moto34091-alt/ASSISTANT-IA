<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Assistant Trading Pro</title>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#050816;
  color:white;
  font-family:Arial;
}

/* ================= HEADER ================= */
.header{
  padding:15px;
  background:#111827;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{color:#38bdf8;font-weight:bold}
.status{color:#22c55e}

/* ================= LAYOUT ================= */
.main{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:10px;
  padding:10px;
}

.sidebar{
  background:#0f172a;
  padding:10px;
  border-radius:10px;
  height:90vh;
  overflow:auto;
}

.market{
  padding:10px;
  margin:5px 0;
  background:#111827;
  border-radius:8px;
}

.content{display:flex;flex-direction:column;gap:10px}

#chart{
  height:420px;
  background:#0f172a;
  border-radius:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
}

.card{
  background:#0f172a;
  padding:15px;
  border-radius:10px;
}

.big{font-size:28px}

/* ================= BUTTONS ================= */
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
  background:#111827;
  color:white;
}

/* ================= FLOATING BUTTON ================= */
.floating{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#22c55e;
  padding:15px;
  border-radius:50px;
  cursor:pointer;
  font-weight:bold;
  box-shadow:0 0 10px #22c55e;
}

.help-btn{
  position:fixed;
  left:20px;
  bottom:20px;
  background:#f59e0b;
  padding:12px;
  border-radius:50px;
  cursor:pointer;
}

.settings{
  position:fixed;
  top:15px;
  right:15px;
  background:#1f2937;
  padding:10px;
  border-radius:50%;
  cursor:pointer;
}

/* ================= ADMIN PANEL ================= */
.admin-panel{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#050816;
  display:none;
  flex-direction:column;
  padding:20px;
  z-index:999;
}

.admin-box{
  background:#111827;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
}

.close{
  position:absolute;
  top:10px;
  right:10px;
  cursor:pointer;
  color:red;
  font-size:20px;
}

</style>

</head>
<body>

<div class="header">
  <div class="logo">🚀 ASSISTANT PRO</div>
  <div class="status">🟢 LIVE</div>
</div>

<!-- SETTINGS ICON -->
<div class="settings" onclick="openAdmin()">⚙️</div>

<!-- HELP BUTTON -->
<div class="help-btn" onclick="help()">❓ Aide</div>

<!-- FLOATING TELEGRAM BUTTON -->
<div class="floating" onclick="openTelegram()">
@Mr_dflam 🚀 JOIN SIGNAL
</div>

<!-- ADMIN PANEL FULL SCREEN -->
<div class="admin-panel" id="adminPanel">

<div class="close" onclick="closeAdmin()">✖</div>

<h2>⚙️ ADMIN PANEL PRO</h2>

<div class="admin-box">
📢 Message Admin
<input id="msg" placeholder="Update message">
<button onclick="updateAdmin()">Update</button>
</div>

<div class="admin-box">
🔐 Login
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div class="admin-box">
📊 Strategy Control
<button onclick="alert('AI MODE: ACTIVE')">Activate AI</button>
<button onclick="alert('SAFE MODE')">Safe Mode</button>
</div>

</div>

<div class="main">

<div class="sidebar">
<h3>MARKETS</h3>
<div class="market">EUR/USD OTC</div>
<div class="market">BTCUSDT</div>
<div class="market">USD/JPY OTC</div>
</div>

<div class="content">

<div id="chart"></div>

<div class="grid">

<div class="card">
<h3>SIGNAL</h3>
<div id="signal" class="big">WAIT</div>
</div>

<div class="card">
<h3>RSI</h3>
<div id="rsi" class="big">0</div>
</div>

<div class="card">
<h3>EMA</h3>
<div id="ema" class="big">0</div>
</div>

<div class="card">
<h3>ADMIN MSG</h3>
<p id="adminMsg">Loading...</p>
</div>

</div>

</div>

</div>

<script>

function openAdmin(){
  document.getElementById('adminPanel').style.display='flex';
}

function closeAdmin(){
  document.getElementById('adminPanel').style.display='none';
}

function help(){
  alert("📘 Bot IA Trading Pro\n- Analyse marché\n- RSI + EMA\n- Signaux automatiques");
}

function openTelegram(){
  window.open("https://t.me/signalstradings_bot","_blank");
}

async function updateAdmin(){
  document.getElementById("adminMsg").innerText = document.getElementById("msg").value;
}

async function login(){
  alert("Login OK (demo)");
}

</script>

</body>
</html>
