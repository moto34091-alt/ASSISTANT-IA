<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NZFX AI TERMINAL</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{margin:0;background:#050816;color:#fff;font-family:Arial}
header{padding:20px;text-align:center;background:#0b1220;border-bottom:1px solid #00ff9d33}
h1{color:#00ff9d}
.topbar{display:flex;gap:10px;padding:15px}
select{flex:1;padding:12px;background:#0f172a;color:white;border:none;border-radius:10px}
#status{text-align:center;padding:10px;color:#00ff9d}
.signal-box{text-align:center;padding:25px;margin:15px;background:#0c1224;border-radius:20px}
.signal-value{font-size:60px;font-weight:bold}
.buy{color:#00ff9d}
.sell{color:#ff3b5c}
.wait{color:#facc15}
#tvchart{height:350px;margin:15px;border-radius:20px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:15px}
.card{background:#0c1224;padding:15px;border-radius:15px}
.label{color:#888;font-size:12px}
.value{font-size:22px;font-weight:bold}
</style>

</head>

<body>

<header>
<h1>🚀 NZFX AI TERMINAL</h1>
<p>BINANCE LIVE ENGINE</p>
</header>

<div class="topbar">

<select id="symbol">
<option value="BTCUSDT">BTC/USDT</option>
<option value="ETHUSDT">ETH/USDT</option>
<option value="SOLUSDT">SOL/USDT</option>
<option value="BNBUSDT">BNB/USDT</option>
<option value="XRPUSDT">XRP/USDT</option>
<option value="DOGEUSDT">DOGE/USDT</option>
</select>

<select id="interval">
<option value="1m">1 MIN</option>
<option value="5m">5 MIN</option>
<option value="15m">15 MIN</option>
<option value="1h">1 HOUR</option>
</select>

</div>

<div id="status">🟡 CONNECTING...</div>

<div class="signal-box">
<div>AI SIGNAL</div>
<div id="signal" class="signal-value wait">WAIT</div>
</div>

<div id="tvchart"></div>

<div class="grid">

<div class="card"><div class="label">PRICE</div><div class="value" id="price">0</div></div>
<div class="card"><div class="label">RSI</div><div class="value" id="rsi">0</div></div>
<div class="card"><div class="label">EMA FAST</div><div class="value" id="emaF">0</div></div>
<div class="card"><div class="label">EMA SLOW</div><div class="value" id="emaS">0</div></div>
<div class="card"><div class="label">WIN RATE</div><div class="value" id="win">0%</div></div>
<div class="card"><div class="label">MOMENTUM</div><div class="value" id="momentum">0</div></div>

</div>

<a href="https://t.me/signalstradings_bot" style="position:fixed;bottom:20px;right:20px;background:#00ff9d;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:black;font-size:24px">📡</a>

<script>

const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host);

const symbolEl = document.getElementById("symbol");
const intervalEl = document.getElementById("interval");
const status = document.getElementById("status");
const signal = document.getElementById("signal");

let widget;

function loadChart(){
document.getElementById("tvchart").innerHTML = "";

widget = new TradingView.widget({
container_id:"tvchart",
autosize:true,
symbol:"BINANCE:" + symbolEl.value,
interval: intervalEl.value === "1h" ? "60" : intervalEl.value.replace("m",""),
theme:"dark",
style:"1"
});
}

loadChart();

function send(){
ws.send(JSON.stringify({
symbol: symbolEl.value,
interval: intervalEl.value
}));
}

symbolEl.onchange = ()=>{ loadChart(); send(); };
intervalEl.onchange = ()=>{ loadChart(); send(); };

ws.onopen = ()=>{
status.innerText = "🟢 LIVE CONNECTED";
send();
};

ws.onmessage = (msg)=>{

const d = JSON.parse(msg.data);

if(!d || d.ok === false){
status.innerText = "⚠️ NO DATA";
return;
}

signal.innerText = d.signal;

signal.className =
"signal-value " +
(d.signal === "BUY" ? "buy" :
d.signal === "SELL" ? "sell" : "wait");

document.getElementById("price").innerText = d.price;
document.getElementById("rsi").innerText = d.rsi;
document.getElementById("emaF").innerText = d.emaFast;
document.getElementById("emaS").innerText = d.emaSlow;
document.getElementById("win").innerText = d.winRate + "%";
document.getElementById("momentum").innerText = d.momentum;

};

ws.onerror = ()=>{
status.innerText = "🔴 CONNECTION ERROR";
};

</script>

</body>
</html>
