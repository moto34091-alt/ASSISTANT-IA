<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI V16 LIVE</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.app{
width:95%;
max-width:420px;
background:#0c1224;
padding:18px;
border-radius:20px;
}

h2{
text-align:center;
color:#00ff9d;
}

select{
width:100%;
padding:12px;
margin-top:10px;
background:#111a33;
color:white;
border:none;
border-radius:10px;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.analyze{
background:#00ff9d;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.03);}
100%{transform:scale(1);}
}

.signal{
text-align:center;
font-size:65px;
margin-top:10px;
transition:0.3s;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

.info{
text-align:center;
margin-top:8px;
color:#aaa;
}

.bar{
height:18px;
background:#1a1f35;
border-radius:20px;
overflow:hidden;
margin-top:12px;
}

.fill{
height:100%;
width:50%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:0.3s;
}

.status{
text-align:center;
margin-top:10px;
font-size:12px;
color:#888;
}

</style>

</head>

<body>

<div class="app">

<h2>📊 V16 REAL LIVE ENGINE</h2>

<select id="market">
<option value="EURUSD">EUR/USD</option>
<option value="GBPUSD">GBP/USD</option>
<option value="USDJPY">USD/JPY</option>
<option value="USDCHF">USD/CHF</option>
<option value="USDCAD">USD/CAD</option>
<option value="XAUUSD">GOLD</option>
</select>

<select id="time">
<option value="1min">1 MIN</option>
<option value="5min">5 MIN</option>
<option value="15min">15 MIN</option>
</select>

<button class="analyze" onclick="startAuto()">
🔄 AUTO ANALYZE LIVE
</button>

<div id="signal" class="signal wait">WAIT</div>

<div class="info" id="score">SCORE: 0</div>
<div class="info" id="prob">PROB: 50%</div>
<div class="info" id="rsi">RSI: 50</div>
<div class="info" id="mom">MOM: 0</div>

<div class="bar">
<div id="fill" class="fill"></div>
</div>

<div class="status" id="status">READY</div>

</div>

<script>

let loop;

/* ANALYZE */
async function analyze(){

const market = document.getElementById("market").value;
const time = document.getElementById("time").value;

const res = await fetch(`/api/${market}/${time}`);
const data = await res.json();

/* UI LIVE */
document.getElementById("score").innerText =
"SCORE: " + data.score;

document.getElementById("prob").innerText =
"PROB: " + data.probability + "%";

document.getElementById("rsi").innerText =
"RSI: " + data.rsi;

document.getElementById("mom").innerText =
"MOM: " + data.momentum;

/* SIGNAL */
const s = document.getElementById("signal");

if(data.signal === "BUY"){
s.innerText = "🟢 BUY";
s.className = "signal buy";
}

else if(data.signal === "SELL"){
s.innerText = "🔴 SELL";
s.className = "signal sell";
}

else{
s.innerText = "🟡 WAIT";
s.className = "signal wait";
}

document.getElementById("fill").style.width =
data.probability + "%";

document.getElementById("status").innerText =
"LIVE " + new Date().toLocaleTimeString();

}

/* AUTO MODE LIVE */
function startAuto(){

clearInterval(loop);

loop = setInterval(()=>{
analyze();
}, 1500);

document.getElementById("status").innerText =
"AUTO LIVE ON";

analyze();

}

</script>

</body>

</html>
