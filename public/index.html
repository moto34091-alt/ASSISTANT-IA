<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI V14</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.app{
width:95%;
max-width:420px;
background:#0c1224;
border-radius:25px;
padding:18px;
}

h2{
text-align:center;
color:#00ff9d;
}

/* SELECT */
select{
width:100%;
padding:14px;
margin-top:10px;
border-radius:12px;
border:none;
background:#111a33;
color:white;
}

/* BUTTONS */
button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:14px;
background:#00ff9d;
font-weight:bold;
cursor:pointer;
}

.auto{
background:#00c3ff;
color:black;
}

/* SIGNAL */
.signal{
text-align:center;
font-size:70px;
margin-top:20px;
font-weight:bold;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

/* INFO */
.info{
text-align:center;
margin-top:10px;
color:#aaa;
}

/* BAR */
.bar{
height:18px;
background:#1a1f35;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
}

/* STATUS */
.status{
text-align:center;
margin-top:10px;
font-size:13px;
color:#888;
}

</style>

</head>

<body>

<div class="app">

<h2>📊 SNIPER AI V14 FULL</h2>

<!-- MARKET CLEAN -->
<select id="market">

<option value="EURUSD">EUR/USD</option>
<option value="GBPUSD">GBP/USD</option>
<option value="USDJPY">USD/JPY</option>
<option value="USDCHF">USD/CHF</option>
<option value="USDCAD">USD/CAD</option>
<option value="AUDUSD">AUD/USD</option>
<option value="NZDUSD">NZD/USD</option>
<option value="EURGBP">EUR/GBP</option>
<option value="EURJPY">EUR/JPY</option>
<option value="GBPJPY">GBP/JPY</option>
<option value="XAUUSD">GOLD</option>

</select>

<!-- TIME -->
<select id="time">
<option value="60">1 MIN</option>
<option value="300">5 MIN</option>
<option value="900">15 MIN</option>
</select>

<!-- MANUAL -->
<button onclick="analyze()">🔄 ANALYZE</button>

<!-- AUTO -->
<button class="auto" onclick="toggleAuto()">🤖 AUTO ANALYZE OFF</button>

<!-- SIGNAL -->
<div id="signal" class="signal wait">WAIT</div>

<div class="info" id="score">SCORE: 0</div>
<div class="info" id="prob">PROB: 0%</div>

<!-- BAR -->
<div class="bar">
<div id="fill" class="fill"></div>
</div>

<div class="status" id="status">READY</div>

</div>

<script>

let auto = false;
let loop;

/* ANALYZE */
async function analyze(){

const market = document.getElementById("market").value;

const res = await fetch(`/api/${market}`);
const data = await res.json();

/* SCORE */
document.getElementById("score").innerText =
"SCORE: " + data.score;

/* PROB */
document.getElementById("prob").innerText =
"PROB: " + data.probability + "%";

/* SIGNAL */
const s = document.getElementById("signal");

if(data.signal === "BUY"){
s.innerText = "🟢 BUY";
s.className = "signal buy";
}

else if(data.signal === "SELL"){
s.innerText = "🔴 SELL";
s.className = "signal sell";
}

else{
s.innerText = "🟡 WAIT";
s.className = "signal wait";
}

/* BAR */
document.getElementById("fill").style.width =
data.probability + "%";

/* STATUS */
document.getElementById("status").innerText =
"UPDATED: " + new Date().toLocaleTimeString();

}

/* AUTO MODE */
function toggleAuto(){

auto = !auto;

const btn = document.querySelector(".auto");

if(auto){

btn.innerText = "🤖 AUTO ANALYZE ON";

loop = setInterval(analyze, 3000);

}else{

btn.innerText = "🤖 AUTO ANALYZE OFF";

clearInterval(loop);

}

}

</script>

</body>

</html>
