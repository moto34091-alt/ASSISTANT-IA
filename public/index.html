<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Assistant Trading Pro</title>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#050816;
  color:white;
  font-family:Arial;
}

.header{
  padding:15px;
  background:#111827;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#38bdf8;
  font-weight:bold;
  font-size:20px;
}

.status{
  color:#22c55e;
}

.main{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:10px;
  padding:10px;
}

.sidebar{
  background:#0f172a;
  padding:10px;
  border-radius:10px;
  height:90vh;
  overflow:auto;
}

.market{
  padding:10px;
  margin:5px 0;
  background:#111827;
  border-radius:8px;
  cursor:pointer;
}

.content{
  display:flex;
  flex-direction:column;
  gap:10px;
}

#chart{
  height:420px;
  background:#0f172a;
  border-radius:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
}

.card{
  background:#0f172a;
  padding:15px;
  border-radius:10px;
}

.big{
  font-size:30px;
  margin-top:10px;
}

.buy{color:#22c55e;}
.sell{color:#ef4444;}
.wait{color:#f59e0b;}

input,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
}

button{
  background:#2563eb;
  color:white;
  cursor:pointer;
}

</style>

</head>

<body>

<div class="header">
  <div class="logo">🚀 ASSISTANT PRO</div>
  <div class="status">🟢 LIVE</div>
</div>

<div class="main">

<!-- SIDEBAR -->
<div class="sidebar">
  <h3>📊 MARKETS</h3>
  <div class="market">EUR/USD OTC</div>
  <div class="market">USD/JPY OTC</div>
  <div class="market">GBP/USD OTC</div>
  <div class="market">BTCUSDT</div>
  <div class="market">ETHUSDT</div>
</div>

<!-- CONTENT -->
<div class="content">

<div id="chart"></div>

<div class="grid">

<div class="card">
<h3>📈 SIGNAL</h3>
<div id="signal" class="big wait">WAIT</div>
<p id="confidence">Confidence: 0%</p>
<p id="strategy">Strategy: Loading...</p>
</div>

<div class="card">
<h3>📊 RSI</h3>
<div id="rsi" class="big">0</div>
</div>

<div class="card">
<h3>📉 EMA</h3>
<div id="ema" class="big">0</div>
</div>

<div class="card">
<h3>⚡ MOMENTUM</h3>
<div id="momentum" class="big">-</div>
</div>

<div class="card">
<h3>📢 ADMIN</h3>
<p id="adminMsg">Loading...</p>
<input id="msg" placeholder="Message admin">
<button onclick="updateAdmin()">Update</button>
</div>

<div class="card">
<h3>🔐 LOGIN</h3>
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="openPocket()">Open Pocket</button>
</div>

</div>

</div>

</div>

<script>

const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  layout:{ background:{ color:'#050816' }, textColor:'white' }
});

const candleSeries = chart.addCandlestickSeries();

let closes = [];

async function loadChart(){
  const res = await fetch("https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=100");
  const data = await res.json();

  candleSeries.setData(data.map(c=>({
    time:c[0]/1000,
    open:+c[1],
    high:+c[2],
    low:+c[3],
    close:+c[4]
  })));
}

loadChart();

function RSI(){
  if(closes.length<14)return 50;
  let g=0,l=0;
  for(let i=1;i<closes.length;i++){
    let d=closes[i]-closes[i-1];
    d>=0?g+=d:l+=-d;
  }
  let rs=g/(l||1);
  return (100-(100/(1+rs))).toFixed(2);
}

function EMA(){
  let k=2/(10+1);
  let e=closes[0];
  for(let i=1;i<closes.length;i++){
    e=closes[i]*k+e*(1-k);
  }
  return e.toFixed(2);
}

const socket = new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@kline_1m");

socket.onmessage=(e)=>{
  const k=JSON.parse(e.data).k;

  candleSeries.update({
    time:k.t/1000,
    open:+k.o,
    high:+k.h,
    low:+k.l,
    close:+k.c
  });

  let price=+k.c;
  closes.push(price);
  if(closes.length>100)closes.shift();

  let r=RSI();
  let e2=EMA();
  let m=price>closes[closes.length-2]?"UP":"DOWN";

  document.getElementById("rsi").innerText=r;
  document.getElementById("ema").innerText=e2;
  document.getElementById("momentum").innerText=m;

  let signal="WAIT";
  if(r<35&&m=="UP")signal="BUY";
  if(r>65&&m=="DOWN")signal="SELL";

  document.getElementById("signal").innerText=signal;
};

function openPocket(){
  window.open("https://pocketoption.com","_blank");
}

async function login(){
  alert("Login system ready");
}

async function updateAdmin(){
  document.getElementById("adminMsg").innerText=document.getElementById("msg").value;
}

</script>

</body>
</html>
