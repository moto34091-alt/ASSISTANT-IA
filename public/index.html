<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI V4</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* APP */
.app{
width:95%;
max-width:420px;
background:#0c1224;
border-radius:20px;
padding:15px;
overflow:hidden;
}

/* SCREENS */
.screen{
display:none;
animation:fade .3s ease;
}

.screen.active{
display:block;
}

@keyframes fade{
from{opacity:0;transform:scale(0.98);}
to{opacity:1;transform:scale(1);}
}

/* TITLE */
h3{
text-align:center;
color:#00ff9d;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
background:#00ff9d;
font-weight:bold;
cursor:pointer;
}

/* ITEM MARKET */
.item{
padding:12px;
margin:6px 0;
background:#111a33;
border-radius:10px;
cursor:pointer;
text-align:center;
}

.item:hover{
border:1px solid #00ff9d;
}

/* CHART */
#chart{
height:280px;
border-radius:15px;
overflow:hidden;
margin-top:10px;
}

/* SIGNAL */
.signal{
font-size:55px;
text-align:center;
margin-top:10px;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

/* LOADING BAR */
.bar{
height:6px;
background:#1a1f35;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
animation:load 4s linear forwards;
}

@keyframes load{
from{width:100%;}
to{width:0%;}
}

</style>

</head>

<body>

<div class="app">

<!-- SCREEN 1 -->
<div class="screen active" id="s1">

<h3>🔄 ACTUALISER MARCHÉS</h3>

<button onclick="loadMarkets()">SCAN MARKET</button>

<div id="markets"></div>

</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">

<h3>📊 CHOISIS MARCHÉ</h3>
<div id="marketList"></div>

</div>

<!-- SCREEN 3 -->
<div class="screen" id="s3">

<h3>⏱ TIMEFRAME</h3>

<button onclick="setTime('1m')">1 MIN</button>
<button onclick="setTime('5m')">5 MIN</button>
<button onclick="setTime('15m')">15 MIN</button>

</div>

<!-- SCREEN 4 -->
<div class="screen" id="s4">

<h3>🧠 ANALYSE</h3>

<div id="chart"></div>

<div class="bar">
<div class="fill"></div>
</div>

<button onclick="analyze()">START ANALYSE</button>

</div>

<!-- SCREEN 5 -->
<div class="screen" id="s5">

<div id="signal" class="signal wait">WAIT</div>

<div style="text-align:center" id="strength">0%</div>

<button onclick="restart()">🔁 NEW ANALYSIS</button>

</div>

</div>

<script>

let selected="";
let time="";

/* ================= NAV ================= */
function go(id){
document.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("active"));

document.getElementById(id).classList.add("active");
}

/* ================= MARKET LIST ================= */
function loadMarkets(){

let list=[
"BTCUSD","ETHUSD","EURUSD","GBPUSD","USDJPY",
"XAUUSD","NAS100","SPX500","GER40","AUDUSD",
"NZDUSD","USDCAD","BTCUSDT","SOLUSD","XRPUSD"
];

let box=document.getElementById("marketList");
box.innerHTML="";

list.forEach(m=>{

let div=document.createElement("div");
div.className="item";
div.innerText=m;

div.onclick=()=>{
selected=m;
loadChart(m);
go("s3");
};

box.appendChild(div);

});

go("s2");
}

/* ================= TIME ================= */
function setTime(t){
time=t;
go("s4");
}

/* ================= CHART ================= */
function loadChart(symbol){

document.getElementById("chart").innerHTML="";

new TradingView.widget({
container_id:"chart",
width:"100%",
height:280,
symbol:"BINANCE:"+symbol,
interval:"1",
theme:"dark",
style:"1",
locale:"fr",
hide_top_toolbar:true,
allow_symbol_change:false
});

}

/* ================= ANALYSE ================= */
async function analyze(){

const res = await fetch(`/api/${selected}/${time}`);
const data = await res.json();

let signal=document.getElementById("signal");
let strength=document.getElementById("strength");

signal.innerText=data.signal;
strength.innerText=(data.strength||0)+"%";

signal.className="signal " +
(data.signal==="BUY"?"buy":
data.signal==="SELL"?"sell":"wait");

setTimeout(()=>{
go("s5");
},2500);

}

/* ================= RESET ================= */
function restart(){
go("s1");
}

</script>

</body>
</html>
