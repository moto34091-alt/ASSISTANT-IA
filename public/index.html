<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI V15</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.app{
width:95%;
max-width:420px;
background:#0c1224;
padding:18px;
border-radius:20px;
}

h2{
text-align:center;
color:#00ff9d;
}

select{
width:100%;
padding:14px;
margin-top:10px;
background:#111a33;
color:white;
border:none;
border-radius:12px;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.analyze{
background:#00ff9d;
}

.auto{
background:#00c3ff;
}

.signal{
text-align:center;
font-size:65px;
margin-top:15px;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

.info{
text-align:center;
margin-top:10px;
color:#aaa;
}

.bar{
height:16px;
background:#1a1f35;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.fill{
height:100%;
width:50%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:0.4s;
}

.status{
text-align:center;
margin-top:10px;
color:#888;
font-size:13px;
}

</style>

</head>

<body>

<div class="app">

<h2>📊 SNIPER AI V15</h2>

<select id="market">
<option value="EURUSD">EUR/USD</option>
<option value="GBPUSD">GBP/USD</option>
<option value="USDJPY">USD/JPY</option>
<option value="USDCHF">USD/CHF</option>
<option value="USDCAD">USD/CAD</option>
<option value="XAUUSD">GOLD</option>
</select>

<button class="analyze" onclick="analyze()">
🔄 ANALYZE MARKET
</button>

<div id="signal" class="signal wait">WAIT</div>

<div class="info" id="score">SCORE: 0</div>
<div class="info" id="prob">PROB: 50%</div>

<div class="bar">
<div id="fill" class="fill"></div>
</div>

<div class="status" id="status">READY</div>

</div>

<script>

async function analyze(){

try{

const market = document.getElementById("market").value;

document.getElementById("status").innerText =
"ANALYZING...";

const res = await fetch(`/api/${market}`);

const data = await res.json();

/* SAFE UI */
document.getElementById("score").innerText =
"SCORE: " + (data.score ?? 0);

document.getElementById("prob").innerText =
"PROB: " + (data.probability ?? 50) + "%";

const signal = document.getElementById("signal");

if(data.signal === "BUY"){
signal.innerText = "🟢 BUY";
signal.className = "signal buy";
}

else if(data.signal === "SELL"){
signal.innerText = "🔴 SELL";
signal.className = "signal sell";
}

else{
signal.innerText = "🟡 WAIT";
signal.className = "signal wait";
}

document.getElementById("fill").style.width =
(data.probability ?? 50) + "%";

document.getElementById("status").innerText =
"READY ✔ " + new Date().toLocaleTimeString();

}catch(err){

document.getElementById("status").innerText =
"ERROR - SERVER";

console.log(err);

}

}

</script>

</body>

</html>
