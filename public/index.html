<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>SNIPER PRO V14</title>

<style>
body{
margin:0;
padding:0;
font-family: Arial Black;
background:#000;
color:white;
overflow:hidden;
}

/* ================= SCREENS ================= */
.screen{
display:none;
height:100vh;
width:100vw;
padding:20px;
box-sizing:border-box;
text-align:center;
}

.active{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
animation:fade 0.4s ease-in-out;
}

/* ================= ANIMATION ================= */
@keyframes fade{
from{opacity:0; transform:scale(0.95);}
to{opacity:1; transform:scale(1);}
}

/* ================= TITLE ================= */
h2{
font-size:22px;
margin-bottom:15px;
}

/* ================= BUTTONS ================= */
button{
width:90%;
padding:15px;
margin:6px;
border:none;
border-radius:15px;
background:linear-gradient(135deg,#1f6feb,#00aaff);
color:white;
font-size:16px;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,0.5);
transition:0.2s;
}

button:active{
transform:scale(0.96);
}

/* ================= LIST GRID ================= */
.list{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
width:100%;
}

/* ================= CARD RESULT ================= */
.card{
width:90%;
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:15px;
margin-top:15px;
backdrop-filter: blur(10px);
}

/* ================= BIG SIGNAL ================= */
.big{
font-size:30px;
font-weight:bold;
margin-bottom:10px;
}

/* ================= COLORS ================= */
.green{color:#00ff99;}
.red{color:#ff4d4d;}
.orange{color:#ffaa00;}

/* ================= SMALL TEXT ================= */
p{
margin:5px;
font-size:14px;
opacity:0.9;
}
</style>
</head>

<body>

<!-- ================= SCREEN 1 : MARKET ================= -->
<div id="s1" class="screen active">

<h2>📊 CHOISIS LE MARCHÉ</h2>

<div class="list">

<button onclick="setSymbol('EURUSD')">EUR/USD</button>
<button onclick="setSymbol('GBPUSD')">GBP/USD</button>
<button onclick="setSymbol('USDJPY')">USD/JPY</button>
<button onclick="setSymbol('USDCHF')">USD/CHF</button>
<button onclick="setSymbol('AUDUSD')">AUD/USD</button>
<button onclick="setSymbol('USDCAD')">USD/CAD</button>
<button onclick="setSymbol('NZDUSD')">NZD/USD</button>

<button onclick="setSymbol('EURJPY')">EUR/JPY</button>
<button onclick="setSymbol('GBPJPY')">GBP/JPY</button>
<button onclick="setSymbol('EURGBP')">EUR/GBP</button>
<button onclick="setSymbol('EURCHF')">EUR/CHF</button>
<button onclick="setSymbol('AUDJPY')">AUD/JPY</button>
<button onclick="setSymbol('AUDCAD')">AUD/CAD</button>
<button onclick="setSymbol('CADJPY')">CAD/JPY</button>
<button onclick="setSymbol('EURCAD')">EUR/CAD</button>

</div>

<p>⚡ Smart Trading Engine Active</p>

</div>

<!-- ================= SCREEN 2 : TIME ================= -->
<div id="s2" class="screen">

<h2>⏱ CHOISIS LE TIMEFRAME</h2>

<button onclick="setTime('30s')">30 SEC (FAST)</button>
<button onclick="setTime('1m')">1 MIN</button>
<button onclick="setTime('5m')">5 MIN</button>
<button onclick="setTime('15m')">15 MIN</button>

</div>

<!-- ================= SCREEN 3 : LOADING ================= -->
<div id="s3" class="screen">

<h2>⚡ ANALYSE EN COURS</h2>
<p>Smart Money Engine Running...</p>

</div>

<!-- ================= SCREEN 4 : RESULT ================= -->
<div id="s4" class="screen">

<h2>📊 RÉSULTAT</h2>

<div class="card">

<div id="signal" class="big"></div>
<div id="price"></div>
<div id="rsi"></div>
<div id="trend"></div>
<div id="strength"></div>

</div>

<button onclick="reset()">🔁 NOUVELLE ANALYSE</button>

</div>

<script src="app.js"></script>

</body>
</html>
