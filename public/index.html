<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Trader</title>

<style>

body{
margin:0;
padding:0;
background:#060b14;
color:white;
font-family:Arial,sans-serif;
}

header{
background:#111827;
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
color:#00ff99;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:15px;
}

.card{
background:#111827;
padding:20px;
border-radius:12px;
text-align:center;
}

.label{
font-size:14px;
color:#999;
margin-bottom:10px;
}

.value{
font-size:24px;
font-weight:bold;
}

.buy{
color:#00ff99;
}

.sell{
color:#ff4d6d;
}

.wait{
color:#facc15;
}

#status{
text-align:center;
padding:10px;
color:#00ff99;
}

canvas{
width:100%;
height:300px;
background:#0f172a;
display:block;
}

.telegram{
position:fixed;
bottom:20px;
right:20px;
background:#00ff99;
color:black;
padding:15px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
}

</style>
</head>

<body>

<header>
🚀 NEVER ZERO FIX PRO
</header>

<div id="status">
🔄 Connecting...
</div>

<canvas id="chart"></canvas>

<div class="grid">

<div class="card">
<div class="label">SIGNAL</div>
<div class="value wait" id="signal">WAIT</div>
</div>

<div class="card">
<div class="label">PRICE</div>
<div class="value" id="price">0</div>
</div>

<div class="card">
<div class="label">RSI</div>
<div class="value" id="rsi">0</div>
</div>

<div class="card">
<div class="label">EMA FAST</div>
<div class="value" id="emaF">0</div>
</div>

<div class="card">
<div class="label">EMA SLOW</div>
<div class="value" id="emaS">0</div>
</div>

<div class="card">
<div class="label">WIN RATE</div>
<div class="value" id="win">0%</div>
</div>

</div>

<a
class="telegram"
href="https://t.me/signalstradings_bot"
target="_blank"
>
📡 BOT
</a>

<script>

/* =========================
WEBSOCKET
========================= */

const protocol =
location.protocol === "https:"
? "wss://"
: "ws://";

const ws =
new WebSocket(protocol + location.host + "/");

/* =========================
STATUS
========================= */

const status =
document.getElementById("status");

ws.onopen = ()=>{

status.innerHTML =
"🟢 LIVE CONNECTED";

};

ws.onerror = ()=>{

status.innerHTML =
"🔴 WS ERROR";

};

ws.onclose = ()=>{

status.innerHTML =
"🟠 CONNECTION CLOSED";

};

/* =========================
CHART
========================= */

let chartData = [];

const canvas =
document.getElementById("chart");

const ctx =
canvas.getContext("2d");

function resize(){

canvas.width =
window.innerWidth;

canvas.height = 300;

}

resize();

window.addEventListener("resize",resize);

/* =========================
LIVE DATA
========================= */

ws.onmessage = (msg)=>{

const d =
JSON.parse(msg.data);

console.log(d);

if(!d || !d.price){
return;
}

/* SIGNAL */

const signal =
document.getElementById("signal");

signal.innerText =
d.signal;

signal.className =
"value " +
(d.signal==="BUY"
? "buy"
: d.signal==="SELL"
? "sell"
: "wait");

/* DATA */

document.getElementById("price")
.innerText =
Number(d.price).toFixed(2);

document.getElementById("rsi")
.innerText =
d.rsi;

document.getElementById("emaF")
.innerText =
d.emaFast;

document.getElementById("emaS")
.innerText =
d.emaSlow;

document.getElementById("win")
.innerText =
d.winRate + "%";

status.innerHTML =
"🟢 LIVE DATA RECEIVED";

/* =========================
CHART UPDATE
========================= */

chartData.push(d.price);

if(chartData.length > 60){
chartData.shift();
}

draw();

};

/* =========================
DRAW
========================= */

function draw(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

if(chartData.length < 2){
return;
}

let min =
Math.min(...chartData);

let max =
Math.max(...chartData);

ctx.beginPath();

for(let i=0;i<chartData.length;i++){

let x =
(i/(chartData.length-1))
* canvas.width;

let y =
canvas.height -
(
(chartData[i]-min)
/
(max-min || 1)
)
* canvas.height;

if(i===0){
ctx.moveTo(x,y);
}else{
ctx.lineTo(x,y);
}

}

ctx.strokeStyle =
"#00ff99";

ctx.lineWidth = 3;

ctx.stroke();

}

</script>

</body>
</html>
