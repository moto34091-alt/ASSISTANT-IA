<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D-FLAM SNIPER AI PRO</title>

<style>
body{
margin:0;
background:#050816;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.app{
width:100%;
max-width:420px;
background:#0c1224;
padding:15px;
border-radius:18px;
box-shadow:0 0 20px #000;
}

h1{
text-align:center;
color:#00ff9d;
font-size:22px;
}

select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:none;
font-weight:bold;
}

select{
background:#141d38;
color:white;
}

button{
background:#00ff9d;
color:black;
cursor:pointer;
}

.box{
margin-top:15px;
padding:12px;
background:#09101f;
border-radius:12px;
text-align:center;
}

.signal{
font-size:40px;
font-weight:bold;
margin-top:10px;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}
</style>
</head>

<body>

<div class="app">

<h1>🔥 SNIPER AI PRO</h1>

<select id="market">
<option>EURUSD</option>
<option>GBPUSD</option>
<option>USDJPY</option>
<option>BTCUSD</option>
<option>ETHUSD</option>
<option>XAUUSD</option>
</select>

<button onclick="analyze()">ANALYZE</button>

<div class="box">
<div id="signal" class="signal wait">WAIT</div>
<div id="price">PRICE: --</div>
<div id="rsi">RSI: --</div>
<div id="conf">CONFIDENCE: 0%</div>
</div>

</div>

<script>

const API = "/signal";

async function analyze(){

try{

document.getElementById("signal").innerText = "ANALYZING...";

const symbol = document.getElementById("market").value;

const res = await fetch(`${API}?symbol=${symbol}&tf=1min`);

const data = await res.json();

console.log("DATA:", data);

/* SAFE CHECK */
if(!data || data.price == null){
document.getElementById("signal").innerText = "NO DATA";
return;
}

/* SIGNAL */
const signalEl = document.getElementById("signal");
signalEl.innerText = data.signal;

signalEl.className =
"signal " + (data.signal === "BUY" ? "buy" :
data.signal === "SELL" ? "sell" : "wait");

/* DATA */
document.getElementById("price").innerText =
"PRICE: " + data.price;

document.getElementById("rsi").innerText =
"RSI: " + data.rsi;

document.getElementById("conf").innerText =
"CONFIDENCE: " + data.confidence + "%";

}catch(err){

console.log(err);
document.getElementById("signal").innerText = "ERROR";

}

}

</script>

</body>
</html>
