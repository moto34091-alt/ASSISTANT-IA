<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI PRO</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* APP */
.app{
width:95%;
max-width:420px;
background:#0c1224;
border-radius:20px;
padding:15px;
box-shadow:0 0 20px #00ff9d22;
}

/* TITLE */
h2{
text-align:center;
color:#00ff9d;
}

/* BUTTON */
button{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#00ff9d;
color:black;
font-weight:bold;
margin-top:10px;
cursor:pointer;
}

/* SIGNAL */
.signal{
font-size:55px;
text-align:center;
margin:15px 0;
font-weight:bold;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

/* SCORE */
.info{
text-align:center;
font-size:18px;
margin:5px 0;
color:#aaa;
}

/* BAR */
.bar{
width:100%;
height:6px;
background:#1a1f35;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:0.5s;
}

</style>

</head>

<body>

<div class="app">

<h2>📊 SNIPER AI PRO</h2>

<button onclick="analyze()">🔄 NOUVELLE ANALYSE</button>

<div id="signal" class="signal wait">WAIT</div>

<div id="score" class="info">SCORE: 0</div>
<div id="prob" class="info">PROB: 0%</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

</div>

<script>

let symbol = "BTCUSD";
let tf = "1m";

/* ================= ANALYZE ================= */
async function analyze(){

try{

const res = await fetch(`/api/analyze/${symbol}/${tf}`);
const data = await res.json();

/* SIGNAL */
const signal = document.getElementById("signal");
const score = document.getElementById("score");
const prob = document.getElementById("prob");

/* BUY / SELL */
if(data.signal === "BUY"){
signal.innerText = "🟢 BUY";
signal.className = "signal buy";
}

else if(data.signal === "SELL"){
signal.innerText = "🔴 SELL";
signal.className = "signal sell";
}

else{
signal.innerText = "🟡 WAIT";
signal.className = "signal wait";
}

/* SCORE */
score.innerText = "SCORE: " + (data.score || 0);

/* PROBABILITY */
prob.innerText = "PROB: " + (data.probability || 0) + "%";

/* BAR */
document.getElementById("fill").style.width =
(data.probability || 0) + "%";

}catch(err){
console.log(err);
}

}

</script>

</body>
</html>
