<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI PRO V6</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.app{
width:95%;
max-width:420px;
background:#0c1224;
border-radius:20px;
padding:15px;
box-shadow:0 0 25px #00ff9d22;
}

.top{
display:flex;
gap:8px;
margin-bottom:10px;
}

select{
flex:1;
padding:10px;
border-radius:10px;
background:#111a33;
color:white;
border:none;
}

h2{
text-align:center;
color:#00ff9d;
}

/* BUTTON */
button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#00ff9d;
color:black;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:active{
transform:scale(0.96);
}

/* SIGNAL */
.signal{
font-size:60px;
text-align:center;
margin:15px 0;
font-weight:bold;
transition:0.3s;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

/* INFO */
.info{
text-align:center;
color:#aaa;
margin:5px 0;
font-size:18px;
}

/* BARRE AGRANDIE */
.bar{
width:100%;
height:10px;
background:#1a1f35;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:1s linear;
}

/* TIMER */
.timer{
text-align:center;
margin-top:10px;
color:#aaa;
}

</style>

</head>

<body>

<div class="app">

<h2>📊 SNIPER AI PRO V6</h2>

<div class="top">

<select id="market">
<option value="BTCUSD">BTCUSD</option>
<option value="ETHUSD">ETHUSD</option>
<option value="EURUSD">EURUSD</option>
<option value="XAUUSD">GOLD</option>
</select>

<select id="time">
<option value="60">1 MIN</option>
<option value="300">5 MIN</option>
<option value="900">15 MIN</option>
</select>

</div>

<button onclick="analyze()">🔄 ANALYZE SIGNAL</button>

<div id="signal" class="signal wait">WAIT</div>

<div class="info" id="score">SCORE: 0</div>
<div class="info" id="prob">PROB: 0%</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="timer" id="timer">READY</div>

</div>

<script>

let market="BTCUSD";
let tf=60;

/* LOCK SYSTEM */
let lockedSignal=null;
let lockedProb=0;
let lockedTime=0;
let interval;

/* OPTIONS */
document.getElementById("market").onchange=(e)=>{
market=e.target.value;
}

document.getElementById("time").onchange=(e)=>{
tf=parseInt(e.target.value);
}

/* ANALYZE */
async function analyze(){

const res = await fetch(`/api/analyze/${market}/1m`);
const data = await res.json();

/* LOCK SIGNAL */
if(!lockedSignal){

lockedSignal = data.signal;

/* PROBABILITY INTELLIGENTE */
lockedProb = Math.min(95, Math.abs(data.score) + 40);

/* TIME INTELLIGENT */
if(lockedProb >= 75) lockedTime = 60;
else if(lockedProb >= 50) lockedTime = 30;
else lockedTime = 15;

}

/* DISPLAY */
const signal=document.getElementById("signal");
const score=document.getElementById("score");
const prob=document.getElementById("prob");

if(lockedSignal==="BUY"){
signal.innerText="🟢 BUY";
signal.className="signal buy";
}
else if(lockedSignal==="SELL"){
signal.innerText="🔴 SELL";
signal.className="signal sell";
}
else{
signal.innerText="🟡 WAIT";
signal.className="signal wait";
}

/* SCORE */
score.innerText="SCORE: "+data.score;

/* PROB */
prob.innerText="PROB: "+lockedProb+"%";

/* TIMER */
clearInterval(interval);

let t=lockedTime;

interval=setInterval(()=>{

t--;

/* BAR PROGRESS */
document.getElementById("fill").style.width =
(t/lockedTime)*100 + "%";

document.getElementById("timer").innerText =
"VALIDITY: " + t + "s";

if(t<=0){
clearInterval(interval);

lockedSignal=null;
lockedProb=0;
lockedTime=0;

document.getElementById("timer").innerText =
"EXPIRED - READY NEW SIGNAL";

document.getElementById("fill").style.width="0%";
}

},1000);

}

</script>

</body>
</html>
