<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>SNIPER AI PRO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
overflow-x:hidden;
}

.app{
width:100%;
max-width:430px;
background:#0c1224;
border-radius:25px;
padding:18px;
border:1px solid #1f2b4d;
box-shadow:
0 0 25px #00ff9d22,
0 0 80px #000 inset;
position:relative;
}

/* TOP */

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.live{
color:#00ff9d;
font-size:13px;
font-weight:bold;
}

.clock{
font-size:13px;
color:#ccc;
}

/* TITLE */

h1{
text-align:center;
font-size:28px;
margin-bottom:18px;
color:#00ff9d;
text-shadow:0 0 15px #00ff9d55;
}

/* SELECT */

label{
font-size:13px;
color:#8fa3d1;
margin-bottom:6px;
display:block;
margin-top:12px;
}

select{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:15px;
background:#121d38;
color:white;
font-size:15px;
font-weight:bold;
}

/* BUTTONS */

.buttons{
display:flex;
gap:10px;
margin-top:15px;
}

button{
flex:1;
padding:14px;
border:none;
border-radius:15px;
font-size:15px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

.analyze{
background:#00ff9d;
color:black;
}

.auto{
background:#1d2d52;
color:white;
border:1px solid #324b7c;
}

button:active{
transform:scale(0.96);
}

/* SIGNAL BOX */

.signalBox{
margin-top:18px;
background:#111827;
border-radius:25px;
padding:20px;
border:1px solid #1d2d52;
}

/* ICON */

.icon{
font-size:75px;
text-align:center;
}

/* SIGNAL */

.signal{
font-size:55px;
font-weight:bold;
text-align:center;
margin-top:5px;
}

.buy{
color:#00ff9d;
text-shadow:0 0 20px #00ff9d;
}

.sell{
color:#ff3b5c;
text-shadow:0 0 20px #ff3b5c;
}

.wait{
color:#facc15;
text-shadow:0 0 20px #facc15;
}

/* ENTRY */

.entry{
margin-top:10px;
text-align:center;
font-size:15px;
font-weight:bold;
color:#00ff9d;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
}

.card{
background:#141f3a;
padding:12px;
border-radius:16px;
text-align:center;
}

.cardTitle{
font-size:12px;
color:#aaa;
margin-bottom:5px;
}

.cardValue{
font-size:18px;
font-weight:bold;
}

/* BAR */

.bar{
width:100%;
height:12px;
background:#1d2746;
border-radius:20px;
overflow:hidden;
margin-top:18px;
}

.fill{
height:100%;
width:100%;
background:
linear-gradient(
90deg,
#00ff9d,
#00c3ff
);
transition:width 1s linear;
}

/* TIMER */

.timer{
text-align:center;
margin-top:10px;
font-size:14px;
color:#ccc;
display:none;
}

/* FLOAT */

.float{
position:fixed;
bottom:20px;
right:20px;
background:#00ff9d;
color:black;
padding:12px 18px;
border-radius:50px;
font-weight:bold;
text-decoration:none;
box-shadow:0 0 20px #00ff9d66;
z-index:999;
}

/* FOOTER */

.footer{
margin-top:18px;
text-align:center;
font-size:12px;
color:#62708d;
}

</style>
</head>

<body>

<div class="app">

<div class="top">

<div class="live">
🟢 LIVE MARKET
</div>

<div class="clock" id="clock">
00:00:00
</div>

</div>

<h1>SNIPER AI PRO</h1>

<!-- MARKET -->

<label>MARKET</label>

<select id="market">

<!-- OTC -->

<option>EUR/USD OTC</option>
<option>GBP/USD OTC</option>
<option>USD/JPY OTC</option>
<option>USD/CHF OTC</option>
<option>USD/CAD OTC</option>
<option>AUD/USD OTC</option>
<option>EUR/JPY OTC</option>
<option>GBP/JPY OTC</option>
<option>NZD/USD OTC</option>
<option>EUR/GBP OTC</option>

<!-- FOREX / CRYPTO -->

<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>USD/CHF</option>
<option>XAU/USD</option>
<option>BTC/USD</option>
<option>ETH/USD</option>
<option>SOL/USD</option>
<option>XRP/USD</option>
<option>BNB/USD</option>

</select>

<!-- TIMEFRAME -->

<label>TIMEFRAME</label>

<select id="tf">

<option value="1min">1 MINUTE</option>
<option value="5min">5 MINUTES</option>
<option value="15min">15 MINUTES</option>

</select>

<!-- BUTTONS -->

<div class="buttons">

<button class="analyze"
onclick="analyze()">
ANALYZE
</button>

<button class="auto"
onclick="toggleAuto()"
id="autoBtn">
AUTO
</button>

</div>

<!-- SIGNAL -->

<div class="signalBox">

<div class="icon"
id="icon">
🟡
</div>

<div class="signal wait"
id="signal">
WAIT
</div>

<div class="entry"
id="entry">
ENTRY: WAIT MARKET
</div>

<div class="grid">

<div class="card">
<div class="cardTitle">
CONFIDENCE
</div>

<div class="cardValue"
id="confidence">
0%
</div>
</div>

<div class="card">
<div class="cardTitle">
RSI
</div>

<div class="cardValue"
id="rsi">
0
</div>
</div>

<div class="card">
<div class="cardTitle">
MACD
</div>

<div class="cardValue"
id="macd">
WAIT
</div>
</div>

<div class="card">
<div class="cardTitle">
QUALITY
</div>

<div class="cardValue"
id="quality">
LOW
</div>
</div>

</div>

<div class="bar">
<div class="fill"
id="fill"></div>
</div>

<div class="timer"
id="timer">
READY
</div>

</div>

<div class="footer">
SMART MONEY CONCEPT ENGINE
</div>

</div>

<!-- FLOAT -->

<a class="float"
href="https://t.me/Mr_dflam"
target="_blank">

@Mr_dflam

</a>

<script>

/* CLOCK */

function updateClock(){

document.getElementById("clock")
.innerText =
new Date().toLocaleTimeString();

}

setInterval(updateClock,1000);
updateClock();

/* AUTO */

let auto = null;

/* ANALYZE */

async function analyze(){

const symbol =
document.getElementById("market").value;

const tf =
document.getElementById("tf").value;

document.getElementById("signal")
.innerText = "ANALYZING...";

document.getElementById("signal")
.className = "signal wait";

try{

const res = await fetch(
`/signal?symbol=${symbol}&tf=${tf}`
);

const data = await res.json();

applySignal(data);

}catch(err){

document.getElementById("signal")
.innerText = "ERROR";

}

}

/* APPLY */

function applySignal(data){

const signal =
document.getElementById("signal");

const icon =
document.getElementById("icon");

if(data.signal === "BUY"){

signal.innerText = "BUY";
signal.className = "signal buy";
icon.innerText = "🟢";

}

else if(data.signal === "SELL"){

signal.innerText = "SELL";
signal.className = "signal sell";
icon.innerText = "🔴";

}

else{

signal.innerText = "WAIT";
signal.className = "signal wait";
icon.innerText = "🟡";

}

document.getElementById("entry")
.innerText =
"ENTRY: " + data.signal;

document.getElementById("confidence")
.innerText =
(data.confidence || 0) + "%";

document.getElementById("rsi")
.innerText =
Math.round(data.rsi || 0);

document.getElementById("macd")
.innerText =
data.macd ? "BULLISH" : "BEARISH";

document.getElementById("quality")
.innerText =
data.quality || "LOW";

startTimer();

}

/* TIMER */

function startTimer(){

const timer =
document.getElementById("timer");

timer.style.display = "block";

let sec = 60;

const interval = setInterval(()=>{

sec--;

document.getElementById("fill")
.style.width =
(sec / 60 * 100) + "%";

timer.innerText =
"NEXT SIGNAL : " + sec + " SEC";

if(sec <= 0){

clearInterval(interval);

timer.style.display = "none";

}

},1000);

}

/* AUTO MODE */

function toggleAuto(){

const btn =
document.getElementById("autoBtn");

if(auto){

clearInterval(auto);

auto = null;

btn.innerText = "AUTO";

return;

}

btn.innerText = "AUTO ON";

auto = setInterval(()=>{

analyze();

},10000);

}

</script>

</body>
</html>
