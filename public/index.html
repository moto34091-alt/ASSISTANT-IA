<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>D-FLAM APP</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050816;
color:white;
height:100vh;
overflow:hidden;
}

/* APP */
.app{
display:flex;
flex-direction:column;
height:100vh;
width:100%;
}

/* TOP BAR APP */
.topbar{
background:#0c1224;
padding:12px;
text-align:center;
font-weight:bold;
color:#00ff9d;
box-shadow:0 0 10px #00ff9d22;
}

/* CONTENT */
.content{
flex:1;
overflow:auto;
padding:15px;
}

/* SELECT */
select{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:none;
background:#121d38;
color:white;
font-weight:bold;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:none;
background:#00ff9d;
font-weight:bold;
color:black;
}

/* SIGNAL CARD */
.signalBox{
margin-top:15px;
background:#0c1224;
padding:18px;
border-radius:15px;
text-align:center;
box-shadow:0 0 12px #00ff9d22;
}

.icon{
font-size:60px;
}

.signal{
font-size:38px;
font-weight:bold;
margin-top:5px;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

/* CARDS */
.card{
background:#0c1224;
padding:12px;
border-radius:12px;
margin-top:10px;
text-align:center;
}

/* ENTRY + PRICE */
.entry{color:#00ff9d;font-weight:bold;}
.price{color:#aaa;}

/* BAR */
.bar{
height:10px;
background:#1d2746;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
}

/* TIMER */
.timer{
text-align:center;
margin-top:10px;
font-size:14px;
display:none;
}
</style>
</head>

<body>

<div class="app">

<div class="topbar">📊 SNIPER AI PRO V2</div>

<div class="content">

<select id="market">
<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>EUR/JPY</option>
<option>USD/CHF</option>
<option>AUD/USD</option>
<option>USD/CAD</option>
<option>EUR/GBP</option>
<option>GBP/JPY</option>
<option>EUR/AUD</option>
<option>EUR/CAD</option>
<option>GBP/CHF</option>
<option>CHF/JPY</option>
<option>AUD/JPY</option>
<option>NZD/USD</option>
<option>BTC/USD</option>
<option>ETH/USD</option>
<option>US30</option>
<option>NAS100</option>
<option>XAU/USD</option>
</select>

<select id="time">
<option value="60">1 MIN</option>
<option value="300">5 MIN</option>
<option value="900">15 MIN</option>
</select>

<button onclick="analyze()">ANALYZE</button>
<button onclick="autoMode()">AUTO MODE</button>

<div class="signalBox">
<div id="icon" class="icon">🟡</div>
<div id="signal" class="signal wait">WAIT</div>
<div id="timer" class="timer">READY</div>
</div>

<div class="card entry" id="entry">ENTRY POINT: -</div>
<div class="card price" id="price">PRICE: --</div>

<div class="card" id="score">SCORE: 0</div>
<div class="card" id="prob">PROB: 0%</div>
<div class="card" id="winrate">WINRATE: 0%</div>

<div class="bar"><div id="fill" class="fill"></div></div>

</div>
</div>

<script>

let lock=false;
let interval=null;
let timer=null;

let lastKey="";
let lastData=null;

/* PRICE */
function getPrice(m){
let base=1+Math.random()*100;
if(m.includes("JPY"))base=100+Math.random()*50;
if(m.includes("BTC"))base=60000+Math.random()*2000;
if(m.includes("XAU"))base=2300+Math.random()*50;
return base.toFixed(2);
}

/* IA */
function ai(){

let rsi=Math.random()*100;
let trend=Math.random()*2-1;
let volume=Math.random()*100;

let rsiS=rsi<30?1:rsi>70?-1:0;
let trendS=trend>0.25?1:trend<-0.25?-1:0;
let volS=volume>65?1:volume<35?-1:0;

let confirm=rsiS+trendS;

let score=(rsiS*0.5)+(trendS*0.4)+(volS*0.1);

let signal="WAIT";
if(confirm>=2 && score>0.35) signal="BUY";
else if(confirm<=-2 && score<-0.35) signal="SELL";

let prob=Math.min(100,Math.floor(Math.abs(score)*100+55));
let winrate=signal=="WAIT"?50:65+Math.random()*20;

let entry=signal=="BUY"?"BUY ZONE 🔼":signal=="SELL"?"SELL ZONE 🔽":"-";

return {score,signal,prob,winrate,entry};
}

/* ANALYZE */
function analyze(){

let m=document.getElementById("market").value;
let t=document.getElementById("time").value;
let key=m+t;

if(lock && key===lastKey){
apply(lastData,m);
return;
}

if(lock && key!==lastKey) return;

lock=true;
lastKey=key;

document.getElementById("signal").innerText="ANALYZING...";
document.getElementById("icon").innerText="🧠";

setTimeout(()=>{

let d=ai();
lastData=d;

apply(d,m);
startTimer(t,d.signal);

},900);
}

/* APPLY */
function apply(d,m){

let icon=document.getElementById("icon");
let s=document.getElementById("signal");

if(d.signal=="BUY"){
icon.innerText="🟢";s.innerText="BUY";s.className="signal buy";
}
else if(d.signal=="SELL"){
icon.innerText="🔴";s.innerText="SELL";s.className="signal sell";
}
else{
icon.innerText="🟡";s.innerText="WAIT";s.className="signal wait";
}

document.getElementById("entry").innerText="ENTRY POINT: "+d.entry;
document.getElementById("price").innerText="PRICE: "+getPrice(m);
document.getElementById("score").innerText="SCORE: "+d.score.toFixed(2);
document.getElementById("prob").innerText="PROB: "+d.prob+"%";
document.getElementById("winrate").innerText="WINRATE: "+d.winrate.toFixed(1)+"%";

/* TIMER SHOW ONLY SIGNAL */
document.getElementById("timer").style.display =
d.signal=="WAIT" ? "none" : "block";
}

/* TIMER */
function startTimer(sec,signal){

clearInterval(timer);
if(signal=="WAIT") return;

let r=sec;
timer=setInterval(()=>{

r--;
document.getElementById("fill").style.width=(r/sec*100)+"%";
document.getElementById("timer").innerText=r+" SEC";

if(r<=0){
clearInterval(timer);
lock=false;
document.getElementById("timer").style.display="none";
}

},1000);
}

/* AUTO */
function autoMode(){

if(interval){
clearInterval(interval);
interval=null;
return;
}

interval=setInterval(()=>{
if(!lock)analyze();
},3000);
}

</script>

</body>
</html>
