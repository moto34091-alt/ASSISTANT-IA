<!-- 🔥 ANALYZE BUTTON -->
<button id="analyzeBtn" onclick="analyze()">
<div class="loader" id="loader"></div>
<span id="btnText">🔄 ANALYZE MARKET</span>
</button>

<!-- SIGNAL -->
<div id="signal" class="signal wait">WAIT</div>

<!-- SCORE -->
<div class="info" id="score">SCORE: 0</div>

<!-- PROB -->
<div class="info" id="prob">PROB: 0%</div>

<!-- ENTRY STATUS -->
<div class="entry-status" id="entryStatus">
WAIT SIGNAL...
</div>

<!-- EXPIRY BAR -->
<div class="expiry-box" id="expiryBox" style="display:none;">

<div class="expiry-header">
⏳ ENTRY WINDOW
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="expiry-text" id="expiryText">
GOOD ENTRY
</div>

</div>

<style>

/* 🔥 ANALYZE BUTTON */
#analyzeBtn{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:14px;
background:#00ff9d;
color:black;
font-weight:bold;
font-size:16px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
transition:0.3s;
}

#analyzeBtn:active{
transform:scale(0.96);
}

/* LOADER */
.loader{
width:18px;
height:18px;
border:3px solid #00000044;
border-top:3px solid black;
border-radius:50%;
display:none;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

/* ENTRY STATUS */
.entry-status{
text-align:center;
margin-top:10px;
font-size:14px;
color:#00ff9d;
}

/* EXPIRY */
.expiry-box{
margin-top:15px;
}

.expiry-header{
font-size:13px;
color:#aaa;
margin-bottom:6px;
text-align:center;
}

.bar{
width:100%;
height:14px;
background:#1a1f35;
border-radius:20px;
overflow:hidden;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:1s linear;
}

.expiry-text{
text-align:center;
margin-top:8px;
font-size:14px;
font-weight:bold;
}

.good{
color:#00ff9d;
}

.mid{
color:#facc15;
}

.bad{
color:#ff3b5c;
}

</style>

<script>

let expiryInterval;

/* 🔥 ANALYZE */
async function analyze(){

const btn=document.getElementById("analyzeBtn");
const loader=document.getElementById("loader");
const btnText=document.getElementById("btnText");

loader.style.display="block";
btnText.innerText="ANALYZING...";

btn.disabled=true;

/* API */
const market=document.getElementById("market").value;

const res = await fetch(`/api/analyze/${market}/1m`);
const data = await res.json();

loader.style.display="none";
btnText.innerText="🔄 ANALYZE MARKET";

btn.disabled=false;

/* SIGNAL */
const signal=document.getElementById("signal");

if(data.signal==="BUY"){
signal.innerText="🟢 BUY";
signal.className="signal buy";
playSound();
vibrate();
}

else if(data.signal==="SELL"){
signal.innerText="🔴 SELL";
signal.className="signal sell";
playSound();
vibrate();
}

else{
signal.innerText="🟡 WAIT";
signal.className="signal wait";
}

/* SCORE */
document.getElementById("score").innerText =
"SCORE: " + data.score;

/* PROB */
document.getElementById("prob").innerText =
"PROB: " + data.probability + "%";

/* 🔥 FILTER */
if(data.probability < 70){

document.getElementById("entryStatus").innerText =
"❌ LOW PROBABILITY";

document.getElementById("expiryBox").style.display="none";

return;
}

/* ENTRY READY */
document.getElementById("entryStatus").innerText =
"✅ GOOD ENTRY FOUND";

/* START EXPIRY */
startExpiry(60);

}

/* ⏳ EXPIRY */
function startExpiry(seconds){

clearInterval(expiryInterval);

const box=document.getElementById("expiryBox");
box.style.display="block";

let time=seconds;

expiryInterval=setInterval(()=>{

time--;

const percent=(time/seconds)*100;

document.getElementById("fill").style.width =
percent + "%";

/* STATUS */
if(percent > 70){

document.getElementById("expiryText").innerHTML =
"🟢 PERFECT ENTRY";

document.getElementById("expiryText").className =
"expiry-text good";

}

else if(percent > 40){

document.getElementById("expiryText").innerHTML =
"🟡 ENTRY STILL POSSIBLE";

document.getElementById("expiryText").className =
"expiry-text mid";

}

else{

document.getElementById("expiryText").innerHTML =
"🔴 TOO LATE";

document.getElementById("expiryText").className =
"expiry-text bad";

}

if(time <= 0){

clearInterval(expiryInterval);

document.getElementById("expiryText").innerHTML =
"⌛ SIGNAL EXPIRED";

document.getElementById("fill").style.width="0%";

}

},1000);

}

/* 🔊 SOUND */
function playSound(){
let audio=new Audio(
"https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
);
audio.play();
}

/* 📳 VIBRATION */
function vibrate(){
if(navigator.vibrate){
navigator.vibrate([200,100,200]);
}
}

</script>
