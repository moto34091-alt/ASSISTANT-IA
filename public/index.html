<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D-FLAM SIGNAL BOT V2</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#070b18;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:10px;
}

/* CONTAINER */
.app{
width:100%;
max-width:430px;
background:#0e142a;
border-radius:22px;
padding:16px;
border:1px solid #1d2b4d;
box-shadow:0 0 40px #00ff9d10;
}

/* HEADER */
.top{
display:flex;
justify-content:space-between;
font-size:13px;
}

.live{color:#00ff9d;font-weight:bold}
.clock{color:#aaa}

/* TITLE */
h2{
text-align:center;
margin:10px 0;
color:#00ff9d;
text-shadow:0 0 20px #00ff9d55;
letter-spacing:1px;
}

/* SELECT */
select{
width:100%;
padding:12px;
margin-top:8px;
border-radius:12px;
border:none;
background:#121a33;
color:white;
font-weight:bold;
}

/* BUTTONS */
button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

/* ANALYZE */
.analyze{
background:#00ff9d;
color:black;
box-shadow:0 0 15px #00ff9d55;
}

.analyze:active{
transform:scale(0.97);
}

/* AUTO */
.auto{
background:#1d2b4d;
color:white;
}

/* SIGNAL PANEL */
.panel{
margin-top:15px;
background:#0b1022;
border-radius:18px;
padding:16px;
text-align:center;
border:1px solid #1c2a4a;
}

/* SIGNAL */
.signal{
font-size:52px;
font-weight:bold;
transition:0.3s;
}

/* BUY */
.buy{
color:#00ff9d;
animation:pop 0.8s infinite;
text-shadow:0 0 25px #00ff9d;
}

/* SELL */
.sell{
color:#ff3b5c;
animation:pop 0.8s infinite;
text-shadow:0 0 25px #ff3b5c;
}

/* WAIT */
.wait{
color:#facc15;
}

@keyframes pop{
0%{transform:scale(1)}
50%{transform:scale(1.08)}
100%{transform:scale(1)}
}

/* INFO */
.info{
margin-top:10px;
color:#bbb;
font-size:13px;
}

.price{
margin-top:5px;
color:#fff;
}

/* CHART */
canvas{
width:100%;
height:140px;
margin-top:12px;
background:#0a1020;
border-radius:14px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:12px;
}

.card{
background:#121a33;
padding:10px;
border-radius:12px;
text-align:center;
}

.cardTitle{font-size:11px;color:#888}
.cardValue{font-size:16px;font-weight:bold}

/* ALERT FLASH */
.flash-buy{
animation:flashGreen 0.6s 3;
}

.flash-sell{
animation:flashRed 0.6s 3;
}

@keyframes flashGreen{
0%{background:#0e142a}
50%{background:#003d2a}
100%{background:#0e142a}
}

@keyframes flashRed{
0%{background:#0e142a}
50%{background:#3d0000}
100%{background:#0e142a}
}

.footer{
text-align:center;
margin-top:10px;
font-size:11px;
color:#5e6781;
}

</style>
</head>

<body>

<div class="app">

<div class="top">
<div class="live">🟢 LIVE MARKET</div>
<div class="clock" id="clock"></div>
</div>

<h2>D-FLAM SIGNAL BOT V2</h2>

<select id="market">
<option>EURUSD</option>
<option>GBPUSD</option>
<option>BTCUSD</option>
<option>XAUUSD</option>
<option>USDJPY</option>
<option>EURJPY</option>
<option>GBPJPY</option>
<option>AUDUSD</option>
<option>USDCHF</option>
<option>USDCAD</option>
</select>

<select id="tf">
<option>1min</option>
<option>5min</option>
<option>15min</option>
</select>

<button class="analyze" onclick="analyze()">ANALYZE</button>
<button class="auto" onclick="toggleAuto()">AUTO ANALYZE</button>

<div class="panel" id="panel">

<div class="signal wait" id="signal">WAIT</div>

<div class="info" id="price">PRICE: --</div>

<canvas id="chart"></canvas>

<div class="grid">

<div class="card">
<div class="cardTitle">CONF</div>
<div class="cardValue" id="conf">0%</div>
</div>

<div class="card">
<div class="cardTitle">RSI</div>
<div class="cardValue" id="rsi">50</div>
</div>

<div class="card">
<div class="cardTitle">STRUCT</div>
<div class="cardValue" id="structure">NEUTRAL</div>
</div>

<div class="card">
<div class="cardTitle">QUALITY</div>
<div class="cardValue" id="quality">LOW</div>
</div>

</div>

</div>

<div class="footer">INSTITUTIONAL TRADING UI V2</div>

</div>

<script>

setInterval(()=>{
document.getElementById("clock").innerText =
new Date().toLocaleTimeString();
},1000);

let auto=false;
let loop;

/* MINI CHART */
function drawChart(){

const c = document.getElementById("chart");
const ctx = c.getContext("2d");

ctx.clearRect(0,0,400,140);

let x=10;

for(let i=0;i<20;i++){

let h=Math.random()*120;

ctx.fillStyle="#00ff9d";
ctx.fillRect(x,140-h,8,h);

x+=18;

}

}

/* AUTO */
function toggleAuto(){

auto=!auto;

if(auto){
loop=setInterval(analyze,1500);
}else{
clearInterval(loop);
}

}

/* ANALYZE */
async function analyze(){

const res = await fetch(`/signal?symbol=${market.value}&tf=${tf.value}`);
const data = await res.json();

/* SIGNAL */
signal.innerText = data.signal || "WAIT";
signal.className =
data.signal==="BUY"?"signal buy":
data.signal==="SELL"?"signal sell":"signal wait";

/* FLASH */
panel.classList.remove("flash-buy","flash-sell");

if(data.signal==="BUY") panel.classList.add("flash-buy");
if(data.signal==="SELL") panel.classList.add("flash-sell");

/* DATA */
price.innerText = "PRICE: " + (data.price ?? "--");
conf.innerText = (data.confidence ?? 0) + "%";
rsi.innerText = data.rsi ?? "50";
structure.innerText = data.structure ?? "NEUTRAL";
quality.innerText = data.quality ?? "LOW";

drawChart();

}

</script>

</body>
</html>
