<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SNIPER PRO v7 REAL</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
}

header{
padding:15px;
text-align:center;
background:#0b1220;
border-bottom:1px solid #00ff9d33;
}

header h1{
color:#00ff9d;
font-size:22px;
}

.container{
padding:10px;
}

select{
width:48%;
padding:10px;
margin:5px;
background:#0f172a;
color:white;
border:none;
border-radius:10px;
}

#status{
text-align:center;
padding:10px;
color:#00ff9d;
font-weight:bold;
}

.signal{
text-align:center;
font-size:50px;
font-weight:bold;
margin:15px 0;
}

.buy{ color:#00ff9d; }
.sell{ color:#ff3b5c; }
.wait{ color:#facc15; }

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:10px;
}

.card{
background:#0c1224;
padding:15px;
border-radius:12px;
border:1px solid #00ff9d22;
text-align:center;
}

.label{
font-size:12px;
color:#888;
}

.value{
font-size:20px;
margin-top:5px;
}

#chart{
height:300px;
margin:10px;
border-radius:10px;
overflow:hidden;
}

</style>
</head>

<body>

<header>
<h1>🚀 SNIPER PRO v7</h1>
</header>

<div class="container">

<select id="symbol">
<option value="BTCUSDT">BTC/USDT</option>
<option value="ETHUSDT">ETH/USDT</option>
<option value="SOLUSDT">SOL/USDT</option>
<option value="BNBUSDT">BNB/USDT</option>
<option value="XRPUSDT">XRP/USDT</option>
<option value="DOGEUSDT">DOGE/USDT</option>
</select>

<select id="interval">
<option value="1m">1 MIN</option>
<option value="5m">5 MIN</option>
<option value="15m">15 MIN</option>
<option value="1h">1 HOUR</option>
</select>

</div>

<div id="status">🟡 CONNECTING...</div>

<div id="signal" class="signal wait">WAIT</div>

<div id="chart"></div>

<div class="grid">

<div class="card">
<div class="label">PRICE</div>
<div class="value" id="price">0</div>
</div>

<div class="card">
<div class="label">RSI</div>
<div class="value" id="rsi">0</div>
</div>

<div class="card">
<div class="label">EMA FAST</div>
<div class="value" id="emaFast">0</div>
</div>

<div class="card">
<div class="label">EMA SLOW</div>
<div class="value" id="emaSlow">0</div>
</div>

</div>

<script>

const ws = new WebSocket(
(location.protocol === "https:" ? "wss://" : "ws://") + location.host
);

const symbol = document.getElementById("symbol");
const interval = document.getElementById("interval");

const signal = document.getElementById("signal");
const status = document.getElementById("status");

function loadChart(){
document.getElementById("chart").innerHTML = "";

new TradingView.widget({
container_id: "chart",
symbol: "BINANCE:" + symbol.value,
interval: interval.value,
theme: "dark",
style: "1",
locale: "fr",
autosize: true
});
}

loadChart();

/* SEND REQUEST */
function send(){
ws.send(JSON.stringify({
symbol: symbol.value,
interval: interval.value
}));
}

/* CHANGE EVENTS */
symbol.onchange = () => {
loadChart();
send();
};

interval.onchange = () => {
loadChart();
send();
};

/* WS CONNECT */
ws.onopen = () => {
status.innerText = "🟢 LIVE CONNECTED";
send();
};

/* DATA RECEIVE */
ws.onmessage = (msg) => {

const d = JSON.parse(msg.data);

/* SIGNAL */
signal.innerText = d.signal;

signal.className =
"signal " +
(d.signal === "BUY"
? "buy"
: d.signal === "SELL"
? "sell"
: "wait");

/* DATA */
document.getElementById("price").innerText = d.price || 0;
document.getElementById("rsi").innerText = d.rsi || 0;
document.getElementById("emaFast").innerText = d.emaFast || 0;
document.getElementById("emaSlow").innerText = d.emaSlow || 0;

};

/* ERROR */
ws.onerror = () => {
status.innerText = "🔴 CONNECTION ERROR";
};

</script>

</body>
</html>
