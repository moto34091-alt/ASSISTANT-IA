<script>

/* =========================
   SAFE WEBSOCKET
========================= */

const protocol =
location.protocol === "https:"
? "wss://"
: "ws://";

/* FINAL FIX */

const ws = new WebSocket(
protocol + location.host + "/"
);

/* =========================
   STATUS
========================= */

const statusEl =
document.getElementById("status");

ws.onopen = ()=>{

console.log("✅ WS CONNECTED");

console.log("CONNECTED TO:", ws.url);

statusEl.innerHTML =
"🟢 LIVE CONNECTED";

};

ws.onerror = (e)=>{

console.log("❌ WS ERROR", e);

statusEl.innerHTML =
"🔴 CONNECTION ERROR";

};

ws.onclose = ()=>{

console.log("⚠️ WS CLOSED");

statusEl.innerHTML =
"🟠 CONNECTION CLOSED";

};

/* =========================
   CHART DATA
========================= */

let chartData = [];

/* =========================
   LIVE DATA
========================= */

ws.onmessage = (msg)=>{

let d = JSON.parse(msg.data);

console.log("LIVE DATA:", d);

/* STATUS */

statusEl.innerHTML =
"🟢 LIVE DATA RECEIVED";

/* SAFE CHECK */

if(!d || !d.price){
return;
}

/* SIGNAL COLOR */

let signalClass = "wait";

if(d.signal === "BUY"){
signalClass = "buy";
}
else if(d.signal === "SELL"){
signalClass = "sell";
}

/* =========================
   UPDATE UI
========================= */

const signalEl =
document.getElementById("signal");

signalEl.innerText =
d.signal || "WAIT";

signalEl.className =
"value " + signalClass;

document.getElementById("price")
.innerText =
Number(d.price).toFixed(2);

document.getElementById("rsi")
.innerText =
d.rsi || 0;

document.getElementById("emaF")
.innerText =
d.emaFast || 0;

document.getElementById("emaS")
.innerText =
d.emaSlow || 0;

document.getElementById("win")
.innerText =
(d.winRate || 0) + "%";

/* =========================
   CHART UPDATE
========================= */

chartData.push(d.price);

if(chartData.length > 60){
chartData.shift();
}

drawChart();

};

/* =========================
   CANVAS
========================= */

const canvas =
document.getElementById("chart");

const ctx =
canvas.getContext("2d");

function resizeCanvas(){

canvas.width =
window.innerWidth - 30;

canvas.height = 300;

}

resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);

/* =========================
   DRAW CHART
========================= */

function drawChart(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

if(chartData.length < 2){
return;
}

let min =
Math.min(...chartData);

let max =
Math.max(...chartData);

ctx.beginPath();

for(let i=0;i<chartData.length;i++){

let x =
(i / (chartData.length - 1))
* canvas.width;

let normalized =
(chartData[i] - min)
/
(max - min || 1);

let y =
canvas.height -
(normalized * canvas.height);

if(i===0){
ctx.moveTo(x,y);
}else{
ctx.lineTo(x,y);
}

}

ctx.strokeStyle = "#00ff99";
ctx.lineWidth = 3;
ctx.stroke();

}

</script>
