<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER PRO WEB APP</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#070b18,#0b1226);
color:white;
overflow:hidden;
}

/* ================= CONTAINER ================= */
.screen{
display:none;
height:100vh;
width:100%;
align-items:center;
justify-content:center;
flex-direction:column;
animation:fade 0.5s ease;
}

.screen.active{
display:flex;
}

/* ================= ANIMATION ================= */
@keyframes fade{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

/* ================= CARD ================= */
.card{
width:90%;
max-width:420px;
background:#0f172a;
padding:20px;
border-radius:20px;
box-shadow:0 0 25px rgba(0,255,157,0.15);
border:1px solid rgba(0,255,157,0.2);
text-align:center;
}

/* ================= TITLE ================= */
h2{
margin-bottom:15px;
color:#00ff9d;
}

/* ================= BUTTONS ================= */
button{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:12px;
background:#00ff9d;
font-weight:bold;
font-size:16px;
cursor:pointer;
transition:0.2s;
box-shadow:0 0 10px rgba(0,255,157,0.3);
}

button:active{
transform:scale(0.95);
box-shadow:0 0 25px rgba(0,255,157,0.7);
}

/* ================= SELECT ================= */
select{
width:100%;
padding:15px;
margin-top:10px;
border-radius:12px;
border:none;
background:#111827;
color:white;
font-size:16px;
outline:none;
}

/* ================= RESULT ================= */
.result{
margin-top:20px;
font-size:18px;
line-height:1.8;
}

/* ================= SIGNAL ================= */
.signal{
font-size:28px;
font-weight:bold;
margin-top:10px;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

/* ================= COLORS ================= */
.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

/* ================= LOADING ================= */
.loading{
color:#aaa;
font-size:14px;
margin-top:10px;
}

/* ================= SMALL TEXT ================= */
.small{
font-size:12px;
color:#888;
margin-top:10px;
}

</style>
</head>

<body>

<!-- ================= SCREEN 1 : MARKET ================= -->
<div class="screen active" id="s1">

<div class="card">

<h2>📊 CHOISIR MARCHÉ</h2>

<select id="symbol">
<option value="EURUSD">EUR/USD</option>
<option value="GBPUSD">GBP/USD</option>
<option value="USDJPY">USD/JPY</option>
<option value="USDCHF">USD/CHF</option>
<option value="AUDUSD">AUD/USD</option>
<option value="USDCAD">USD/CAD</option>
<option value="NZDUSD">NZD/USD</option>
</select>

<button onclick="setSymbol()">CONTINUER ➜</button>

</div>

</div>

<!-- ================= SCREEN 2 : TIME ================= -->
<div class="screen" id="s2">

<div class="card">

<h2>⏱ CHOISIR TIMEFRAME</h2>

<button onclick="setTime('1m')">1 MIN</button>
<button onclick="setTime('5m')">5 MIN</button>
<button onclick="setTime('15m')">15 MIN</button>

</div>

</div>

<!-- ================= SCREEN 3 : LOADING ================= -->
<div class="screen" id="s3">

<div class="card">

<h2>📡 ANALYSE EN COURS</h2>

<div class="loading">Scanning market structure...</div>

</div>

</div>

<!-- ================= SCREEN 4 : RESULT ================= -->
<div class="screen" id="s4">

<div class="card">

<h2>📊 RÉSULTAT</h2>

<div id="signal" class="signal wait">WAIT</div>

<div class="result">
<div id="price">PRICE: -</div>
<div id="rsi">RSI: -</div>
<div id="trend">TREND: -</div>
<div id="strength">STRENGTH: -</div>
</div>

<button onclick="reset()">🔁 NOUVELLE ANALYSE</button>

<div class="small">SNIPER PRO WEB APP</div>

</div>

</div>

<script>

let symbol = "";
let time = "";

/* ================= NAVIGATION ================= */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* ================= STEP 1 ================= */
function setSymbol(){
symbol = document.getElementById("symbol").value;
show("s2");
}

/* ================= STEP 2 ================= */
function setTime(t){
time = t;
run();
}

/* ================= ANALYSE ================= */
async function run(){

show("s3");

/* animation delay */
setTimeout(async ()=>{

const res = await fetch(`/api/${symbol}/${time}`);
const d = await res.json();

/* SIGNAL */
let colorClass = "wait";
if(d.signal === "BUY") colorClass = "buy";
if(d.signal === "SELL") colorClass = "sell";

document.getElementById("signal").className = "signal " + colorClass;
document.getElementById("signal").innerText = d.signal;

/* DATA */
document.getElementById("price").innerText = "PRICE: " + d.price;
document.getElementById("rsi").innerText = "RSI: " + d.rsi;
document.getElementById("trend").innerText = "TREND: " + d.trend;
document.getElementById("strength").innerText = "STRENGTH: " + d.strength;

/* show result */
show("s4");

}, 1200);
}

/* ================= RESET ================= */
function reset(){
show("s1");
}

</script>

</body>
</html>
