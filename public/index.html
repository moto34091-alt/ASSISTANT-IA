<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART ENGINE V4</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.app{
width:95%;
max-width:420px;
background:#0c1224;
border-radius:20px;
padding:15px;
}

/* SCREENS */
.screen{display:none;}
.screen.active{display:block;}

/* TITLE */
h2{
text-align:center;
color:#00ff9d;
}

/* BUTTON */
button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
background:#00ff9d;
font-weight:bold;
cursor:pointer;
}

/* ITEM */
.item{
padding:12px;
margin:6px 0;
background:#111a33;
border-radius:10px;
text-align:center;
cursor:pointer;
}

/* RESULT */
.result{
text-align:center;
margin-top:20px;
}

.signal{
font-size:50px;
margin-top:10px;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

.bar{
height:6px;
background:#1a1f35;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:1s;
}

</style>

</head>

<body>

<div class="app">

<!-- SCREEN 1 -->
<div class="screen active" id="s1">
<h2>📡 CIBLER MARCHÉ</h2>
<button onclick="scan()">SCAN MARCHÉS</button>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">
<h2>📊 MARCHÉS</h2>
<div id="list"></div>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="s3">
<h2>⏱ TIME FRAME</h2>

<div class="item" onclick="setTime('1m')">1 MIN</div>
<div class="item" onclick="setTime('5m')">5 MIN</div>
<div class="item" onclick="setTime('15m')">15 MIN</div>

</div>

<!-- SCREEN 4 -->
<div class="screen" id="s4">
<h2>🧠 READY</h2>
<button onclick="analyze()">ANALYSER</button>
</div>

<!-- SCREEN 5 -->
<div class="screen" id="s5">

<h2>📊 RESULTAT</h2>

<div id="signal" class="signal wait">WAIT</div>

<div class="result">
<div id="score">0%</div>
<div id="prob">0%</div>
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<button onclick="restart()">NOUVELLE ANALYSE</button>

</div>

</div>

<script>

let symbol="";
let tf="1m";

/* NAV */
function go(id){
document.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* SCAN */
function scan(){

let markets=[
"BTCUSD","ETHUSD","EURUSD","GBPUSD","USDJPY",
"XAUUSD","NAS100","SPX500","DOWJONES",
"GER40","AUDUSD","NZDUSD"
];

let box=document.getElementById("list");
box.innerHTML="";

markets.forEach(m=>{

let div=document.createElement("div");
div.className="item";
div.innerText=m;

div.onclick=()=>{
symbol=m;
go("s3");
};

box.appendChild(div);

});

go("s2");
}

/* TIME */
function setTime(t){
tf=t;
go("s4");
}

/* ANALYZE */
async function analyze(){

const res = await fetch(`/api/analyze/${symbol}/${tf}`);
const data = await res.json();

let signal=document.getElementById("signal");
let score=document.getElementById("score");
let prob=document.getElementById("prob");

signal.innerText=data.signal;
score.innerText="SCORE: "+data.score;
prob.innerText="PROB: "+data.probability+"%";

signal.className="signal " +
(data.signal==="BUY"?"buy":
data.signal==="SELL"?"sell":"wait");

document.getElementById("fill").style.width =
data.probability + "%";

setTimeout(()=>go("s5"),500);

}

/* RESET */
function restart(){
go("s1");
}

</script>

</body>
</html>
