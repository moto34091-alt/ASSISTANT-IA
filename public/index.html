<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI PRO</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* APP */
.app{
width:95%;
max-width:420px;
background:#0c1224;
border-radius:20px;
padding:15px;
}

/* TOP OPTIONS */
.top{
display:flex;
justify-content:space-between;
gap:10px;
margin-bottom:10px;
}

select{
flex:1;
padding:10px;
border-radius:10px;
border:none;
background:#111a33;
color:white;
}

/* TITLE */
h2{
text-align:center;
color:#00ff9d;
}

/* BUTTON */
button{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#00ff9d;
color:black;
font-weight:bold;
margin-top:10px;
cursor:pointer;
}

/* SIGNAL */
.signal{
font-size:55px;
text-align:center;
margin:15px 0;
font-weight:bold;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

/* INFO */
.info{
text-align:center;
font-size:18px;
margin:5px 0;
color:#aaa;
}

/* BAR */
.bar{
width:100%;
height:6px;
background:#1a1f35;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:0.5s;
}

</style>

</head>

<body>

<div class="app">

<h2>📊 SNIPER AI PRO</h2>

<!-- 🔥 OPTIONS MARKET + TIME -->
<div class="top">

<select id="market">
<option value="BTCUSD">BTCUSD</option>
<option value="ETHUSD">ETHUSD</option>
<option value="EURUSD">EURUSD</option>
<option value="GBPUSD">GBPUSD</option>
<option value="XAUUSD">GOLD</option>
<option value="NAS100">NAS100</option>
</select>

<select id="time">
<option value="1m">1 MIN</option>
<option value="5m">5 MIN</option>
<option value="15m">15 MIN</option>
</select>

</div>

<button onclick="analyze()">🔄 ANALYSER</button>

<div id="signal" class="signal wait">WAIT</div>

<div id="score" class="info">SCORE: 0</div>
<div id="prob" class="info">PROB: 0%</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

</div>

<script>

let market = "BTCUSD";
let tf = "1m";

/* UPDATE OPTIONS */
document.getElementById("market").onchange = (e)=>{
market = e.target.value;
}

document.getElementById("time").onchange = (e)=>{
tf = e.target.value;
}

/* ANALYZE */
async function analyze(){

const res = await fetch(`/api/analyze/${market}/${tf}`);
const data = await res.json();

/* SIGNAL */
const signal = document.getElementById("signal");
const score = document.getElementById("score");
const prob = document.getElementById("prob");

if(data.signal === "BUY"){
signal.innerText = "🟢 BUY";
signal.className = "signal buy";
}
else if(data.signal === "SELL"){
signal.innerText = "🔴 SELL";
signal.className = "signal sell";
}
else{
signal.innerText = "🟡 WAIT";
signal.className = "signal wait";
}

/* SCORE */
score.innerText = "SCORE: " + (data.score || 0);

/* PROB */
prob.innerText = "PROB: " + (data.probability || 0) + "%";

/* BAR */
document.getElementById("fill").style.width =
(data.probability || 0) + "%";

}

</script>

</body>
</html>
