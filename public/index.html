<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI PRO</title>

<style>
body{
margin:0;
background:#050816;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.app{
width:100%;
max-width:420px;
background:#0c1224;
padding:15px;
border-radius:15px;
}

h1{
text-align:center;
color:#00ff9d;
}

select,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
font-weight:bold;
}

select{background:#141d38;color:white;}
button{background:#00ff9d;color:black;}

.box{
margin-top:15px;
padding:10px;
background:#09101f;
border-radius:10px;
text-align:center;
}

.signal{
font-size:40px;
font-weight:bold;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}
</style>
</head>

<body>

<div class="app">

<h1>SNIPER AI PRO</h1>

<select id="market">
<option>EURUSD</option>
<option>GBPUSD</option>
<option>USDJPY</option>
<option>BTCUSD</option>
<option>ETHUSD</option>
<option>XAUUSD</option>
</select>

<button onclick="analyze()">ANALYZE</button>

<div class="box">
<div id="signal" class="signal wait">WAIT</div>
<div id="price">PRICE: --</div>
<div id="rsi">RSI: --</div>
<div id="conf">CONFIDENCE: 0%</div>
</div>

</div>

<script>

async function analyze(){

const symbol = document.getElementById("market").value;

const res = await fetch(`/signal?symbol=${symbol}&tf=1min`);

const data = await res.json();

console.log(data);

if(!data || data.price == null){
document.getElementById("signal").innerText = "NO DATA";
return;
}

document.getElementById("signal").innerText = data.signal;
document.getElementById("price").innerText = "PRICE: " + data.price;
document.getElementById("rsi").innerText = "RSI: " + data.rsi;
document.getElementById("conf").innerText = "CONF: " + data.confidence + "%";

}

</script>

</body>
</html>
