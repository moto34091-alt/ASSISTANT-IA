<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SNIPER AI PRO V10</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050816;
font-family:Arial,sans-serif;
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* APP */

.app{
width:95%;
max-width:420px;
background:#0c1224;
border-radius:30px;
padding:18px;
border:1px solid #00ff9d22;
box-shadow:0 0 35px #00ff9d22;
}

/* TITLE */

.title{
text-align:center;
font-size:24px;
font-weight:bold;
color:#00ff9d;
margin-bottom:20px;
}

/* SELECT */

select{
width:100%;
padding:14px;
margin-top:12px;
background:#111a33;
border:none;
border-radius:16px;
color:white;
font-size:15px;
font-weight:bold;
outline:none;
}

/* BUTTONS */

button{
width:100%;
padding:15px;
margin-top:14px;
border:none;
border-radius:18px;
background:#00ff9d;
color:black;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:active{
transform:scale(0.97);
}

/* ANALYZE BUTTON */

.analyze-btn{
position:relative;
overflow:hidden;
}

/* LOADER */

.loader{
width:18px;
height:18px;
border:3px solid #00000033;
border-top:3px solid black;
border-radius:50%;
display:inline-block;
vertical-align:middle;
margin-right:8px;
animation:spin 1s linear infinite;
}

@keyframes spin{

100%{
transform:rotate(360deg);
}

}

/* SIGNAL */

.signal{
text-align:center;
font-size:70px;
font-weight:bold;
margin-top:25px;
transition:0.4s;
}

.buy{
color:#00ff9d;
text-shadow:0 0 25px #00ff9d;
}

.sell{
color:#ff3b5c;
text-shadow:0 0 25px #ff3b5c;
}

.wait{
color:#facc15;
}

/* INFO */

.info{
text-align:center;
font-size:20px;
margin-top:12px;
color:#aaa;
}

/* EXPIRY BAR */

.bar{
width:100%;
height:24px;
background:#1a1f35;
border-radius:30px;
overflow:hidden;
margin-top:25px;
box-shadow:0 0 15px #00ff9d22 inset;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:1s linear;
}

/* EXPIRY TEXT */

.expiry{
text-align:center;
margin-top:12px;
font-size:18px;
font-weight:bold;
}

/* COLORS */

.good{
color:#00ff9d;
}

.medium{
color:#facc15;
}

.bad{
color:#ff3b5c;
}

</style>

</head>

<body>

<div class="app">

<div class="title">
📊 SNIPER AI PRO V10
</div>

<!-- 🔥 MARKET -->

<select id="market">

<option value="EURUSD">EUR/USD</option>

<option value="GBPUSD">GBP/USD</option>

<option value="USDJPY">USD/JPY</option>

<option value="USDCHF">USD/CHF</option>

<option value="USDCAD">USD/CAD</option>

<option value="AUDUSD">AUD/USD</option>

<option value="NZDUSD">NZD/USD</option>

<option value="EURJPY">EUR/JPY</option>

<option value="GBPJPY">GBP/JPY</option>

<option value="XAUUSD">GOLD</option>

</select>

<!-- 🔥 TIME -->

<select id="time">

<option value="60">1 MIN</option>

<option value="300">5 MIN</option>

<option value="900">15 MIN</option>

</select>

<!-- 🔥 BUTTON -->

<button
class="analyze-btn"
id="analyzeBtn"
onclick="analyze()">

🔄 ANALYZE MARKET

</button>

<button onclick="toggleAuto()">

🤖 AUTO MODE

</button>

<!-- 🔥 SIGNAL -->

<div id="signal" class="signal wait">

WAIT

</div>

<!-- 🔥 SCORE -->

<div class="info" id="score">

SCORE: 0

</div>

<!-- 🔥 PROB -->

<div class="info" id="prob">

PROB: 0%

</div>

<!-- 🔥 EXPIRY -->

<div class="bar">

<div class="fill" id="fill"></div>

</div>

<!-- 🔥 STATUS -->

<div class="expiry" id="expiry">

READY

</div>

</div>

<script>

let autoMode = false;

let autoInterval;

let expiryInterval;

/* 🔥 ANALYZE */

async function analyze(){

const btn =
document.getElementById("analyzeBtn");

btn.innerHTML =
'<span class="loader"></span> ANALYZING...';

btn.disabled = true;

const market =
document.getElementById("market").value;

try{

const res =
await fetch(`/api/${market}/1m`);

const data =
await res.json();

const signal =
document.getElementById("signal");

const score =
document.getElementById("score");

const prob =
document.getElementById("prob");

/* 🔥 ALWAYS SHOW */

score.innerText =
"SCORE: " + (data.score || 0);

prob.innerText =
"PROB: " + (data.probability || 0) + "%";

/* 🔥 BAD ENTRY */

if((data.probability || 0) < 70){

signal.innerText =
"🟡 WAIT";

signal.className =
"signal wait";

document.getElementById("expiry").innerHTML =
"❌ BAD ENTRY";

document.getElementById("fill").style.width =
"0%";

btn.innerHTML =
"🔄 ANALYZE MARKET";

btn.disabled = false;

return;

}

/* 🔥 BUY */

if(data.signal === "BUY"){

signal.innerText =
"🟢 BUY";

signal.className =
"signal buy";

playSound();

vibrate();

}

/* 🔥 SELL */

else if(data.signal === "SELL"){

signal.innerText =
"🔴 SELL";

signal.className =
"signal sell";

playSound();

vibrate();

}

/* 🔥 START EXPIRY */

const tf =
parseInt(
document.getElementById("time").value
);

startExpiry(tf);

}catch(err){

console.log(err);

}

btn.innerHTML =
"🔄 ANALYZE MARKET";

btn.disabled = false;

}

/* 🔥 EXPIRY ENGINE */

function startExpiry(seconds){

clearInterval(expiryInterval);

let left = seconds;

const fill =
document.getElementById("fill");

const expiry =
document.getElementById("expiry");

fill.style.width = "100%";

expiryInterval = setInterval(()=>{

left--;

const percent =
(left / seconds) * 100;

fill.style.width =
percent + "%";

/* 🔥 ENTRY QUALITY */

if(percent > 70){

expiry.innerHTML =
"🟢 PERFECT ENTRY";

expiry.className =
"expiry good";

}

else if(percent > 40){

expiry.innerHTML =
"🟡 ENTRY POSSIBLE";

expiry.className =
"expiry medium";

}

else{

expiry.innerHTML =
"🔴 TOO LATE";

expiry.className =
"expiry bad";

}

/* 🔥 EXPIRED */

if(left <= 0){

clearInterval(expiryInterval);

fill.style.width = "0%";

expiry.innerHTML =
"⌛ SIGNAL EXPIRED";

expiry.className =
"expiry bad";

}

},1000);

}

/* 🔥 AUTO MODE */

function toggleAuto(){

if(autoMode){

clearInterval(autoInterval);

autoMode = false;

alert("AUTO MODE OFF");

return;

}

autoMode = true;

alert("AUTO MODE ON");

autoInterval = setInterval(()=>{

analyze();

},8000);

}

/* 🔊 SOUND */

function playSound(){

const audio =
new Audio(
"https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
);

audio.play();

}

/* 📳 VIBRATION */

function vibrate(){

if(navigator.vibrate){

navigator.vibrate([200,100,200]);

}

}

</script>

</body>
</html>
