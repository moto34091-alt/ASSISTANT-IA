<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI V5</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* APP */
.app{
width:95%;
max-width:420px;
background:#0c1224;
border-radius:20px;
padding:15px;
overflow:hidden;
}

/* SCREEN */
.screen{display:none;}
.screen.active{display:block;}

/* TITLE */
h3{
text-align:center;
color:#00ff9d;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
background:#00ff9d;
font-weight:bold;
cursor:pointer;
}

/* MARKET ITEM */
.item{
padding:12px;
margin:6px 0;
background:#111a33;
border-radius:10px;
text-align:center;
cursor:pointer;
}

/* CHART */
#chart{
height:280px;
border-radius:15px;
overflow:hidden;
margin-top:10px;
}

/* SIGNAL */
.signal{
font-size:55px;
text-align:center;
margin-top:10px;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

.bar{
height:6px;
background:#1a1f35;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
animation:load 3s linear forwards;
}

@keyframes load{
from{width:100%;}
to{width:0%;}
}

</style>

</head>

<body>

<div class="app">

<!-- SCREEN 1 -->
<div class="screen active" id="s1">

<h3>🔄 SCAN MARKET</h3>

<button onclick="scanMarkets()">SCAN</button>

<div id="markets"></div>

</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">

<h3>📊 SELECT MARKET</h3>
<div id="marketList"></div>

</div>

<!-- SCREEN 3 -->
<div class="screen" id="s3">

<h3>🧠 ANALYZE</h3>

<div id="chart"></div>

<div class="bar"><div class="fill"></div></div>

<button onclick="analyze()">START ANALYSIS</button>

</div>

<!-- SCREEN 4 -->
<div class="screen" id="s4">

<div id="signal" class="signal wait">WAIT</div>
<div id="strength" style="text-align:center">0%</div>

<button onclick="restart()">NEW ANALYSIS</button>

</div>

</div>

<script>

let selected="";

/* ================= NAV ================= */
function go(id){
document.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("active"));

document.getElementById(id).classList.add("active");
}

/* ================= MARKETS ================= */
function scanMarkets(){

let markets=[
"BTCUSD","ETHUSD","EURUSD","GBPUSD",
"USDJPY","XAUUSD","NAS100","SPX500",
"DOWJONES","GER40","AUDUSD","NZDUSD"
];

let box=document.getElementById("marketList");
box.innerHTML="";

markets.forEach(m=>{

let div=document.createElement("div");
div.className="item";
div.innerText=m;

div.onclick=()=>{
selected=m;
loadChart(m);
go("s3");
};

box.appendChild(div);

});

go("s2");
}

/* ================= SAFE CHART ================= */
let widget;

function loadChart(symbol){

document.getElementById("chart").innerHTML="";

if(widget){
widget=null;
}

widget = new TradingView.widget({
container_id:"chart",
width:"100%",
height:280,
symbol: getSymbol(symbol),
interval:"1",
theme:"dark",
style:"1",
locale:"fr",
hide_top_toolbar:true,
allow_symbol_change:false
});

}

/* ================= SAFE SYMBOL ================= */
function getSymbol(symbol){

symbol=symbol.toUpperCase();

/* CRYPTO */
if(symbol.includes("BTC")||symbol.includes("ETH")||symbol.includes("SOL")){
return "BINANCE:"+symbol;
}

/* FOREX */
if(symbol.includes("USD")||symbol.includes("EUR")||symbol.includes("JPY")||symbol.includes("GBP")){
return "FX:"+symbol;
}

/* GOLD */
if(symbol.includes("XAU")){
return "OANDA:XAUUSD";
}

/* INDICES */
if(symbol.includes("NAS")||symbol.includes("SPX")||symbol.includes("DOW")){
return "CAPITALCOM:"+symbol;
}

return "BINANCE:BTCUSDT";
}

/* ================= ANALYZE ================= */
async function analyze(){

const res = await fetch(`/api/${selected}/1m`);
const data = await res.json();

let signal=document.getElementById("signal");
let strength=document.getElementById("strength");

signal.innerText=data.signal;
strength.innerText=(data.strength||0)+"%";

signal.className="signal " +
(data.signal==="BUY"?"buy":
data.signal==="SELL"?"sell":"wait");

setTimeout(()=>{
go("s4");
},1500);

}

/* ================= RESET ================= */
function restart(){
go("s1");
}

</script>

</body>
</html>
