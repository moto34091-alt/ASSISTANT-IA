<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SNIPER AI V37</title>

<style>
body{
margin:0;
background:#050816;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:#0c1224;
padding:30px;
border-radius:20px;
border:1px solid #00ff9d;
text-align:center;
box-shadow:0 0 25px #00ff9d33;
animation: glow 2s infinite alternate;
}

h1{
color:#00ff9d;
font-size:28px;
}

p{
color:#aaa;
margin-top:10px;
}

button{
margin-top:20px;
padding:12px 18px;
border:none;
border-radius:10px;
background:#00ff9d;
color:black;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
box-shadow:0 0 15px #00ff9d;
}

.signal{
margin-top:15px;
font-size:20px;
color:#facc15;
animation:pulse 1s infinite;
}

@keyframes glow{
from{box-shadow:0 0 10px #00ff9d33;}
to{box-shadow:0 0 25px #00ff9d;}
}

@keyframes pulse{
0%{opacity:1;}
50%{opacity:0.5;}
100%{opacity:1;}
}
</style>

</head>

<body>

<div class="card">
<h1>🚀 SNIPER AI V37</h1>
<p>SMART ENGINE LIVE</p>

<div class="signal" id="signal">WAITING SIGNAL...</div>

<button onclick="getSignal()">
📊 GET SIGNAL
</button>
</div>

<script>
async function getSignal(){
const res = await fetch("/api/BTCUSD/1m");
const data = await res.json();

document.getElementById("signal").innerText =
"SIGNAL: " + data.signal + " | PRICE: " + data.price;
}
</script>

</body>
</html>
