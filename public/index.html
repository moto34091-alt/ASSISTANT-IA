<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>D-FLAM BOT TRADING</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:12px;
color:white;
overflow-x:hidden;
}

/* APP */

.app{
width:100%;
max-width:420px;
background:#0c1224;
border-radius:25px;
padding:16px;
border:1px solid #1e2b4a;
box-shadow:
0 0 25px rgba(0,255,157,0.15),
0 0 80px rgba(0,0,0,0.5) inset;
}

/* TOPBAR */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
font-size:13px;
}

.live{
color:#00ff9d;
font-weight:bold;
}

.clock{
color:#ccc;
}

/* TITLE */

h2{
text-align:center;
color:#00ff9d;
font-size:28px;
margin-bottom:15px;
text-shadow:0 0 10px #00ff9d55;
}

/* SELECT */

select{
width:100%;
padding:13px;
margin-top:10px;
border:none;
outline:none;
border-radius:14px;
background:#131f3d;
color:white;
font-size:16px;
font-weight:bold;
}

/* BUTTONS */

.buttons{
display:flex;
gap:10px;
margin-top:12px;
}

button{
flex:1;
padding:14px;
border:none;
border-radius:14px;
font-weight:bold;
font-size:15px;
cursor:pointer;
transition:0.2s;
}

.analyzeBtn{
background:#00ff9d;
color:black;
}

.autoBtn{
background:#1b2b4f;
color:white;
border:1px solid #2e4678;
}

button:active{
transform:scale(0.96);
}

/* SIGNAL BOX */

.signalBox{
margin-top:18px;
background:#111827;
border-radius:22px;
padding:20px;
border:1px solid #1d2d52;
}

/* ICON */

.icon{
text-align:center;
font-size:70px;
}

/* SIGNAL */

.signal{
text-align:center;
font-size:50px;
font-weight:bold;
margin-top:6px;
}

.buy{
color:#00ff9d;
text-shadow:0 0 20px #00ff9d;
}

.sell{
color:#ff3b5c;
text-shadow:0 0 20px #ff3b5c;
}

.wait{
color:#facc15;
text-shadow:0 0 20px #facc15;
}

/* ENTRY */

.entry{
text-align:center;
margin-top:10px;
font-size:15px;
font-weight:bold;
color:#00ff9d;
}

/* PRICE */

.price{
text-align:center;
margin-top:6px;
font-size:16px;
color:#c7c7c7;
}

/* GRID INFO */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
}

.card{
background:#141f3a;
padding:12px;
border-radius:15px;
text-align:center;
}

.cardTitle{
font-size:12px;
color:#aaa;
margin-bottom:5px;
}

.cardValue{
font-size:18px;
font-weight:bold;
}

/* BAR */

.bar{
width:100%;
height:12px;
background:#1d2746;
border-radius:20px;
overflow:hidden;
margin-top:18px;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);
transition:width 1s linear;
}

/* TIMER */

.timer{
text-align:center;
margin-top:10px;
font-size:14px;
display:none;
color:#ccc;
}

/* MARKET STATUS */

.marketStatus{
margin-top:14px;
text-align:center;
font-size:13px;
color:#8e9ab8;
}

/* FOOTER */

.footer{
margin-top:16px;
text-align:center;
font-size:12px;
color:#5e6781;
}

</style>
</head>

<body>

<div class="app">

<div class="topbar">
<div class="live">🟢 LIVE MARKET</div>
<div class="clock" id="clock">00:00:00</div>
</div>

<h2>SNIPER AI PRO</h2>

<select id="market">
<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>EUR/JPY</option>
<option>USD/CHF</option>
<option>AUD/USD</option>
<option>USD/CAD</option>
<option>EUR/GBP</option>
<option>GBP/JPY</option>
<option>EUR/AUD</option>
<option>EUR/CAD</option>
<option>GBP/CHF</option>
<option>CHF/JPY</option>
<option>AUD/JPY</option>
<option>NZD/USD</option>
<option>BTC/USD</option>
<option>ETH/USD</option>
<option>US30</option>
<option>NAS100</option>
<option>XAU/USD</option>
</select>

<select id="time">
<option value="60">1 MIN</option>
<option value="300">5 MIN</option>
<option value="900">15 MIN</option>
</select>

<div class="buttons">
<button class="analyzeBtn" onclick="analyze()">ANALYZE</button>
<button class="autoBtn" onclick="autoMode()">AUTO MODE</button>
</div>

<div class="signalBox">

<div id="icon" class="icon">🟡</div>

<div id="signal" class="signal wait">
WAIT
</div>

<div class="entry" id="entry">
ENTRY POINT: -
</div>

<div class="price" id="price">
PRICE: --
</div>

<div class="grid">

<div class="card">
<div class="cardTitle">PROBABILITY</div>
<div class="cardValue" id="prob">0%</div>
</div>

<div class="card">
<div class="cardTitle">WINRATE</div>
<div class="cardValue" id="winrate">0%</div>
</div>

<div class="card">
<div class="cardTitle">TREND</div>
<div class="cardValue" id="trend">NEUTRAL</div>
</div>

<div class="card">
<div class="cardTitle">SESSION</div>
<div class="cardValue" id="session">LONDON</div>
</div>

</div>

<div class="bar">
<div id="fill" class="fill"></div>
</div>

<div class="timer" id="timer">
READY
</div>

<div class="marketStatus" id="marketStatus">
SMART MONEY MODE ACTIVE
</div>

</div>

<div class="footer">
POWERED BY D-FLAM AI ENGINE
</div>

</div>

<script>

/* CLOCK */

function updateClock(){
let now=new Date();
document.getElementById("clock").innerText=
now.toLocaleTimeString();
}

setInterval(updateClock,1000);
updateClock();

/* GLOBAL */

let interval=null;
let timer=null;
let signalCache={};

/* PRICE */

function getPrice(market){

let base=1+Math.random()*100;

if(market.includes("JPY"))
base=100+Math.random()*50;

if(market.includes("BTC"))
base=60000+Math.random()*2000;

if(market.includes("ETH"))
base=3000+Math.random()*200;

if(market.includes("XAU"))
base=2300+Math.random()*50;

if(market.includes("NAS"))
base=18000+Math.random()*300;

if(market.includes("US30"))
base=39000+Math.random()*300;

return base.toFixed(2);
}

/* SESSION */

function getSession(){

let h=new Date().getHours();

if(h>=0 && h<8)
return "TOKYO";

if(h>=8 && h<13)
return "LONDON";

if(h>=13 && h<22)
return "NEW YORK";

return "SYDNEY";
}

/* CANDLE */

function candle(){

let open=Math.random()*100;
let close=Math.random()*100;
let high=Math.max(open,close)+Math.random()*10;
let low=Math.min(open,close)-Math.random()*10;

return {open,close,high,low};
}

/* AI ENGINE */

function ai(){

let c1=candle();
let c2=candle();
let c3=candle();

/* WICKS */

let upperWick=
c3.high-Math.max(c3.open,c3.close);

let lowerWick=
Math.min(c3.open,c3.close)-c3.low;

/* MARKET STRUCTURE */

let HH=c3.high>c2.high && c2.high>c1.high ? 1:0;
let HL=c3.low>c2.low ? 1:0;

let LH=c3.high<c2.high ? 1:0;
let LL=c3.low<c2.low && c2.low<c1.low ? 1:0;

/* BOS */

let bosUp=c3.close>c2.high ? 1:0;
let bosDown=c3.close<c2.low ? 1:0;

/* LIQUIDITY */

let buyLiquidity=
lowerWick>upperWick*2 ? 1:0;

let sellLiquidity=
upperWick>lowerWick*2 ? 1:0;

/* ORDER BLOCK */

let bullishOB=
c2.close<c2.open &&
c3.close>c2.high ? 1:0;

let bearishOB=
c2.close>c2.open &&
c3.close<c2.low ? 1:0;

/* RSI */

let rsi=Math.floor(Math.random()*100);

let rsiBuy=rsi<35 ? 1:0;
let rsiSell=rsi>65 ? 1:0;

/* MOMENTUM */

let momentum=Math.random()*2-1;

let momentumBuy=momentum>0.3 ? 1:0;
let momentumSell=momentum<-0.3 ? 1:0;

/* HAMMER */

let hammer=
lowerWick>upperWick*2 ? 1:0;

let shootingStar=
upperWick>lowerWick*2 ? 1:0;

/* BUY SCORE */

let buyScore=
HH+
HL+
bosUp+
buyLiquidity+
bullishOB+
rsiBuy+
momentumBuy+
hammer;

/* SELL SCORE */

let sellScore=
LH+
LL+
bosDown+
sellLiquidity+
bearishOB+
rsiSell+
momentumSell+
shootingStar;

/* SIGNAL */

let signal="WAIT";

if(buyScore>=5 && buyScore>sellScore)
signal="BUY";

else if(sellScore>=5 && sellScore>buyScore)
signal="SELL";

/* PROB */

let prob=
50+Math.max(buyScore,sellScore)*6;

if(prob>95) prob=95;

/* WINRATE */

let winrate=
50+Math.max(buyScore,sellScore)*5;

if(winrate>92) winrate=92;

/* TREND */

let trend="NEUTRAL";

if(signal=="BUY")
trend="BULLISH";

if(signal=="SELL")
trend="BEARISH";

/* ENTRY */

let entry=
signal=="BUY"
? "SMART MONEY BUY 🔼"
: signal=="SELL"
? "SMART MONEY SELL 🔽"
: "-";

return{
signal,
prob,
winrate,
trend,
entry
};

}

/* ANALYZE */

function analyze(){

let market=
document.getElementById("market").value;

let tf=
document.getElementById("time").value;

let key=market+"_"+tf;

/* SIGNAL FIXE */

if(signalCache[key]){
apply(signalCache[key],market);
return;
}

document.getElementById("icon").innerText="🧠";

document.getElementById("signal").innerText=
"ANALYZING...";

document.getElementById("signal").className=
"signal wait";

setTimeout(()=>{

let data=ai();

signalCache[key]=data;

apply(data,market);

startTimer(data.signal);

},700);

}

/* APPLY */

function apply(d,market){

let icon=document.getElementById("icon");
let s=document.getElementById("signal");

if(d.signal=="BUY"){
icon.innerText="🟢";
s.innerText="BUY";
s.className="signal buy";
}

else if(d.signal=="SELL"){
icon.innerText="🔴";
s.innerText="SELL";
s.className="signal sell";
}

else{
icon.innerText="🟡";
s.innerText="WAIT";
s.className="signal wait";
}

document.getElementById("entry").innerText=
"ENTRY POINT: "+d.entry;

document.getElementById("price").innerText=
"PRICE: "+getPrice(market);

document.getElementById("prob").innerText=
d.prob+"%";

document.getElementById("winrate").innerText=
d.winrate.toFixed(1)+"%";

document.getElementById("trend").innerText=
d.trend;

document.getElementById("session").innerText=
getSession();

/* TIMER */

if(d.signal=="WAIT"){
document.getElementById("timer").style.display="none";
}

}

/* TIMER */

function startTimer(signal){

clearInterval(timer);

if(signal=="WAIT")
return;

document.getElementById("timer").style.display="block";

let r=60;

timer=setInterval(()=>{

r--;

document.getElementById("fill").style.width=
(r/60*100)+"%";

document.getElementById("timer").innerText=
r+" SEC";

if(r<=0){

clearInterval(timer);

document.getElementById("timer").style.display=
"none";

}

},1000);

}

/* AUTO MODE */

function autoMode(){

if(interval){

clearInterval(interval);
interval=null;

document.querySelector(".autoBtn").innerText=
"AUTO MODE";

return;
}

document.querySelector(".autoBtn").innerText=
"AUTO ON";

interval=setInterval(()=>{

analyze();

},3000);

}

</script>

</body>
</html>
