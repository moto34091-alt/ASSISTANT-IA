<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Trading Bot</title>

<style>
body{margin:0;background:#0b1220;color:white;font-family:Arial}
header{padding:10px;background:#111827}
#box{padding:20px}
button{padding:10px;margin:5px}
</style>

</head>

<body>

<header>🚀 AI TRADING BOT</header>

<div id="box">

<h3>Signal</h3>
<div id="signal">WAIT</div>

<h3>Confidence</h3>
<div id="conf">0%</div>

<br>

<button onclick="getSignal()">Refresh Signal</button>

<hr>

<h3>Admin Login</h3>

<input id="user" placeholder="username"><br><br>
<input id="pass" placeholder="password" type="password"><br><br>

<button onclick="login()">Login</button>

</div>

<script>

async function getSignal(){

  const res = await fetch("/api/signal");
  const data = await res.json();

  document.getElementById("signal").innerText = data.signal;
  document.getElementById("conf").innerText = data.confidence + "%";

}

async function login(){

  const username = document.getElementById("user").value;
  const password = document.getElementById("pass").value;

  const res = await fetch("/api/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username,password})
  });

  alert(res.ok ? "Login OK" : "Error");

}

getSignal();

</script>

</body>
</html>
