<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER AI V2</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.app{
width:95%;
max-width:420px;
background:#0c1224;
border-radius:20px;
padding:15px;
}

/* CHART */
#chart{
height:300px;
border-radius:15px;
overflow:hidden;
}

/* SIGNAL BOX */
.signalBox{
margin-top:10px;
padding:15px;
border-radius:15px;
text-align:center;
background:#111a33;
}

.signal{
font-size:45px;
font-weight:bold;
}

.buy{color:#00ff9d;}
.sell{color:#ff3b5c;}
.wait{color:#facc15;}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#00ff9d;
font-weight:bold;
}

.list{
margin-top:10px;
}

.item{
padding:10px;
margin:6px 0;
background:#111a33;
border-radius:10px;
cursor:pointer;
}

.hidden{display:none;}

</style>

</head>

<body>

<div class="app">

<h3>🚀 SNIPER AI V2</h3>

<button onclick="scanMarkets()">🔄 SCAN MARKETS</button>

<div id="marketList" class="list"></div>

<div id="chart"></div>

<div class="signalBox">
<div id="signal" class="signal wait">WAIT</div>
<div id="strength">0%</div>
</div>

<button onclick="analyze()">🧠 ANALYZE</button>

</div>

<script>

let selected="BTCUSD";

/* ================= MARKET LIST ================= */
function scanMarkets(){

let markets=[
"BTCUSD","ETHUSD","EURUSD","GBPUSD",
"USDJPY","XAUUSD","NAS100","SPX500"
];

let box=document.getElementById("marketList");
box.innerHTML="";

markets.forEach(m=>{
let div=document.createElement("div");
div.className="item";
div.innerText=m;

div.onclick=()=>{
selected=m;
loadChart(m);
};

box.appendChild(div);
});

}

/* ================= CHART ================= */
function loadChart(symbol){

document.getElementById("chart").innerHTML="";

new TradingView.widget({
container_id:"chart",
width:"100%",
height:300,
symbol:"BINANCE:"+symbol,
interval:"1",
theme:"dark",
style:"1",
locale:"fr",
hide_top_toolbar:true,
allow_symbol_change:false
});

}

/* ================= ANALYZE ================= */
async function analyze(){

const res = await fetch(`/api/${selected}/1m`);
const data = await res.json();

let signalEl=document.getElementById("signal");
let strength=document.getElementById("strength");

signalEl.innerText=data.signal;
strength.innerText=(data.strength||0)+"%";

signalEl.className="signal " +
(data.signal==="BUY"?"buy":
data.signal==="SELL"?"sell":"wait");

}

</script>

</body>
</html>
