<script>

const API = "/signal";

async function analyze(){

try{

document.getElementById("signal").innerText = "ANALYZING...";

const symbol = document.getElementById("market").value.replace("/", "");

const res = await fetch(`${API}?symbol=${symbol}&tf=1min`);

const data = await res.json();

console.log("DATA:", data);

/* NO DATA SAFE */
if(!data || data.price == null){
document.getElementById("signal").innerText = "NO DATA";
document.getElementById("price").innerText = "PRICE: --";
document.getElementById("rsi").innerText = "RSI: --";
document.getElementById("conf").innerText = "CONFIDENCE: 0%";
return;
}

/* SIGNAL */
document.getElementById("signal").innerText = data.signal;

/* PRICE */
document.getElementById("price").innerText = "PRICE: " + data.price;

/* RSI */
document.getElementById("rsi").innerText = "RSI: " + data.rsi;

/* CONFIDENCE */
document.getElementById("conf").innerText =
"CONFIDENCE: " + data.confidence + "%";

}catch(err){

console.log(err);
document.getElementById("signal").innerText = "ERROR";

}

}

</script>
